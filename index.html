<!-- Cliente oficial de Supabase (auth + base de datos). -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* Pensado primero para el celu: botones grandes, todo a un toque, nada que deslizar de costado
   salvo la tira de días. En compu se acomoda en columnas más anchas. */
:root{
  /* Colores del logo de Nativo: contorno negro, sol amarillo → verde → agua turquesa. */
  --bg:#f3faf6; --card:#ffffff; --ink:#1f1d1e; --ink2:#4a5a56; --ink3:#8a9a95;
  --line:#d9ebe2; --line2:#bcd8cb;
  --sea:#0e8488; --sea2:#18b3b6; --sea-soft:#dcf4f1;
  --sun:#fbef46; --sun2:#ffc928; --lime:#8cc36b;
  --coral:#f0b400; --coral-soft:#fff7c9;
  --grad:linear-gradient(180deg,#ffc928 0%,#b9cc55 34%,#6cc483 66%,#1cb9bc 100%);
  --ok:#1f8a5b; --ok-soft:#e2f4ea; --warn:#a86a12; --warn-soft:#fbf0dc; --bad:#c2410c; --bad-soft:#fde8df;
  --f-display:"Fredoka",ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;
  --f-script:"Yellowtail","Brush Script MT",cursive;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --r:18px; --r2:12px; --shadow:0 1px 2px rgba(31,29,30,.05),0 6px 18px rgba(14,132,136,.08);
  --top-h:58px; --tabbar-h:64px;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;overflow-x:hidden;overflow-x:clip}
/* Sin "rebote" al llegar arriba/abajo (mostraba blanco) */
html,body{overscroll-behavior-y:none}
body{font-family:var(--f-body);background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45;min-height:100vh;min-height:100dvh;overflow-x:hidden;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--sea)}
.hidden{display:none!important}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
.muted{color:var(--ink2)} .small{font-size:14px} .tiny{font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3,.logo b,.t,.day b,.kpi b,.code,.price{font-family:var(--f-display);text-wrap:balance}
h1{font-weight:700} h2,h3{font-weight:600}
h2{font-size:20px;margin-bottom:10px} h3{font-size:16px;margin-bottom:8px}
.row{display:flex;align-items:center;gap:8px} .between{justify-content:space-between} .wrapf{flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
:focus-visible{outline:3px solid var(--sea2);outline-offset:2px}

/* ── Animaciones (suaves, y apagadas si el teléfono pide menos movimiento) ── */
@keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-7px) rotate(2deg)}}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.rise{animation:rise .35s var(--ease) both}
.rise:nth-child(2){animation-delay:.04s}.rise:nth-child(3){animation-delay:.08s}.rise:nth-child(4){animation-delay:.12s}.rise:nth-child(n+5){animation-delay:.16s}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ── Header ── */
.top{background:var(--ink);color:#fff;position:sticky;top:0;z-index:30;padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:var(--top-h);gap:10px}
.logo{display:flex;align-items:center;gap:9px;text-decoration:none;color:inherit;min-width:0}
.logo img{width:38px;height:38px;border-radius:50%;flex:none;transition:transform .5s var(--ease)}
.logo:hover img{transform:rotate(-12deg)}
.logo .wm{display:flex;flex-direction:column;line-height:1;min-width:0}
.logo b{font-weight:700;font-size:23px;color:var(--sun)}
.logo span{font-family:var(--f-script);font-size:14px;color:#7fd3da;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top nav{display:flex;gap:4px;flex:none}
.top nav a{color:#fff;text-decoration:none;font-size:14px;font-weight:600;padding:8px 13px;border-radius:999px;transition:background .2s,color .2s}
.top nav a.on{background:var(--sun);color:var(--ink)}
@media(max-width:430px){.logo span{font-size:12px}.logo b{font-size:21px}.top nav a{padding:8px 11px}}
@media(max-width:380px){.logo span{display:none}.logo b{font-size:21px}.top nav a{padding:7px 10px;font-size:13.5px}}
.demo-bar{background:var(--coral-soft);color:#6b5200;font-size:12.5px;text-align:center;padding:6px 16px}

/* ── Portada ── */
.hero{background:var(--grad);position:relative;overflow:hidden;padding:18px 0 46px}
.hero .wrap{display:flex;align-items:center;gap:14px}
.hero .badge{width:96px;height:auto;aspect-ratio:2132/2588;object-fit:contain;flex:none;filter:drop-shadow(0 6px 10px rgba(31,29,30,.22));animation:float 5s ease-in-out infinite;transform-origin:50% 80%}
.hero .copy{min-width:0}
.hero .tag{font-family:var(--f-script);font-size:20px;line-height:1;margin-bottom:2px;opacity:.85}
.hero h1{font-size:clamp(27px,7.4vw,44px);line-height:1.02}
.hero .facts{margin-top:10px}
.waves{position:absolute;left:0;bottom:-1px;width:200%;height:34px;animation:drift 14s linear infinite}
.waves path{fill:var(--bg)}
@media(min-width:700px){.hero{padding:30px 0 60px}.hero .badge{width:150px}.hero .wrap{gap:28px}}

.facts{display:flex;gap:6px;flex-wrap:wrap}
.facts span{background:rgba(255,255,255,.72);color:var(--ink);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:500;backdrop-filter:blur(4px)}
.facts b{font-family:var(--f-display);font-weight:600}

/* ── Bloques ── */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.card+.card{margin-top:12px}
.label{font-size:12px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.07em;margin:0 2px 8px}
.section{margin-top:18px}
.empty{text-align:center;padding:28px 16px;color:var(--ink2)}
.loading{padding:40px;text-align:center;color:var(--ink2)}
.err{background:var(--bad-soft);color:var(--bad);padding:10px 12px;border-radius:10px;font-size:14px;margin-bottom:12px}

/* Chips (filtros) */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none;overscroll-behavior-x:contain;touch-action:pan-x pan-y}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line2);background:var(--card);border-radius:999px;padding:6px 14px 6px 6px;font-size:15px;font-weight:600;white-space:nowrap;scroll-snap-align:start;transition:background .2s,border-color .2s,color .2s,transform .1s}
.chip.plain{padding:8px 16px}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--sun)}
.chip .avatar{width:30px;height:30px;font-size:13px}
.avatar{flex:none;width:40px;height:40px;border-radius:50%;background:var(--sun);color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink);font-family:var(--f-display);display:grid;place-items:center;font-weight:700}
img.avatar{object-fit:cover;background:var(--sea-soft)}
.avatar.lg{width:96px;height:96px;font-size:34px;box-shadow:inset 0 0 0 3px var(--ink)}
img.avatar.lg{border:3px solid var(--ink);box-shadow:none}
.photo-pick{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.photo-pick label.btn{cursor:pointer}
.photo-pick input{position:absolute;opacity:0;width:1px;height:1px}
.prow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 0}
.prow:first-of-type{border-top:0}
.prow .who{flex:1;min-width:0}
.prow .who b{display:block;font-size:16px}
.prow .who span{font-size:13px;color:var(--ink2)}
.prof-card{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:10px 0 0;padding:12px;animation:rise .25s var(--ease) both}
.prof-card .pc-txt{flex:1 1 160px;min-width:0}
.prof-card .pc-wa{flex:none;margin-left:auto}
.prof-card .avatar{width:52px;height:52px;font-size:18px}
.ticket{padding:0;overflow:hidden;margin-top:16px}
.ticket .tk-head{background:var(--grad);padding:16px;display:flex;align-items:center;gap:12px}
.ticket .tk-head img{width:58px;height:auto;filter:drop-shadow(0 3px 6px rgba(0,0,0,.2))}
.ticket .tk-head b{font-family:var(--f-display);font-size:22px;display:block;line-height:1.1}
.ticket .tk-body{padding:16px}
.ticket .when{font-family:var(--f-display);font-weight:600;font-size:22px;line-height:1.15}
.ticket .when span{display:block;font-size:30px;font-weight:700}
.tk-rows{margin:14px 0 4px;display:grid;gap:8px;font-size:15px}
.tk-rows div{display:flex;justify-content:space-between;gap:10px;border-top:1px dashed var(--line2);padding-top:8px}
.tk-rows span{color:var(--ink2)}
.tk-rows b{text-align:right}
.tk-acts{display:grid;gap:8px;margin-top:14px}
.tk-acts .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mine{display:grid;gap:8px;margin-top:16px}
.mine a{display:flex;align-items:center;gap:12px;background:var(--card);border:1.5px solid var(--ink);border-radius:var(--r);padding:12px 14px;text-decoration:none;color:var(--ink);box-shadow:3px 3px 0 var(--ink)}
.mine a .t{font-size:20px;font-weight:700}
.mine a .who{flex:1;min-width:0;font-size:14px}
.top nav a img{width:24px;height:24px;border-radius:50%;object-fit:cover;vertical-align:middle;margin:-4px 6px -4px -4px;border:2px solid var(--sun)}
.btn.google{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line2),0 1px 2px rgba(0,0,0,.06)}
.btn.google svg{width:20px;height:20px}
.perks{list-style:none;display:grid;gap:8px;margin:14px 0 18px;font-size:15px}
.perks li::before{content:"✓";display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--sun);box-shadow:inset 0 0 0 1.5px var(--ink);font-size:12px;font-weight:800;margin-right:10px}
.as-me{display:flex;align-items:center;gap:10px;background:var(--sea-soft);border-radius:14px;padding:10px 12px;margin-bottom:14px;font-size:15px}
.as-me .avatar{width:34px;height:34px;font-size:13px}
.quick-login{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--coral-soft);border-radius:14px;padding:10px 12px;margin-bottom:14px;font-size:14px}
.sp-cover{background:var(--grad);height:110px;margin:0 -16px;position:relative;overflow:hidden}
.sp-cover .waves{height:26px}
.sp-head{text-align:center;margin-top:-58px;position:relative}
.sp-head .avatar.xl{width:116px;height:116px;font-size:40px;margin:0 auto;border:4px solid var(--ink);box-shadow:4px 4px 0 var(--ink);animation:pop .5s var(--ease) both}
img.avatar.xl{border:4px solid var(--ink)}
.sp-head h1{font-size:28px;margin-top:10px}
.sp-head .bio-t{color:var(--ink2);margin:6px auto 0;max-width:420px}
.sp-head .tags{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.sp-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0 6px}
.sp-stats div{background:var(--card);border:1.5px solid var(--ink);border-radius:16px;padding:10px 6px;text-align:center;box-shadow:3px 3px 0 var(--ink)}
.sp-stats b{display:block;font-family:var(--f-display);font-size:26px;line-height:1.1}
.sp-stats span{font-size:12.5px;color:var(--ink2)}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
@media(max-width:360px){.badges{grid-template-columns:repeat(3,1fr)}}
.badge-i{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center;font-size:11.5px;font-weight:700;line-height:1.2}
.badge-i i{display:block;font-style:normal;font-size:30px;line-height:1.2}
.badge-i.off{opacity:.45;filter:grayscale(1)}
.badge-i.on{border-color:var(--ink);background:var(--coral-soft);animation:pop .4s var(--ease) both}
.hist{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.hist:first-of-type{border-top:0}
.hist .avatar{width:40px;height:40px;font-size:14px}
.hist .who{flex:1;min-width:0;font-size:14px}
.mini-av{width:22px;height:22px;border-radius:50%;object-fit:cover;vertical-align:-5px;margin-right:6px;border:1.5px solid var(--ink)}
.pill.train{background:var(--ink);color:var(--sun)}
.train-card{display:flex;gap:12px;align-items:center;background:var(--ink);color:#fff;border-radius:var(--r);padding:14px;margin-top:16px}
.train-card i{font-style:normal;font-size:30px}
.train-card .small{color:#cfe3e1}
.train-card.promo{align-items:flex-start;margin-top:22px}
.train-card.promo .small{margin-top:3px}
.plan-card{display:flex;gap:12px;align-items:center;background:var(--sun);border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);border-radius:var(--r);padding:14px;margin-top:16px}
.plan-card .pc-ic{font-size:30px;line-height:1}
.plan-card .pc-body{flex:1;min-width:0}
.plan-card b.t{font-family:var(--f-display);font-size:19px;display:block;line-height:1.15}
.plan-card .save{display:inline-block;background:var(--ink);color:var(--sun);border-radius:999px;padding:2px 9px;font-size:12.5px;font-weight:700;margin-top:4px}
.pass-count{display:flex;gap:8px;margin-top:6px}
.pass-count span{background:var(--ink);color:#fff;border-radius:12px;padding:6px 10px;font-size:12.5px;line-height:1.1;text-align:center;min-width:64px}
.pass-count b{display:block;font-family:var(--f-display);font-size:24px;color:var(--sun)}
.pass-count .soon b{color:#ff9d7a}
.picker-list{display:grid;gap:4px;margin-top:6px;max-height:240px;overflow:auto;overscroll-behavior:contain}
.picker-list button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:8px 10px;font-size:15px}
.picker-list button .avatar{width:32px;height:32px;font-size:12px}
.picker-list button span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.picked{display:flex;align-items:center;gap:10px;border:2px solid var(--ink);background:var(--coral-soft);border-radius:12px;padding:8px 10px}
.picked .avatar{width:32px;height:32px;font-size:12px}
.pass-bar{height:10px;background:rgba(31,29,30,.12);border-radius:5px;overflow:hidden;margin:8px 0 4px}
.pass-bar i{display:block;height:100%;background:var(--ink);border-radius:5px}
.use-pass{display:flex;align-items:center;gap:10px;background:var(--coral-soft);border:1.5px solid var(--ink);border-radius:14px;padding:10px 12px;margin-bottom:14px;font-size:15px}
.use-pass input{width:22px;height:22px;accent-color:var(--ink)}
.bio{font-size:14px;color:var(--ink2);margin:8px 2px 0;animation:rise .25s var(--ease) both}

/* Tira de días: queda pegada arriba al bajar */
.daybar{position:sticky;top:calc(var(--top-h) + env(safe-area-inset-top,0px));z-index:20;background:var(--bg);margin:0 -16px;padding:10px 16px 8px;border-bottom:1px solid transparent;transition:border-color .2s,box-shadow .2s}
.daybar.stuck{border-color:var(--line);box-shadow:0 6px 12px -10px rgba(31,29,30,.25)}
.days{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;overscroll-behavior-x:contain;margin:0 -16px;padding:0 16px}
.days::-webkit-scrollbar{display:none}
.day{flex:none;width:54px;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:7px 0 6px;text-align:center;scroll-snap-align:start;transition:background .2s,border-color .2s,color .2s,transform .1s}
.day:active{transform:scale(.94)}
.day small{display:block;font-size:11px;font-weight:600;text-transform:uppercase;color:var(--ink2);letter-spacing:.04em}
.day b{display:block;font-size:20px;line-height:1.15}
.day i{display:block;width:6px;height:6px;border-radius:50%;margin:2px auto 0;background:transparent}
.day.has i{background:var(--sea2)}
.day.off{opacity:.38;cursor:default}
.day.on{background:var(--ink);border-color:var(--ink);color:var(--sun)}
.day.on small{color:#fff}
.day.on i{background:var(--sun)}
.dayttl{font-family:var(--f-display);font-weight:600;font-size:19px;margin:14px 2px 10px}

/* Horario: toda la tarjeta se toca */
.slots{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.slot{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);transition:transform .12s,border-color .2s,box-shadow .2s}
.slot:active{transform:scale(.985)}
.slot:hover{border-color:var(--sea2)}
.slot .t{font-size:24px;font-weight:700;line-height:1;min-width:66px}
.slot .t small{display:block;font-family:var(--f-body);font-size:12px;font-weight:500;color:var(--ink2);margin-top:4px}
.slot .mid{flex:1;min-width:0}
.slot .who{font-weight:700;font-size:16px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.avatar.xs{width:28px;height:28px;font-size:11px;box-shadow:inset 0 0 0 1.5px var(--ink)}
.slot .meta{font-size:13px;color:var(--ink2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .go{flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--sun);box-shadow:inset 0 0 0 2px var(--ink);font-size:20px;font-weight:700}
.slot.full{opacity:.55;box-shadow:none}
.slot.full .go{background:#eef2ef;box-shadow:inset 0 0 0 2px var(--line2);color:var(--ink3)}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--sea-soft);color:var(--sea);margin-top:5px}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.gray{background:#eceeea;color:var(--ink2)}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:var(--r2);padding:12px 18px;min-height:46px;font-weight:700;background:var(--sea);color:#fff;text-decoration:none;font-size:15px;white-space:nowrap;transition:transform .1s,background .2s,box-shadow .1s}
.btn:active{transform:scale(.97)}

// Achica y recorta la foto (cuadrada, 320px) en el teléfono antes de subirla: pesa ~20 KB.
async function shrinkPhoto(file, size = 320) {
  const url = URL.createObjectURL(file);
  try {
    const img = new Image(); img.src = url; await img.decode();

  c = String(c || '').trim();
  if (!c) return '<span class="muted">sin contacto</span>';
  if (isIg(c)) return `<a href="https://instagram.com/${encodeURIComponent(c.replace(/^@/, ''))}" target="_blank" rel="noopener">@${esc(c.replace(/^@/, ''))}</a>`;
  return `<a href="${waLink(c, text)}" target="_blank" rel="noopener">${esc(c)}</a>`;
}

function waLink(phone, text) {
  let d = String(phone || '').replace(/\D/g, '');
  if (d.length === 10) d = '549' + d;                  // 341 5551234 → 549 341 5551234
  return `https://wa.me/${d}${text ? '?text=' + encodeURIComponent(text) : ''}`;
}
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 2600);
}
function askConfirm(msg, yes = 'Sí, seguir') {
  return new Promise(res => {
    $('ask-msg').textContent = msg; $('ask-yes').textContent = yes; $('ask').classList.remove('hidden');
    const done = v => { $('ask').classList.add('hidden'); res(v); };
    $('ask-yes').onclick = () => done(true); $('ask-no').onclick = () => done(false);
  });
}
// Con una ventana abierta la página de atrás no se mueve (en iPhone overflow:hidden no alcanza: se fija el body).
let lockedY = null;
function lockScroll() {
  if (lockedY !== null) return;
  lockedY = window.scrollY;
  Object.assign(document.body.style, { position: 'fixed', top: `-${lockedY}px`, left: '0', right: '0', width: '100%' });
}
function unlockScroll() {
  if (lockedY === null) return;
  Object.assign(document.body.style, { position: '', top: '', left: '', right: '', width: '' });
  const y = lockedY; lockedY = null;
  document.documentElement.style.scrollBehavior = 'auto'; window.scrollTo(0, y); document.documentElement.style.scrollBehavior = '';
}
function openModal(html) {
  $('modal-body').innerHTML = `<button class="x" onclick="closeModal()" aria-label="Cerrar">✕</button>` + html;
  $('modal').classList.remove('hidden'); lockScroll();
}
function closeModal() {
  $('modal').classList.add('hidden'); $('modal-body').innerHTML = ''; unlockScroll();
  if (livePending && !paneDirty()) setTimeout(() => liveRefresh(), 50);   // cambios que llegaron con la ventana abierta
}
function errMsg(e) {
  const m = e?.message || String(e);
  if (/Invalid login/i.test(m)) return 'Email o contraseña incorrectos';
  if (/Email not confirmed/i.test(m)) return 'Tenés que confirmar tu email (revisá tu casilla)';
  if (/Failed to fetch|NetworkError/i.test(m)) return 'Sin conexión. Probá de nuevo.';
  return m;
}
const store = {
  get(k, fb) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch { return fb; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};

/* ════════════════════════════ API · SUPABASE ════════════════════════════ */
function supabaseApi() {
  // PKCE: la vuelta de Google trae ?code=… y supabase-js lo canjea solo por la sesión.
  const c = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY, { auth: { flowType: 'pkce' } });
  const q = async p => { const { data, error } = await p; if (error) throw error; return data; };
  return {
    // Solo login/logout: ignora refrescos de token para no re-dibujar mientras alguien edita.
    ready: () => c.auth.getSession(),
    // Tiempo real: avisa cuando cambia algo que este usuario puede ver. Devuelve cómo cortarlo.
    live(cb) {
      const ch = c.channel('staff-live');
      ['slots', 'bookings', 'passes', 'students', 'profiles'].forEach(table => ch.on('postgres_changes', { event: '*', schema: 'public', table }, cb));
      ch.subscribe();
      return () => c.removeChannel(ch);
    },
    onAuth: cb => c.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT' || (ev === 'SIGNED_IN' && !st.me)) cb(); }),
    async signIn(email, password) { await q(c.auth.signInWithPassword({ email, password })); },
    async signUp(name, email, password) {
      return q(c.auth.signUp({ email, password, options: { data: { name }, emailRedirectTo: location.origin + location.pathname } }));
    },
    async signOut() { await c.auth.signOut(); },
    // Alumnos: entran con Google. La vuelta llega a la misma página con ?code=…
    async signInGoogle() {
      await q(c.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin + location.pathname, queryParams: { prompt: 'select_account' } } }));
    },
    async student() {
      const { data: { session } } = await c.auth.getSession();
      if (!session) return null;
      const me = await q(c.from('students').select('*').eq('id', session.user.id).maybeSingle());
      // La foto de Google cambia de link cada tanto: si no subió una propia, la renovamos al entrar.
      const g = session.user.user_metadata?.avatar_url || session.user.user_metadata?.picture;
      if (me && g && g !== me.avatar_url && (!me.avatar_url || /googleusercontent\.com/.test(me.avatar_url))) {
        me.avatar_url = g; c.from('students').update({ avatar_url: g }).eq('id', me.id).then(() => {}, () => {});
      }
      return me;
    },
    myBookings: () => q(c.rpc('my_bookings')),
    updateStudent: (id, patch) => q(c.from('students').update(patch).eq('id', id)),
    students: () => q(c.from('students').select('*').order('name')),
    // Abonos
    plans: () => q(c.from('plans').select('*').order('sort').order('price')),
    savePlan: pl => pl.id ? q(c.from('plans').update(pl).eq('id', pl.id)) : q(c.from('plans').insert(pl)),
    requestPass: planId => q(c.rpc('request_pass', { p_plan: planId })),
    myPasses: () => q(c.rpc('my_passes')),
    adminPasses: () => q(c.rpc('admin_passes')),
    activatePass: (id, method) => q(c.rpc('activate_pass', { p_pass: id, p_method: method })),
    grantPass: (studentId, planId, method) => q(c.rpc('grant_pass', { p_student: studentId, p_plan: planId, p_method: method })),
    cancelPass: id => q(c.rpc('cancel_pass', { p_pass: id })),
    reactivatePass: id => q(c.rpc('reactivate_pass', { p_pass: id })),
    passFutureBookings: id => q(c.from('bookings').select('id, slot:slot_id(starts_at)').eq('pass_id', id).neq('status', 'cancelled')).then(r => r.filter(b => new Date(b.slot.starts_at) > new Date()).length),
    async me() {
      const { data: { session } } = await c.auth.getSession();
      if (!session) return null;
      return q(c.from('profiles').select('*').eq('id', session.user.id).maybeSingle());
    },
    classTypes: () => q(c.from('class_types').select('*').order('sort').order('name')),
    publicProfes: () => q(c.rpc('public_profes')),
    publicSlots: (from, to) => q(c.rpc('public_slots', { p_from: from.toISOString(), p_to: to.toISOString() })),
    async bookingByCode(code) { const rows = await q(c.rpc('booking_by_code', { p_code: code })); return rows[0] || null; },
    cancelMyBooking: (code, phone) => q(c.rpc('cancel_my_booking', { p_code: code, p_phone: phone || null })),
    async book(b) {
      const rows = await q(c.rpc('book_slot', { p_slot: b.slot_id, p_name: b.name, p_phone: b.phone, p_email: b.email || null, p_people: b.people, p_use_pass: !!b.usePass }));
      return rows[0];
    },
    staffSlots: (from, to) => q(c.from('slots').select('*, profe:profe_id(name), bookings(*, student:student_id(name,avatar_url,training))')
      .gte('starts_at', from.toISOString()).lt('starts_at', to.toISOString()).order('starts_at')),
    createSlots: rows => q(c.from('slots').insert(rows)),
    updateSlot: (id, patch) => q(c.from('slots').update(patch).eq('id', id)),
    deleteSlot: id => q(c.from('slots').delete().eq('id', id)),
    deleteSuspended: id => q(c.rpc('delete_suspended_slot', { p_slot: id })),
    deleteSlotForce: (id, force) => q(c.rpc('delete_slot', { p_slot: id, p_force: !!force })),
    createBooking: row => q(c.from('bookings').insert(row)),
    updateBooking: (id, patch) => q(c.from('bookings').update(patch).eq('id', id)),
    // El monto lo calcula el servidor a partir de la reserva: el navegador solo manda el código.
    async checkout(code) {
      const r = await fetch('/api/mp-checkout', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code }) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.error || 'No se pudo iniciar el pago');
      location.href = j.url;                                   // → Mercado Pago
    },
    cancelSlotBookings: slotId => q(c.from('bookings').update({ status: 'cancelled' }).eq('slot_id', slotId).neq('status', 'cancelled')),
    profiles: () => q(c.from('profiles').select('*').order('approved', { ascending: true }).order('name')),
    // Crear la cuenta de otro usuario necesita la clave secreta → lo hace una función del servidor que verifica que seas admin.
    async adminCall(body) {
      const { data: { session } } = await c.auth.getSession();
      const r = await fetch('/api/invite-profe', { method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session?.access_token}` }, body: JSON.stringify(body) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.error || 'No se pudo completar. Probá de nuevo.');
      return j;
    },
    inviteProfe(p) { return this.adminCall(p); },                       // → { password } para mandarle por WhatsApp
    resetProfePassword(id) { return this.adminCall({ action: 'reset', id }); },
    removeProfe(id) { return this.adminCall({ action: 'remove', id }); },  // → { result: 'deleted' | 'archived' }
    async resetPassword(email) {
      await q(c.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname + '?staff=1' }));
    },
    async setPassword(password) { await q(c.auth.updateUser({ password })); },
    // Foto: se sube a avatars/<id del profe>/<fecha>.webp y se borra la anterior.
    async uploadAvatar(profileId, blob, oldUrl) {
      const ext = blob.type === 'image/webp' ? 'webp' : blob.type === 'image/png' ? 'png' : 'jpg';
      const path = `${profileId}/${Date.now()}.${ext}`;
      await q(c.storage.from('avatars').upload(path, blob, { contentType: blob.type, cacheControl: '31536000' }));
      const old = String(oldUrl || '').split('/avatars/')[1];
      if (old) c.storage.from('avatars').remove([decodeURIComponent(old)]).catch(() => {});
      return c.storage.from('avatars').getPublicUrl(path).data.publicUrl;
    },
    updateProfile: (id, patch) => q(c.from('profiles').update(patch).eq('id', id)),
    saveClassType: ct => ct.id ? q(c.from('class_types').update(ct).eq('id', ct.id)) : q(c.from('class_types').insert(ct)),
    deleteClassType: id => q(c.from('class_types').delete().eq('id', id)),
  };
}

/* ════════════════════════════ API · DEMO (localStorage) ════════════════════════════
   Imita las mismas reglas que la base real (cupos, roles, % del profe) para poder
   mostrar la app sin configurar nada.                                               */
function demoApi() {
  const KEY = 'nativo_demo_v8', UKEY = 'nativo_demo_user', SKEY = 'nativo_demo_student';
  let db = store.get(KEY, null);
  if (!db) { db = demoSeed(); store.set(KEY, db); }
  const save = () => store.set(KEY, db);
  const meId = () => store.get(UKEY, null);
  const meP = () => db.profiles.find(p => p.id === meId()) || null;
  const isAdmin = () => { const m = meP(); return !!(m && m.approved && m.role === 'admin'); };
  const booked = sid => db.bookings.filter(b => b.slot_id === sid && b.status !== 'cancelled').reduce((a, b) => a + b.people, 0);
  const wait = v => new Promise(r => setTimeout(() => r(structuredClone(v)), 120));
  const demoUsed = pid => db.bookings.filter(b => b.pass_id === pid && b.status !== 'cancelled').reduce((a, b) => a + b.people, 0);
  const demoActive = days => { const t = dayKey(new Date()); return { starts_on: t, expires_on: dayKey(addDays(new Date(), days - 1)), paid_at: new Date().toISOString() }; };
  const fail = m => Promise.reject(new Error(m));
  let authCb = () => {};
  return {
    demo: true,
    reset() { db = demoSeed(); save(); },
    onAuth: cb => { authCb = cb; },
    // Demo: otra pestaña abierta con la demo hace de "otro profe".
    live(cb) { const f = e => { if (e.key === KEY) { db = store.get(KEY, db); cb(); } }; addEventListener('storage', f); return () => removeEventListener('storage', f); },
    loginAs(id) { store.set(UKEY, id); authCb(); },
    async signIn() { return fail('En modo demo elegí un perfil de la lista'); },
    async signUp() { return fail('En modo demo no se crean cuentas'); },
    async signOut() { store.del(UKEY); store.del(SKEY); authCb(); },
    // "Google" de mentira: entra como una alumna de ejemplo con clases ya tomadas.
    async signInGoogle() { store.set(SKEY, 'st-demo'); await wait(null); finishLogin(); },
    student: () => wait(db.students.find(x => x.id === store.get(SKEY, null)) || null),
    myBookings() {
      const sid = store.get(SKEY, null);
      return wait(db.bookings.filter(b => sid && b.student_id === sid).map(b => { const s = db.slots.find(x => x.id === b.slot_id), p = db.profiles.find(x => x.id === s.profe_id);
        return { code: b.code, status: b.status, paid: b.paid, people: b.people, amount: b.amount, title: s.title, starts_at: s.starts_at, duration_min: s.duration_min, location: s.location, slot_status: s.status, profe_name: p?.name, profe_avatar: p?.avatar_url }; })
        .sort((a, b) => b.starts_at.localeCompare(a.starts_at)));
    },
    updateStudent(id, patch) {
      const x = db.students.find(y => y.id === id);
      if (!isAdmin() && 'training' in patch && (x.training === 'approved' || !['none', 'requested'].includes(patch.training))) delete patch.training;
      Object.assign(x, patch); save(); return wait(null);
    },
    students: () => wait(db.students.slice().sort((a, b) => a.name.localeCompare(b.name))),
    plans: () => wait((db.plans || []).slice().sort((a, b) => a.sort - b.sort)),
    savePlan(pl) { db.plans ||= []; if (pl.id) Object.assign(db.plans.find(x => x.id === pl.id), pl); else db.plans.push({ ...pl, id: uid() }); save(); return wait(null); },
    requestPass(planId) {
      const sid = store.get(SKEY, null), pl = db.plans.find(x => x.id === planId);
      if (!sid) return fail('Entrá con tu cuenta para pedir un abono');
      if (db.passes.some(x => x.student_id === sid && x.status === 'pending')) return fail('Ya tenés un pedido de abono pendiente');
      db.passes.push({ id: uid(), student_id: sid, plan_id: pl.id, name: pl.name, price: pl.price, classes_total: pl.classes, days_valid: pl.days_valid, status: 'pending', created_at: new Date().toISOString() });
      save(); return wait(null);
    },
    myPasses() { const sid = store.get(SKEY, null); return wait(db.passes.filter(x => x.student_id === sid && x.status !== 'cancelled').map(x => ({ ...x, used: demoUsed(x.id) })).reverse()); },
    adminPasses() { return wait(db.passes.map(x => { const st2 = db.students.find(y => y.id === x.student_id) || {}; return { ...x, used: demoUsed(x.id), student_name: st2.name, student_avatar: st2.avatar_url, student_phone: st2.phone }; }).reverse()); },
    activatePass(id, method) { const x = db.passes.find(y => y.id === id); Object.assign(x, demoActive(x.days_valid), { status: 'active', payment_method: method }); save(); return wait(null); },
    grantPass(studentId, planId, method) { const pl = db.plans.find(y => y.id === planId);
      db.passes.push({ id: uid(), student_id: studentId, plan_id: pl.id, name: pl.name, price: pl.price, classes_total: pl.classes, days_valid: pl.days_valid, status: 'active', payment_method: method, created_at: new Date().toISOString(), ...demoActive(pl.days_valid) }); save(); return wait(null); },
    cancelPass(id) {
      db.passes.find(y => y.id === id).status = 'cancelled'; let n = 0;
      db.bookings.forEach(b => { const s2 = db.slots.find(x => x.id === b.slot_id);
        if (b.pass_id === id && b.status !== 'cancelled' && new Date(s2.starts_at) > new Date()) { Object.assign(b, { pass_id: null, paid: false, payment_method: null, amount: s2.price * b.people }); n++; } });
      save(); return wait(n);
    },
    reactivatePass(id) { const x = db.passes.find(y => y.id === id); x.status = x.paid_at ? 'active' : 'pending'; save(); return wait(null); },
    passFutureBookings(id) { return wait(db.bookings.filter(b => b.pass_id === id && b.status !== 'cancelled' && new Date(db.slots.find(x => x.id === b.slot_id).starts_at) > new Date()).length); },
    me: () => wait(meP()),
    classTypes: () => wait(db.class_types.slice().sort((a, b) => a.sort - b.sort)),
    publicProfes: () => wait(db.profiles.filter(p => p.approved && teaches(p)).map(({ id, name, bio, avatar_url, phone, public_whatsapp }) => ({ id, name, bio, avatar_url, whatsapp: public_whatsapp !== false ? phone || null : null }))),
    publicSlots(from, to) {
      const lo = Math.max(+from, Date.now());
      return wait(db.slots.filter(s => s.status === 'open' && !s.members_only && +new Date(s.starts_at) >= lo && +new Date(s.starts_at) < +to)
        .sort((a, b) => a.starts_at.localeCompare(b.starts_at))
        .map(s => ({ ...s, profe_name: db.profiles.find(p => p.id === s.profe_id)?.name, booked: booked(s.id) })));
    },
    cancelMyBooking(code, phone) {
      const b = db.bookings.find(x => x.code === String(code).toUpperCase()); if (!b) return fail('No encontramos esa reserva');
      const s = db.slots.find(x => x.id === b.slot_id), d = v => String(v || '').replace(/\D/g, '').slice(-8);
      const mine = (st.student && b.student_id === st.student.id) || (d(phone).length >= 6 && d(phone) === d(b.customer_phone));
      if (!mine) return fail('El WhatsApp no coincide con el de la reserva');
      if (new Date(s.starts_at) < addMin(new Date(), CONFIG.CANCEL_HOURS * 60)) return fail(`Faltan menos de ${CONFIG.CANCEL_HOURS} horas: para cancelar escribinos por WhatsApp`);

    async book(b) {

      if (digits.length < 8) return fail('Ingresá un WhatsApp válido (con característica)');
      if (!s || s.status !== 'open') return fail('Ese horario ya no está disponible');
      if (new Date(s.starts_at) <= new Date()) return fail('Ese horario ya pasó');
      if (s.members_only && db.students.find(x => x.id === store.get(SKEY, null))?.training !== 'approved') return fail('Esta clase es solo para alumnos de entrenamiento');
      const left = s.capacity - booked(s.id);
      if (b.people > left) return fail(`Quedan ${Math.max(left, 0)} lugares en ese horario`);
      if (db.bookings.some(x => x.slot_id === s.id && x.status !== 'cancelled' && x.customer_phone.replace(/\D/g, '').slice(-10) === digits.slice(-10)))

      let amount = s.price * b.people, pass = null;
      if (b.usePass) {
        const day = dayKey(s.starts_at);
        pass = db.passes.filter(x => x.student_id === store.get(SKEY, null) && x.status === 'active' && x.starts_on <= day && day <= x.expires_on).sort((a, c) => a.expires_on.localeCompare(c.expires_on))[0];
        if (!pass) return fail('No tenés un abono activo para esa fecha');
        const left = pass.classes_total - demoUsed(pass.id);

    updateBooking(id, patch) { Object.assign(db.bookings.find(b => b.id === id), patch); save(); return wait(null); },

/* ── "Mi reserva": link propio, comprobante en imagen y recordatorio en el celu ── */
const MINE = 'nativo_mis_reservas';
function rememberBooking(code, starts_at) {
  const list = store.get(MINE, []).filter(x => x.code !== code && new Date(x.starts_at) > addDays(new Date(), -1));
  list.push({ code, starts_at }); store.set(MINE, list.slice(-10));
}
// Las reservas guardadas en el celu se revisan contra la base: si se borró la clase, se canceló
// o se suspendió, deja de aparecer en "Tus próximas clases"; si cambió el horario, se actualiza.
async function syncMine() {
  const list = myUpcoming(); if (!list.length) return;
  const found = await Promise.all(list.map(x => api.bookingByCode(x.code).then(r => r || null, () => undefined)));
  const drop = new Set(), moved = {};
  list.forEach((x, i) => {
    const r = found[i];
    if (r === null || (r && (r.status === 'cancelled' || r.slot_status === 'cancelled'))) drop.add(x.code);
    else if (r?.starts_at) moved[x.code] = r.starts_at;      // undefined = sin conexión: no se toca
  });
  store.set(MINE, store.get(MINE, []).filter(x => !drop.has(x.code)).map(x => moved[x.code] ? { ...x, starts_at: moved[x.code] } : x));
}
const myUpcoming = () => store.get(MINE, []).filter(x => new Date(x.starts_at) > addMin(new Date(), -120)).sort((a, b) => a.starts_at.localeCompare(b.starts_at));
const ticketUrl = code => location.origin + location.pathname + '#r-' + code;
function calLink(r) {
  const g = d => new Date(d).toISOString().replace(/[-:]|\.\d{3}/g, '');
  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent('SUP · ' + r.title + ' (Nativo)')}&dates=${g(r.starts_at)}/${g(addMin(r.starts_at, r.duration_min || 60))}`
    + `&details=${encodeURIComponent(`Reserva ${r.code} con ${r.profe_name}\n${ticketUrl(r.code)}`)}&location=${encodeURIComponent(r.location || CONFIG.LOCATION)}`;
}
function ticketState(r) {
  if (r.status === 'cancelled' || r.slot_status === 'cancelled') return ['bad', r.slot_status === 'cancelled' ? 'Clase suspendida' : 'Cancelada'];
  if (new Date(r.starts_at) < addMin(new Date(), -(r.duration_min || 60))) return ['gray', 'Clase terminada'];
  return r.paid ? ['ok', 'Confirmada · Pagada'] : ['ok', 'Confirmada'];
}

// Comprobante como imagen (1080×1350, formato historia/galería), dibujado en el teléfono.
async function saveTicketImage(btn) {
  const r = st.ticket; if (!r) return;
  btn.disabled = true; const label = btn.textContent; btn.textContent = 'Generando…';
  try {
    await document.fonts?.ready;
    const W = 1080, H = 1350, c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d');
    const grad = g.createLinearGradient(0, 0, 0, H);
    [[0, '#ffc928'], [.34, '#b9cc55'], [.66, '#6cc483'], [1, '#1cb9bc']].forEach(([o, col]) => grad.addColorStop(o, col));
    g.fillStyle = grad; g.fillRect(0, 0, W, H);
    const logo = new Image(); logo.src = 'img/logo.webp'; await logo.decode().catch(() => {});
    if (logo.naturalWidth) g.drawImage(logo, 70, 60, 230, 230 * logo.naturalHeight / logo.naturalWidth);
    const disp = '"Fredoka", "Arial Rounded MT Bold", sans-serif', body = '"Figtree", system-ui, sans-serif';
    g.fillStyle = '#1f1d1e'; g.font = `700 74px ${disp}`; g.fillText('Tu clase de SUP', 330, 175);
    g.font = `500 38px ${body}`; g.fillText('Nativo · Escuela de SUP', 334, 235);
    const card = (x, y, w, h, rad) => { g.beginPath(); g.roundRect(x, y, w, h, rad); };
    g.fillStyle = '#1f1d1e'; card(78, 398, W - 140, 860, 44); g.fill();      // sombra tipo sticker
    g.fillStyle = '#ffffff'; card(64, 384, W - 140, 860, 44); g.fill();
    g.lineWidth = 6; g.strokeStyle = '#1f1d1e'; g.stroke();
    g.fillStyle = '#1f1d1e'; g.font = `600 52px ${disp}`; g.fillText(fmtDayLong(r.starts_at), 120, 490);
    g.font = `700 120px ${disp}`; g.fillText(`${hhmm(r.starts_at)} hs`, 116, 620);
    const rows = [['Profe', r.profe_name], ['Lugar', r.location || CONFIG.LOCATION], ['Personas', String(r.people)], ['Total', r.payment_method === 'abono' ? `${r.people} ${r.people > 1 ? 'clases' : 'clase'} de tu abono` : money(r.amount) + (r.paid ? ' · pagado' : '')]];
    rows.forEach(([k, v], i) => {
      const y = 710 + i * 78; g.strokeStyle = '#bcd8cb'; g.lineWidth = 3; g.setLineDash([12, 10]); g.beginPath(); g.moveTo(120, y - 48); g.lineTo(W - 136, y - 48); g.stroke(); g.setLineDash([]);
      g.fillStyle = '#4a5a56'; g.font = `500 38px ${body}`; g.fillText(k, 120, y);
      g.fillStyle = '#1f1d1e'; g.textAlign = 'right';
      let fs = 38; do g.font = `700 ${fs}px ${body}`; while (g.measureText(v).width > 660 && --fs > 26);   // achica la letra si no entra
      let t = v; while (g.measureText(t).width > 660 && t.length > 4) t = t.slice(0, -2); if (t !== v) t += '…';
      g.fillText(t, W - 136, y); g.textAlign = 'left';
    });
    g.fillStyle = '#fbef46'; card(120, 1040, W - 256, 150, 30); g.fill(); g.lineWidth = 6; g.strokeStyle = '#1f1d1e'; g.stroke();
    g.fillStyle = '#1f1d1e'; g.font = `700 96px ${disp}`; g.textAlign = 'center'; g.fillText(r.code.split('').join(' '), W / 2 - 8, 1148);
    g.font = `500 32px ${body}`; g.fillText(ticketUrl(r.code).replace(/^https?:\/\//, ''), W / 2, 1305); g.textAlign = 'left';
    const blob = await new Promise(ok => c.toBlob(ok, 'image/png'));
    const file = new File([blob], `nativo-reserva-${r.code}.png`, { type: 'image/png' });
    if (navigator.canShare?.({ files: [file] })) { try { await navigator.share({ files: [file], title: 'Mi reserva · Nativo' }); return; } catch (e) { if (e.name === 'AbortError') return; } }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = file.name; document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000); toast('Comprobante descargado ✓');
  } catch (e) { toast('No se pudo generar la imagen. Sacale captura a esta pantalla.'); }
  finally { btn.disabled = false; btn.textContent = label; }
}

const LIVE_TABS = ['agenda', 'resumen', 'numeros', 'profes', 'abonos'];
let liveOff = null, liveT = null, livePending = false;
// ¿Hay algo escrito/elegido en la pantalla que todavía no se guardó?
const paneDirty = () => [...document.querySelectorAll('#pane input, #pane textarea, #pane select')].some(i =>
  i.type === 'checkbox' || i.type === 'radio' ? i.checked !== i.defaultChecked
  : i.tagName === 'SELECT' ? [...i.options].some(o => o.selected !== o.defaultSelected)
  : i.value !== i.defaultValue);
function startLive() {
  if (liveOff || !st.me?.approved || !api.live) return;
  try { liveOff = api.live(() => { clearTimeout(liveT); liveT = setTimeout(liveRefresh, 800); }); } catch { liveOff = null; }
}
function stopLive() { if (liveOff) { try { liveOff(); } catch {} } liveOff = null; hideLiveBar(); }
const staffBusy = () => !$('modal').classList.contains('hidden') || !$('ask').classList.contains('hidden') || paneDirty();
async function liveRefresh(force) {
  if (!$('pane') || !st.me?.approved || !LIVE_TABS.includes(st.tab)) return;
  if (!force && staffBusy()) { showLiveBar(); return; }
  hideLiveBar();
  const y = window.scrollY, open = [...document.querySelectorAll('#pane details[open] > summary')].map(x => x.textContent);
  try { await PANES[st.tab](); } catch { return; }
  document.querySelectorAll('#pane details > summary').forEach(x => { if (open.includes(x.textContent)) x.parentElement.open = true; });
  window.scrollTo(0, y);
}
function showLiveBar() {

async function paneAgenda() {
  const now = new Date();
  const from = st.agendaPast ? addDays(startOfDay(now), -30) : startOfDay(now);
  const to = st.agendaPast ? now : addDays(startOfDay(now), 60);
  const isAdmin = st.me.role === 'admin';
  try {
    st.staffSlots = await api.staffSlots(from, to);
    if (isAdmin && !st.allProfiles.length) st.allProfiles = await api.profiles();
  } catch (e) { paneEl().innerHTML = `<div class="err">${esc(errMsg(e))}</div>`; return; }
  let list = st.staffSlots.filter(s => !st.agendaProfe || s.profe_id === st.agendaProfe);
  if (st.agendaPast) list = list.reverse();
  // Las suspendidas no ocupan lugar: quedan ocultas y se pueden ver o borrar desde un botón.
  const susp = list.filter(s => s.status === 'cancelled');
  if (!st.showSusp) list = list.filter(s => s.status !== 'cancelled');
  const groups = {};
  list.forEach(s => (groups[dayKey(s.starts_at)] ||= []).push(s));
  const todayK = dayKey(now), tomorrowK = dayKey(addDays(now, 1));
  const dayName = k => k === todayK ? 'Hoy' : k === tomorrowK ? 'Mañana' : fmtDayLong(k + 'T12:00');
  paneEl().innerHTML = `
    <div class="seg-tabs"><button class="${!st.agendaPast ? 'on' : ''}" onclick="st.agendaPast=false;paneAgenda()">Próximas</button>
      <button class="${st.agendaPast ? 'on' : ''}" onclick="st.agendaPast=true;paneAgenda()">Pasadas</button></div>
    ${isAdmin ? `<div class="chips" style="margin-top:10px"><button class="chip plain ${!st.agendaProfe ? 'on' : ''}" onclick="st.agendaProfe='';paneAgenda()">Todos</button>
      ${teaches(st.me) ? `<button class="chip plain ${st.agendaProfe === st.me.id ? 'on' : ''}" onclick="st.agendaProfe='${st.me.id}';paneAgenda()">Mis clases</button>` : ''}
      ${st.allProfiles.filter(p => p.approved && teaches(p) && p.id !== st.me.id).map(p => `<button class="chip plain ${st.agendaProfe === p.id ? 'on' : ''}" onclick="st.agendaProfe='${p.id}';paneAgenda()">${esc(p.name)}</button>`).join('')}</div>` : ''}
    ${susp.length ? `<div class="row wrapf" style="margin-top:12px">
      <button class="btn ghost sm" onclick="st.showSusp=!st.showSusp;paneAgenda()">${st.showSusp ? 'Ocultar' : 'Ver'} ${susp.length} ${susp.length === 1 ? 'suspendida' : 'suspendidas'}</button>
      ${st.showSusp ? `<button class="btn danger sm" onclick="deleteAllSuspended()">Borrar todas las suspendidas</button>` : ''}</div>` : ''}
    ${Object.keys(groups).length ? Object.entries(groups).map(([k, ss]) => `<div class="dayhead">${esc(dayName(k))}</div>${ss.map(slotCard).join('')}`).join('')
      : `<div class="card empty" style="margin-top:14px">${st.agendaPast ? 'No hubo clases en los últimos 30 días.' : `No tenés clases creadas todavía.<div style="margin-top:14px"><button class="btn coral" onclick="setTab('cargar')">+ Crear mi primera clase</button></div>`}</div>`}`;
}

function slotCard(s) {
  const act = s.bookings.filter(b => b.status !== 'cancelled');
  const people = act.reduce((a, b) => a + b.people, 0);
  const cancelled = s.status === 'cancelled', past = isPast(s);
  // Parte del profe = % × lo marcado como pagado. Lo no marcado se muestra aparte.
  const pp = (+s.profe_pct || 0) / 100;
  const share = act.filter(b => b.paid).reduce((a, b) => a + +b.amount, 0) * pp;
  const pend = act.filter(b => !b.paid && b.status !== 'no_show').reduce((a, b) => a + +b.amount, 0) * pp;
  const bks = s.bookings.slice().sort((a, b) => (a.status === 'cancelled') - (b.status === 'cancelled'));
  const mine = st.me.role === 'admin' ? 'profe' : 'para vos';
  return `<div class="card sslot rise ${cancelled ? 'cancelled' : ''}">
    <div class="hd"><div class="t num">${hhmm(s.starts_at)}</div>
      <div class="info"><b>${esc(s.title)}</b>${s.members_only ? ' <span class="pill train" style="margin:0 0 0 4px">🏅</span>' : ''}<div>${st.me.role === 'admin' ? `con ${esc(s.profe?.name)} · ` : ''}${s.duration_min} min${s.location ? ' · ' + esc(s.location) : ''}</div></div>
      ${cancelled ? '<span class="pill bad" style="margin:0">Suspendida</span>' : `<span class="cap num ${people >= s.capacity ? 'full' : ''}">${people}/${s.capacity}</span>`}</div>
    ${!cancelled && (share > 0 || pend > 0) ? `<div class="money-line num">${share > 0 ? `<span class="ok">${mine}: ${money(share)}</span>` : ''}${pend > 0 ? `<span class="warn">${past ? 'falta marcar pago' : 'a cobrar'}: ${money(pend)}</span>` : ''}</div>` : ''}
    ${bks.map(b => bookingRow(s, b)).join('')}
    ${cancelled ? `<div class="slot-foot"><button class="btn danger sm" onclick="deleteSuspended('${s.id}')">Borrar clase suspendida</button></div>` : `<div class="slot-foot"><button class="btn ghost sm" onclick="manualBooking('${s.id}')">+ Anotar alumno</button>
      <button class="btn ghost sm" style="flex:0 0 auto" onclick="slotMenu('${s.id}')" aria-label="Más opciones">${ICON.more.replace('<svg', '<svg width="20" height="20"')}</button></div>`}
  </div>`;
}
function bookingRow(s, b) {

function setCreateMode() {

function fillType(id) {
  const t = st.types.find(x => x.id === id), f = $('cf'); if (!t) return;
  f.title.value = t.name; f.dur.value = t.duration_min; f.cap.value = t.capacity; f.price.value = t.price; previewCreate();
}
function buildSlots() {
  const f = $('cf'), now = new Date();
  if (f.mode.value === 'one') {
    if (!f.date.value || !f.time.value) return { rows: [] };
    const start = new Date(`${f.date.value}T${f.time.value}`);
    if (isNaN(start)) return { rows: [] };
    if (start <= now) return { error: 'Ese día y hora ya pasaron' };
    return { rows: [start] };
  }
  const wds = [...f.querySelectorAll('[name=wd]:checked')].map(x => +x.value);
  const times = f.times.value.split(/[,\s]+/).map(x => x.trim()).filter(Boolean);
  const bad = times.filter(t => !/^([01]?\d|2[0-3])[:.]\d{2}$/.test(t));
  if (bad.length) return { error: `Hora inválida: ${bad.join(', ')} (escribila así: 09:30)` };
  const out = [];
  if (!f.from.value || !f.to.value) return { rows: out };
  for (let d = new Date(f.from.value + 'T00:00'); d <= new Date(f.to.value + 'T00:00') && out.length <= 400; d = addDays(d, 1)) {
    if (!wds.includes(d.getDay())) continue;
    times.forEach(t => {
      const [h, m] = t.split(/[:.]/), start = new Date(d); start.setHours(+h, +m, 0, 0);
      if (start > now) out.push(start);
    });
  }
  return { rows: out };
}
function previewCreate() {
  const r = buildSlots(), f = $('cf'), n = r.rows?.length || 0;
  $('cf-prev').innerHTML = r.error ? `<span style="color:var(--bad)">${esc(r.error)}</span>`
    : f.mode.value === 'one' ? (n ? `<span>${esc(fmtDayLong(r.rows[0]))}</span> · ${hhmm(r.rows[0])} hs` : '')
    : n ? `Se van a crear <b>${n}</b> clases` : 'Elegí al menos un día y una hora';
  $('cf-btn').textContent = f.mode.value === 'one' || n <= 1 ? 'Crear clase' : `Crear ${n} clases`;
  if (!r.error && st.types.find(t => t.id === f.type.value)?.members_only) $('cf-prev').innerHTML += ' · <span class="pill train" style="margin:0">🏅 Solo entrenamiento</span>';
  $('cf-btn').disabled = !!r.error || !n;
}
async function doCreate(ev) {
  ev.preventDefault();
  const f = $('cf'), r = buildSlots(); if (r.error || !r.rows.length) return;
  if (r.rows.length > 400) return toast('Demasiados horarios: acortá el rango');
  const profe_id = f.profe ? f.profe.value : st.me.id;
  $('cf-btn').disabled = true;
  try {
    const first = r.rows.reduce((a, b) => a < b ? a : b), last = r.rows.reduce((a, b) => a > b ? a : b);
    const existing = new Set((await api.staffSlots(first, addMin(last, 1))).filter(s => s.profe_id === profe_id && s.status === 'open').map(s => +new Date(s.starts_at)));
    const rows = r.rows.filter(d => !existing.has(+d)).map(d => ({
      profe_id, class_type_id: f.type.value || null, title: f.title.value.trim(), starts_at: d.toISOString(), members_only: !!st.types.find(t => t.id === f.type.value)?.members_only,
      duration_min: +f.dur.value, capacity: +f.cap.value, price: +f.price.value, location: f.loc.value.trim() || null, notes: f.notes.value.trim() || null,
    }));
    if (rows.length) await api.createSlots(rows);
    toast(rows.length ? `${rows.length === 1 ? 'Clase creada' : rows.length + ' clases creadas'}${r.rows.length - rows.length ? ` · ${r.rows.length - rows.length} ya existían` : ''} ✓` : 'Esa clase ya existía');
    st.agendaPast = false; setTab('agenda');
  } catch (e) { toast(errMsg(e)); $('cf-btn').disabled = false; }
}

/* ── Números: resumen (admin) / mis números (profe) ──
   Por reserva no cancelada de un horario no suspendido:
     cobrado       = Σ monto de reservas marcadas "pagó"
     parte profe   = Σ cobrado × % del profe (copiado al horario al crearlo)
     neto escuela  = cobrado − parte profe
     por cobrar    = Σ monto sin pagar (confirmada o vino)
     ocupación     = Σ personas / Σ cupo                                            */
function computeStats(slots) {
  const tot = { cobrado: 0, profe: 0, porCobrar: 0, clases: 0, alumnos: 0, cupo: 0, noShow: 0 };
  const by = {}, byType = {}, bySrc = {};
  const add = (map, key, label) => (map[key] ||= { id: key, label, cobrado: 0, profe: 0, porCobrar: 0, clases: 0, alumnos: 0, cupo: 0 });
  slots.filter(s => s.status !== 'cancelled').forEach(s => {
    const P = add(by, s.profe_id, s.profe?.name || '—'), T = add(byType, s.title, s.title);
    const act = s.bookings.filter(b => b.status !== 'cancelled');
    const people = act.filter(b => b.status !== 'no_show').reduce((a, b) => a + b.people, 0);
    const cobrado = act.filter(b => b.paid).reduce((a, b) => a + +b.amount, 0);
    const porCobrar = act.filter(b => !b.paid && b.status !== 'no_show').reduce((a, b) => a + +b.amount, 0);
    const profe = cobrado * (+s.profe_pct || 0) / 100;
    const dada = isPast(s) && people > 0 ? 1 : 0;
    for (const o of [tot, P, T]) { o.cobrado += cobrado; o.profe += profe; o.porCobrar += porCobrar; o.clases += dada; o.alumnos += people; o.cupo += s.capacity; }
    tot.noShow += act.filter(b => b.status === 'no_show').reduce((a, b) => a + b.people, 0);
    act.filter(b => b.status !== 'no_show').forEach(b => {
      const k = b.source || 'web', C = (bySrc[k] ||= { label: SOURCES[k] || k, reservas: 0, alumnos: 0, cobrado: 0 });
      C.reservas++; C.alumnos += b.people; if (b.paid) C.cobrado += +b.amount;
    });
  });
  return { tot, by: Object.values(by).sort((a, b) => b.cobrado - a.cobrado), byType: Object.values(byType).sort((a, b) => b.cobrado - a.cobrado), bySrc: Object.values(bySrc).sort((a, b) => b.alumnos - a.alumnos) };
}

function shiftMonth(n) { const [y, m] = st.month.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); st.month = `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; paneStats(); }
function exportCsv() {
  const cell = v => { v = String(v ?? ''); return /[;"\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v; };
  const num = n => String(+n || 0).replace('.', ',');                      // Excel en español
  const head = ['Fecha', 'Hora', 'Clase', 'Profe', '% profe', 'Alumno', 'WhatsApp', 'Email', 'Personas', 'Monto', 'Estado', 'Pagado', 'Medio', 'Parte profe', 'Canal', 'Nota', 'Código'];
  const lines = st.staffSlots.flatMap(s => s.bookings.map(b => [dayKey(s.starts_at), hhmm(s.starts_at), s.title, s.profe?.name, num(s.profe_pct),
    b.customer_name, b.customer_phone, b.customer_email, b.people, num(b.amount), STATUS[b.status] + (s.status === 'cancelled' ? ' (clase suspendida)' : ''),
    b.paid ? 'sí' : 'no', b.payment_method, num(b.paid && b.status !== 'cancelled' && s.status !== 'cancelled' ? b.amount * s.profe_pct / 100 : 0), SOURCES[b.source] || b.source || 'Web', b.notes, b.code].map(cell).join(';')));
  const blob = new Blob(['﻿' + [head.join(';'), ...lines].join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `nativo-reservas-${st.month}.csv`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// Formulario de perfil: lo usa cada uno en "Mi perfil" y el admin para editar a cualquiera.
function profileFields(p, admin) {
  return `<div class="photo-pick" id="ph-wrap">${avatarHtml(p, 'lg')}
      <div><label class="btn ghost sm" for="pf-photo">${p.avatar_url ? 'Cambiar foto' : 'Subir foto'}</label>
      <input type="file" id="pf-photo" accept="image/*" onchange="pickPhoto(this)">
      <div class="tiny muted" style="margin-top:6px">Una foto de cara, con buena luz. La ven los alumnos.</div></div></div>
    <div class="field"><label for="pf-name">Nombre (como lo ven los alumnos)</label><input class="input" id="pf-name" name="name" required maxlength="60" value="${esc(p.name)}"></div>
    <div class="field"><label for="pf-phone">WhatsApp</label><input class="input" id="pf-phone" name="phone" type="tel" inputmode="tel" maxlength="30" value="${esc(p.phone || '')}" placeholder="341 555 1234"></div>
    <label class="check" style="margin:-6px 0 14px"><input type="checkbox" name="public_whatsapp" ${p.public_whatsapp !== false ? 'checked' : ''}> Mostrar mi WhatsApp a los alumnos (botón "Escribile")</label>
    <div class="field"><label for="pf-bio">Presentación corta</label><textarea class="input" id="pf-bio" name="bio" maxlength="160" placeholder="Ej: Instructor certificado, 5 años dando clases en el Paraná.">${esc(p.bio || '')}</textarea></div>
    ${admin ? `<div class="field"><span class="flabel">Rol</span><div class="seg">${Object.entries(ROLES).map(([k, l]) => `<label><input type="radio" name="role" value="${k}" ${roleKey(p) === k ? 'checked' : ''}>${l}</label>`).join('')}</div></div>
      <div class="grid2"><div class="field"><label for="pf-pct">% de cada alumno</label><input class="input" id="pf-pct" name="pct" type="number" inputmode="numeric" min="0" max="100" value="${+p.commission_pct}"></div>
        <div class="field"><span class="flabel">Acceso</span><label class="check" style="min-height:48px"><input type="checkbox" name="approved" ${p.approved ? 'checked' : ''}> Activo</label></div></div>
      <p class="tiny muted" style="margin-bottom:10px">El % nuevo aplica a las clases que se creen desde ahora. Sacarle "Activo" le quita el acceso.</p>` : ''}
    <p class="tiny muted">${isUserLogin(p.email) ? 'Usuario' : 'Email'}: ${esc(userLabel(p.email))}</p>`;
}
function pickPhoto(input) {
  const f = input.files?.[0]; if (!f) return;
  if (!f.type.startsWith('image/')) return toast('Elegí una imagen');
  st.pendingPhoto = f;
  const url = URL.createObjectURL(f), old = $('ph-wrap').querySelector('.avatar');
  old.outerHTML = `<img class="avatar lg" src="${url}" alt="">`;
}
function editProfe(id) {
  const p = st.allProfiles.find(x => x.id === id); if (!p) return;
  st.pendingPhoto = null;
  openModal(`<h2>Editar perfil</h2><div id="pf-err"></div>
    <form onsubmit="saveProfileForm(event,'${id}',true)">${profileFields(p, true)}
      ${id !== st.me.id ? `<button type="button" class="btn ghost block" style="margin-top:4px" onclick="closeModal();newPasswordFor('${id}')">Se olvidó la contraseña: generar una nueva</button>
        <button type="button" class="btn danger block" style="margin-top:8px" onclick="removeProfe('${id}')">Sacar del equipo</button>` : ''}
      <div class="sheet-foot"><button class="btn coral block" id="pf-btn">Guardar</button></div></form>`);
}
async function removeProfe(id) {
  const p = st.allProfiles.find(x => x.id === id); if (!p) return;
  if (!await askConfirm(`¿Sacar a ${p.name} del equipo? Ya no va a poder entrar. Si dio clases, su historial y sus números se conservan.`, 'Sacar')) return;
  try {
    const r = await api.removeProfe(id); closeModal();
    toast(r.result === 'archived' ? `${p.name} quedó de baja (su historial se conserva)` : `${p.name} ya no está en el equipo`);
    paneProfes();
  } catch (e) { toast(errMsg(e)); }
}
async function reviveProfe(id) {
  try { await api.updateProfile(id, { approved: true, archived: false, teaches: true }); toast('Reactivado ✓'); paneProfes(); } catch (e) { toast(errMsg(e)); }
}
async function saveProfileForm(ev, id, admin) {
  ev.preventDefault();
  const f = ev.target, p = admin ? st.allProfiles.find(x => x.id === id) : st.me, btn = $('pf-btn');
  const patch = { name: f.name.value.trim(), phone: f.phone.value.trim() || null, bio: f.bio.value.trim() || null, public_whatsapp: f.public_whatsapp.checked };
  if (admin) {
    const r = f.role.value;
    if (id === st.me.id && (!f.approved.checked || r === 'profe') && !await askConfirm('Te estás sacando el acceso de admin a vos mismo. ¿Seguro?')) return;
    Object.assign(patch, { role: r === 'profe' ? 'profe' : 'admin', teaches: r !== 'admin', commission_pct: Math.min(100, Math.max(0, +f.pct.value || 0)), approved: f.approved.checked });
  }
  btn.disabled = true; btn.textContent = st.pendingPhoto ? 'Subiendo foto…' : 'Guardando…';
  try {
    if (st.pendingPhoto) patch.avatar_url = await api.uploadAvatar(id, await shrinkPhoto(st.pendingPhoto), p.avatar_url);
    await api.updateProfile(id, patch);
    st.pendingPhoto = null; toast('Perfil guardado ✓');
    if (admin) { closeModal(); if (id === st.me.id) renderStaff(); else paneProfes(); } else renderStaff();
  } catch (e) { $('pf-err').innerHTML = `<div class="err">${esc(errMsg(e))}</div>`; btn.disabled = false; btn.textContent = 'Guardar'; }
}

/* ── Buscador de alumnos (para no recorrer una lista larga) ── */
const norm = t => String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
function studentPicker(key, list, placeholder) {
  st.pickers ||= {}; st.pickers[key] = { list, sel: null };
  return `<div id="pk-${key}"><input class="input" id="pk-${key}-q" type="search" autocomplete="off" placeholder="${esc(placeholder)}" oninput="pickerFilter('${key}')" aria-label="${esc(placeholder)}">
    <div class="picker-list" id="pk-${key}-list"></div></div>`;
}
function pickerFilter(key) {
  const pk = st.pickers[key], q = norm($(`pk-${key}-q`).value).trim(), box = $(`pk-${key}-list`);
  if (!q) { box.innerHTML = ''; return; }
  const hits = pk.list.filter(x => norm(`${x.name} ${x.email || ''} ${x.phone || ''}`).includes(q)).slice(0, 8);
  box.innerHTML = hits.length ? hits.map(x => `<button type="button" onclick="pickerPick('${key}','${x.id}')">${avatarHtml(x)}<span><b>${esc(x.name)}</b><br><span class="tiny muted">${esc(x.email || x.phone || '')}</span></span></button>`).join('')
    : '<p class="small muted" style="padding:6px 2px">No hay alumnos con ese nombre. Tiene que haber entrado al menos una vez con Google.</p>';
}
function pickerPick(key, id) {
  const pk = st.pickers[key], x = pk.list.find(y => y.id === id); pk.sel = id;
  $(`pk-${key}`).innerHTML = `<div class="picked">${avatarHtml(x)}<span style="flex:1;min-width:0"><b>${esc(x.name)}</b><br><span class="tiny muted">${esc(x.email || x.phone || '')}</span></span>
    <button type="button" class="btn ghost sm" onclick="pickerReset('${key}')" aria-label="Cambiar alumno">Cambiar</button></div>`;
}
function pickerReset(key) {
  const pk = st.pickers[key]; pk.sel = null;
  $(`pk-${key}`).outerHTML = studentPicker(key, pk.list, 'Buscá por nombre, email o WhatsApp…');
  $(`pk-${key}-q`).focus();
}
const pickerValue = key => st.pickers?.[key]?.sel || '';

/* ── Abonos (admin) ── */
async function paneAbonos() {
  let passes = [], plans = [], students = [];
  try { [passes, plans, students] = await Promise.all([api.adminPasses(), api.plans(), api.students()]); }
  catch (e) { paneEl().innerHTML = `<div class="err">${esc(errMsg(e))}</div>`; return; }
  st.adminPasses = passes; st.plans = plans;
  const today = dayKey(new Date());
  const pend = passes.filter(p => p.status === 'pending');
  const act = passes.filter(p => p.status === 'active' && p.expires_on >= today && p.used < p.classes_total);
  const done = passes.filter(p => p.status === 'cancelled' || (p.status === 'active' && (p.expires_on < today || p.used >= p.classes_total)));
  const who = p => `${avatarHtml({ name: p.student_name, avatar_url: p.student_avatar })}<span class="who"><b>${esc(p.student_name)}</b>`;
  const planRow = pl => `<tr data-id="${pl.id || ''}">
    <td><input class="input sm" style="min-width:140px;width:100%" data-k="name" value="${esc(pl.name || '')}" placeholder="Nombre"></td>
    <td><input class="input sm" style="width:100px" data-k="price" type="number" min="0" step="1000" value="${+pl.price || 0}"></td>
    <td><input class="input sm" style="width:60px" data-k="classes" type="number" min="1" value="${pl.classes || 4}"></td>
    <td><input class="input sm" style="width:60px" data-k="days_valid" type="number" min="1" value="${pl.days_valid || 30}"></td>
    <td><input class="input sm" style="min-width:160px;width:100%" data-k="description" value="${esc(pl.description || '')}" placeholder="1 clase por semana"></td>
    <td><input type="checkbox" data-k="active" ${pl.active !== false ? 'checked' : ''}></td>
    <td><button class="btn sm" onclick="savePlanRow(this)">Guardar</button></td></tr>`;
  paneEl().innerHTML = `
    ${pend.length ? `<div class="card unpaid"><h2>Pedidos <span class="pill warn">${pend.length}</span></h2>
      <p class="small muted" style="margin-bottom:4px">Confirmá cuando te paguen: el abono se activa desde hoy.</p>
      ${pend.map(p => `<div class="prow" style="cursor:default;flex-wrap:wrap">${who(p)}<span>${esc(p.name)} · ${money(p.price)}</span></span>
        <span class="row" style="flex:none">${p.student_phone ? contactBtn(p.student_phone, `Hola ${p.student_name.split(' ')[0]}! Te escribo de Nativo por tu ${p.name}.`) : ''}
          <button class="btn sm" onclick="confirmPass('${p.id}')">Cobrado</button><button class="btn ghost sm" onclick="dropPass('${p.id}')" aria-label="Rechazar">✕</button></span></div>`).join('')}</div>` : ''}
    <div class="card"><h2>Abonos activos (${act.length})</h2>
      ${act.length > 5 ? `<input class="input" type="search" placeholder="Buscar alumno…" oninput="filterRows(this, '.act-row')" style="margin-bottom:6px" aria-label="Buscar alumno">` : ''}
      ${act.length ? act.map(p => `<div class="prow act-row" data-q="${esc(norm(p.student_name + ' ' + (p.student_phone || '')))}" style="cursor:default">${who(p)}<span>${p.classes_total - p.used} de ${p.classes_total} clases · ${passDaysLeft(p) <= 1 ? 'vence hoy' : `quedan ${passDaysLeft(p)} días`}</span>
          <span class="pass-bar" style="margin:6px 0 0;height:6px"><i style="width:${((p.classes_total - p.used) / p.classes_total) * 100}%"></i></span></span>
        <button class="btn ghost sm" onclick="dropPass('${p.id}', true)">Anular</button></div>`).join('') : '<p class="muted small">Todavía no hay abonos activos.</p>'}
      ${students.length && plans.length ? `<div class="label" style="margin-top:14px">Dar un abono a un alumno</div>
        ${studentPicker('gp', students, 'Buscá por nombre, email o WhatsApp…')}
        <div style="margin-top:10px"><select class="input" id="gp-plan">${plans.filter(x => x.active).map(x => `<option value="${x.id}">${esc(x.name)} · ${money(x.price)}</option>`).join('')}</select></div>
        <div class="seg" style="margin:10px 0">${METHODS.map((m, i) => `<label><input type="radio" name="gp-method" value="${m}" ${i ? '' : 'checked'}>${cap(m)}</label>`).join('')}</div>
        <button class="btn coral block" onclick="givePass()">Dar abono (ya pagó)</button>
        <p class="tiny muted" style="margin-top:6px">Aparecen los alumnos que ya entraron con Google.</p>` : ''}
    </div>
    ${done.length ? `<details class="card more"><summary>Vencidos, usados o anulados (${done.length})</summary>
      ${done.map(p => `<div class="prow" style="cursor:default">${who(p)}<span>${esc(p.name)} · ${p.used}/${p.classes_total} · ${p.status === 'cancelled' ? 'anulado' : p.used >= p.classes_total ? 'usado completo' : 'venció ' + fmtDate(p.expires_on)}</span></span>
        ${p.status === 'cancelled' ? `<button class="btn ghost sm" onclick="undoPass('${p.id}')">Reactivar</button>` : ''}</div>`).join('')}</details>` : ''}
    <div class="card"><h2>Planes</h2>
      <p class="small muted" style="margin-bottom:10px">Lo que se ofrece en la página. Cada clase del abono vale precio ÷ clases (ej. ${money(90000)} ÷ 4 = ${money(22500)}), y con eso se calcula la parte del profe. Cambiar un plan no modifica abonos ya vendidos.</p>
      <div class="tbl-wrap"><table><tr><th>Nombre</th><th>Precio</th><th>Clases</th><th>Días</th><th>Descripción</th><th>Activo</th><th></th></tr>
      ${plans.map(planRow).join('')}${planRow({ sort: plans.length + 1 })}</table></div></div>`;
}
async function savePlanRow(btn) {
  const tr = btn.closest('tr'), g = k => tr.querySelector(`[data-k=${k}]`);
  const pl = { name: g('name').value.trim(), price: +g('price').value, classes: +g('classes').value, days_valid: +g('days_valid').value, description: g('description').value.trim() || null, active: g('active').checked };
  if (!pl.name) return toast('Poné un nombre');
  if (!(pl.classes > 0) || !(pl.days_valid > 0)) return toast('Revisá clases y días');
  if (tr.dataset.id) pl.id = tr.dataset.id; else pl.sort = (st.plans || []).length + 1;
  try { await api.savePlan(pl); toast('Plan guardado ✓'); paneAbonos(); } catch (e) { toast(errMsg(e)); }
}
function confirmPass(id) {
  const p = st.adminPasses.find(x => x.id === id);
  openModal(`<h2>Cobrar ${esc(p.name)}</h2><div class="sum"><b>${esc(p.student_name)}</b><div class="total" style="margin:6px 0 0"><span>Monto</span><b class="num">${money(p.price)}</b></div></div>
    <div class="label">¿Cómo pagó?</div>
    <div class="choice">${METHODS.map(m => `<button class="btn ghost block" onclick="doConfirmPass('${id}','${m}')">${cap(m)}</button>`).join('')}</div>`);
}
async function doConfirmPass(id, m) {
  try { await api.activatePass(id, m); closeModal(); toast('Abono activado ✓'); paneAbonos(); } catch (e) { toast(errMsg(e)); }
}
async function dropPass(id, active) {
  const p = st.adminPasses.find(x => x.id === id);
  const fut = active ? await api.passFutureBookings(id).catch(() => 0) : 0;
  if (!await askConfirm(active
      ? `¿Anular el abono de ${p.student_name}? Le quedan ${p.classes_total - p.used} clases sin usar.${fut ? `\n\nTiene ${fut} ${fut === 1 ? 'reserva próxima hecha' : 'reservas próximas hechas'} con este abono: ${fut === 1 ? 'queda' : 'quedan'} "a cobrar" con el precio normal.` : ''}\n\nSi fue un error, lo podés reactivar después.`
      : `¿Rechazar el pedido de ${p.student_name}?`, active ? 'Anular' : 'Rechazar')) return;
  try { const n = await api.cancelPass(id); toast(active ? `Abono anulado${n ? ` · ${n} ${n === 1 ? 'reserva pasó' : 'reservas pasaron'} a "a cobrar"` : ''}` : 'Pedido rechazado'); paneAbonos(); } catch (e) { toast(errMsg(e)); }
}
async function undoPass(id) {
  try { await api.reactivatePass(id); toast('Abono reactivado ✓'); paneAbonos(); } catch (e) { toast(errMsg(e)); }
}
// Filtra filas de una lista mientras se escribe (sin tildes ni mayúsculas).
function filterRows(input, sel) {
  const q = norm(input.value).trim();
  input.parentElement.querySelectorAll(sel).forEach(r => { r.style.display = !q || r.dataset.q.includes(q) ? '' : 'none'; });
}
async function givePass() {
  const sid = pickerValue('gp'), pid = $('gp-plan').value, m = document.querySelector('[name=gp-method]:checked')?.value || 'efectivo';
  if (!sid) return toast('Elegí un alumno');
  try { await api.grantPass(sid, pid, m); toast('Abono dado ✓'); paneAbonos(); } catch (e) { toast(errMsg(e)); }
}

/* ── Tipos de clase (admin) ── */
async function paneTypes() {
  try { st.types = await api.classTypes(); } catch (e) { paneEl().innerHTML = `<div class="err">${esc(errMsg(e))}</div>`; return; }
  const row = t => `<tr data-id="${t.id || ''}">
    <td><input class="input sm" style="width:100%;min-width:150px" data-k="name" value="${esc(t.name || '')}" placeholder="Nombre"></td>
    <td><input class="input sm" style="width:100%;min-width:180px" data-k="description" value="${esc(t.description || '')}"></td>
    <td><input class="input sm" style="width:70px" data-k="duration_min" type="number" min="15" step="15" value="${t.duration_min || 60}"></td>
    <td><input class="input sm" style="width:60px" data-k="capacity" type="number" min="1" value="${t.capacity || 1}"></td>
    <td><input class="input sm" style="width:100px" data-k="price" type="number" min="0" step="500" value="${+t.price || 0}"></td>
    <td><input type="checkbox" data-k="active" ${t.active !== false ? 'checked' : ''}></td>
    <td><input type="checkbox" data-k="members_only" ${t.members_only ? 'checked' : ''} aria-label="Solo entrenamiento"></td>
    <td><button class="btn sm" onclick="saveType(this)">Guardar</button></td></tr>`;
  paneEl().innerHTML = `<div class="card"><h2>Precio y cupo de la clase</h2>
    <p class="small muted" style="margin-bottom:12px">Son los valores sugeridos al cargar horarios. Cambiar un precio acá no modifica horarios ya cargados. <b>Solo entren.</b>: esas clases no se publican en la web (solo se ven en la agenda) y en la página aparece una tarjeta para pedir info por WhatsApp a ${esc(CONFIG.TRAINING_CONTACT?.name || 'la escuela')}. Usá la descripción para contar días y horarios.</p>
    <div class="tbl-wrap"><table id="tt"><tr><th>Nombre</th><th>Descripción</th><th>Min</th><th>Cupo</th><th>Precio</th><th>Activa</th><th>Solo entren.</th><th></th></tr>
    ${st.types.map(row).join('')}${row({ sort: st.types.length + 1 })}</table></div></div>`;
}
async function saveType(btn) {
  const tr = btn.closest('tr'), g = k => tr.querySelector(`[data-k=${k}]`);
  const ct = { name: g('name').value.trim(), description: g('description').value.trim() || null, duration_min: +g('duration_min').value,
    capacity: +g('capacity').value, price: +g('price').value, active: g('active').checked, members_only: g('members_only').checked };
  if (!ct.name) return toast('Poné un nombre');
  if (tr.dataset.id) ct.id = tr.dataset.id; else ct.sort = st.types.length + 1;
  try { await api.saveClassType(ct); toast('Guardado ✓'); paneTypes(); } catch (e) { toast(errMsg(e)); }
}

/* ── Mi perfil ── */
function paneProfile() {
  st.pendingPhoto = null;
  paneEl().innerHTML = `<div class="card" style="max-width:520px"><h2>Mi perfil</h2><div id="pf-err"></div>
    <form onsubmit="saveProfileForm(event,'${st.me.id}',false)">${profileFields(st.me, false)}
      ${teaches(st.me) ? `<p class="tiny muted" style="margin:-6px 0 12px">Tu parte: ${+st.me.commission_pct}% de lo cobrado.</p>` : ''}
      <button class="btn coral block" id="pf-btn">Guardar</button></form></div>
    <details class="card more" style="max-width:520px"><summary>Cambiar mi contraseña</summary>
      <form onsubmit="changeMyPassword(event)" style="margin-top:12px"><div id="cp-err"></div>
        <div class="field"><label for="cp-1">Contraseña nueva</label><input class="input" id="cp-1" name="pw" type="password" required minlength="6" autocomplete="new-password"></div>
        <div class="field"><label for="cp-2">Repetila</label><input class="input" id="cp-2" name="pw2" type="password" required minlength="6" autocomplete="new-password"></div>
        <button class="btn block" id="cp-btn">Cambiar contraseña</button></form></details>`;
}
async function changeMyPassword(ev) {
  ev.preventDefault(); const f = ev.target;
  if (f.pw.value !== f.pw2.value) { $('cp-err').innerHTML = '<div class="err">Las contraseñas no coinciden</div>'; return; }
  $('cp-btn').disabled = true;
  try { await api.setPassword(f.pw.value); f.reset(); $('cp-err').innerHTML = ''; toast('Contraseña cambiada ✓'); }
  catch (e) { $('cp-err').innerHTML = `<div class="err">${esc(errMsg(e))}</div>`; }
  finally { $('cp-btn').disabled = false; }
}

/* ════════════════════════════ ARRANQUE ════════════════════════════ */
if (DEMO) $('demo-bar').classList.remove('hidden');
api.onAuth(() => { if (location.hash.startsWith('#staff')) renderStaff(); else refreshAccount(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
// Vuelta desde un mail de invitación / recuperar contraseña → ir directo al área de profes.
// Primero dejamos que Supabase lea el token del link; recién después limpiamos la URL.
const QS = new URLSearchParams(location.search);
if (QS.has('code') || QS.has('error_description')) {
  // Vuelta desde Google: supabase-js canjea el ?code= por la sesión; después seguimos donde estaba.
  const err = QS.get('error_description');
  api.ready().finally(() => {
    history.replaceState(null, '', location.pathname + location.hash);
    if (err) { toast('No se pudo entrar con Google: ' + err); refreshAccount(); route(); } else finishLogin();
  });
} else if (AUTH_LINK || QS.has('staff')) {
  (AUTH_LINK && api.ready ? api.ready() : Promise.resolve()).finally(() => {
    history.replaceState(null, '', location.pathname + '#staff'); route();
  });
} else { route(); refreshAccount(); }
(() => {                                                    // vuelta desde Mercado Pago
  const u = new URLSearchParams(location.search), r = u.get('pago');
  if (!r) return;
  const code = (u.get('code') || '').replace(/[^0-9A-Fa-f]/g, '').slice(0, 6).toUpperCase();
  history.replaceState(null, '', location.pathname + location.hash);
  setTimeout(() => showPayResult(r, code), 400);
})();
</script>
