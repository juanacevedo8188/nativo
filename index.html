<!-- Cliente oficial de Supabase (auth + base de datos): se empieza a bajar ya, pero no frena el dibujo
     de la página (el <script> va al final del body, justo antes del código de la app). -->
<link rel="preload" as="script" href="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
<style>
/* Pensado primero para el celu: botones grandes, todo a un toque, nada que deslizar de costado
   salvo la tira de días. En compu se acomoda en columnas más anchas. */
:root{
  /* Colores del logo de Nativo: contorno negro, sol amarillo → verde → agua turquesa. */
  --bg:#f3faf6; --card:#ffffff; --ink:#1f1d1e; --ink2:#4a5a56; --ink3:#8a9a95;
  --line:#d9ebe2; --line2:#bcd8cb;
  --sea:#0e8488; --sea2:#18b3b6; --sea-soft:#dcf4f1;
  --sun:#fbef46; --sun2:#ffc928; --lime:#8cc36b;
  --coral:#f0b400; --coral-soft:#fff7c9;
  --grad:linear-gradient(180deg,#ffc928 0%,#b9cc55 34%,#6cc483 66%,#1cb9bc 100%);
  --ok:#1f8a5b; --ok-soft:#e2f4ea; --warn:#a86a12; --warn-soft:#fbf0dc; --bad:#c2410c; --bad-soft:#fde8df;
  --f-display:"Fredoka",ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;
  --f-script:"Yellowtail","Brush Script MT",cursive;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --r:18px; --r2:12px; --shadow:0 1px 2px rgba(31,29,30,.05),0 6px 18px rgba(14,132,136,.08);
  --top-h:58px; --tabbar-h:64px;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;overflow-x:hidden;overflow-x:clip}
/* Sin "rebote" al llegar arriba/abajo (mostraba blanco) */
html,body{overscroll-behavior-y:none}
body{font-family:var(--f-body);background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45;min-height:100vh;min-height:100dvh;overflow-x:hidden;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--sea)}
.hidden{display:none!important}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
.muted{color:var(--ink2)} .small{font-size:14px} .tiny{font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3,.logo b,.t,.day b,.kpi b,.code,.price{font-family:var(--f-display);text-wrap:balance}
h1{font-weight:700} h2,h3{font-weight:600}
h2{font-size:20px;margin-bottom:10px} h3{font-size:16px;margin-bottom:8px}
.row{display:flex;align-items:center;gap:8px} .between{justify-content:space-between} .wrapf{flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
:focus-visible{outline:3px solid var(--sea2);outline-offset:2px}

/* ── Animaciones (suaves, y apagadas si el teléfono pide menos movimiento) ── */
@keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-7px) rotate(2deg)}}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.rise{animation:rise .35s var(--ease) both}
.rise:nth-child(2){animation-delay:.04s}.rise:nth-child(3){animation-delay:.08s}.rise:nth-child(4){animation-delay:.12s}.rise:nth-child(n+5){animation-delay:.16s}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ── Header ── */
.top{background:var(--ink);color:#fff;position:sticky;top:0;z-index:30;padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:var(--top-h);gap:10px}
.logo{display:flex;align-items:center;gap:9px;text-decoration:none;color:inherit;min-width:0}
.logo img{width:38px;height:38px;border-radius:50%;flex:none;transition:transform .5s var(--ease)}
.logo:hover img{transform:rotate(-12deg)}
.logo .wm{display:flex;flex-direction:column;line-height:1;min-width:0}
.logo b{font-weight:700;font-size:23px;color:var(--sun)}
.logo span{font-family:var(--f-script);font-size:14px;color:#7fd3da;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top nav{display:flex;gap:4px;flex:none}
.top nav a{color:#fff;text-decoration:none;font-size:14px;font-weight:600;padding:8px 13px;border-radius:999px;transition:background .2s,color .2s}
.top nav a.on{background:var(--sun);color:var(--ink)}
@media(max-width:430px){.logo span{font-size:12px}.logo b{font-size:21px}.top nav a{padding:8px 11px}}
@media(max-width:380px){.logo span{display:none}.logo b{font-size:21px}.top nav a{padding:7px 10px;font-size:13.5px}}
@media(max-width:340px){.logo .wm{display:none}}
.demo-bar{background:var(--coral-soft);color:#6b5200;font-size:12.5px;text-align:center;padding:6px 16px}

/* ── Portada ── */
.hero{background:var(--grad);position:relative;overflow:hidden;padding:18px 0 46px}
.hero .wrap{display:flex;align-items:center;gap:14px}
.hero .badge{width:96px;height:auto;aspect-ratio:2132/2588;object-fit:contain;flex:none;filter:drop-shadow(0 6px 10px rgba(31,29,30,.22));animation:float 5s ease-in-out infinite;transform-origin:50% 80%}
.hero .copy{min-width:0}
.hero .tag{font-family:var(--f-script);font-size:20px;line-height:1;margin-bottom:2px;opacity:.85}
.hero h1{font-size:clamp(27px,7.4vw,44px);line-height:1.02}
.hero .facts{margin-top:10px}
.waves{position:absolute;left:0;bottom:-1px;width:200%;height:34px;animation:drift 14s linear infinite}
.waves path{fill:var(--bg)}
/* En compu no hay "deslizar con el dedo": profes y días se acomodan en varias filas. */
@media(min-width:760px){.chips{flex-wrap:wrap;overflow:visible;margin:0;padding:2px 0 4px}.days{flex-wrap:wrap;overflow:visible;margin:0;padding:0}}
@media(min-width:700px){.hero{padding:30px 0 60px}.hero .badge{width:150px}.hero .wrap{gap:28px}}

.facts{display:flex;gap:6px;flex-wrap:wrap}
.facts span{background:rgba(255,255,255,.72);color:var(--ink);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:500;backdrop-filter:blur(4px)}
.facts b{font-family:var(--f-display);font-weight:600}

/* ── Bloques ── */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.card+.card{margin-top:12px}
.label{font-size:12px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.07em;margin:0 2px 8px}
.section{margin-top:18px}
.empty{text-align:center;padding:28px 16px;color:var(--ink2)}
.loading{padding:40px;text-align:center;color:var(--ink2)}
.err{background:var(--bad-soft);color:var(--bad);padding:10px 12px;border-radius:10px;font-size:14px;margin-bottom:12px}

/* Chips (filtros) */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none;overscroll-behavior-x:contain;touch-action:pan-x pan-y}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line2);background:var(--card);border-radius:999px;padding:6px 14px 6px 6px;font-size:15px;font-weight:600;white-space:nowrap;scroll-snap-align:start;transition:background .2s,border-color .2s,color .2s,transform .1s}
.chip.plain{padding:8px 16px}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--sun)}
.chip .avatar{width:30px;height:30px;font-size:13px}
.avatar{flex:none;width:40px;height:40px;border-radius:50%;background:var(--sun);color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink);font-family:var(--f-display);display:grid;place-items:center;font-weight:700}
img.avatar{object-fit:cover;background:var(--sea-soft)}
.avatar.lg{width:96px;height:96px;font-size:34px;box-shadow:inset 0 0 0 3px var(--ink)}
img.avatar.lg{border:3px solid var(--ink);box-shadow:none}
.photo-pick{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.photo-pick label.btn{cursor:pointer}
.photo-pick input{position:absolute;opacity:0;width:1px;height:1px}
.prow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 0}
.prow:first-of-type{border-top:0}
.prow .who{flex:1;min-width:0}
.prow .who b{display:block;font-size:16px}
.prow .who span{font-size:13px;color:var(--ink2)}
.prof-card{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:10px 0 0;padding:12px;animation:rise .25s var(--ease) both}
.prof-card .pc-txt{flex:1 1 160px;min-width:0}
.prof-card .pc-wa{flex:none;margin-left:auto}
.prof-card .avatar{width:52px;height:52px;font-size:18px}
.ticket{padding:0;overflow:hidden;margin-top:16px}
.ticket .tk-head{background:var(--grad);padding:16px;display:flex;align-items:center;gap:12px}
.ticket .tk-head img{width:58px;height:auto;filter:drop-shadow(0 3px 6px rgba(0,0,0,.2))}
.ticket .tk-head b{font-family:var(--f-display);font-size:22px;display:block;line-height:1.1}
.ticket .tk-body{padding:16px}
.ticket .when{font-family:var(--f-display);font-weight:600;font-size:22px;line-height:1.15}
.ticket .when span{display:block;font-size:30px;font-weight:700}
.tk-rows{margin:14px 0 4px;display:grid;gap:8px;font-size:15px}
.tk-rows div{display:flex;justify-content:space-between;gap:10px;border-top:1px dashed var(--line2);padding-top:8px}
.tk-rows span{color:var(--ink2)}
.tk-rows b{text-align:right}
.tk-acts{display:grid;gap:8px;margin-top:14px}
.tk-acts .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mine{display:grid;gap:8px;margin-top:16px}
.mine a{display:flex;align-items:center;gap:12px;background:var(--card);border:1.5px solid var(--ink);border-radius:var(--r);padding:12px 14px;text-decoration:none;color:var(--ink);box-shadow:3px 3px 0 var(--ink)}
.mine a .t{font-size:20px;font-weight:700}
.mine a .who{flex:1;min-width:0;font-size:14px}
.top nav a img{width:24px;height:24px;border-radius:50%;object-fit:cover;vertical-align:middle;margin:-4px 6px -4px -4px;border:2px solid var(--sun)}
.btn.google{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line2),0 1px 2px rgba(0,0,0,.06)}
.btn.google svg{width:20px;height:20px}
.perks{list-style:none;display:grid;gap:8px;margin:14px 0 18px;font-size:15px}
.perks li::before{content:"✓";display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--sun);box-shadow:inset 0 0 0 1.5px var(--ink);font-size:12px;font-weight:800;margin-right:10px}
.as-me{display:flex;align-items:center;gap:10px;background:var(--sea-soft);border-radius:14px;padding:10px 12px;margin-bottom:14px;font-size:15px}
.as-me .avatar{width:34px;height:34px;font-size:13px}
.quick-login{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--coral-soft);border-radius:14px;padding:10px 12px;margin-bottom:14px;font-size:14px}
.sp-cover{background:var(--grad);height:110px;margin:0 -16px;position:relative;overflow:hidden}
.sp-cover .waves{height:26px}
.sp-head{text-align:center;margin-top:-58px;position:relative}
.sp-head .avatar.xl{width:116px;height:116px;font-size:40px;margin:0 auto;border:4px solid var(--ink);box-shadow:4px 4px 0 var(--ink);animation:pop .5s var(--ease) both}
img.avatar.xl{border:4px solid var(--ink)}
.sp-head h1{font-size:28px;margin-top:10px}
.sp-head .bio-t{color:var(--ink2);margin:6px auto 0;max-width:420px}
.sp-head .tags{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.sp-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0 6px}
.sp-stats div{background:var(--card);border:1.5px solid var(--ink);border-radius:16px;padding:10px 6px;text-align:center;box-shadow:3px 3px 0 var(--ink)}
.sp-stats b{display:block;font-family:var(--f-display);font-size:26px;line-height:1.1}
.sp-stats span{font-size:12.5px;color:var(--ink2)}
.badges{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
@media(max-width:360px){.badges{grid-template-columns:repeat(3,1fr)}}
.badge-i{cursor:pointer;color:inherit;font-family:inherit;width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center;font-size:11.5px;font-weight:700;line-height:1.2}
.badge-i i{display:block;font-style:normal;font-size:30px;line-height:1.2}
.badge-i.off{opacity:.45;filter:grayscale(1)}
.badge-i.on{border-color:var(--ink);background:var(--coral-soft);animation:pop .4s var(--ease) both}
.hist{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.hist:first-of-type{border-top:0}
.hist .avatar{width:40px;height:40px;font-size:14px}
.hist .who{flex:1;min-width:0;font-size:14px}
.mini-av{width:22px;height:22px;border-radius:50%;object-fit:cover;vertical-align:-5px;margin-right:6px;border:1.5px solid var(--ink)}
.pill.train{background:var(--ink);color:var(--sun)}
.train-card{display:flex;gap:12px;align-items:center;background:var(--ink);color:#fff;border-radius:var(--r);padding:14px;margin-top:16px}
.train-card i{font-style:normal;font-size:30px}
.train-card .small{color:#cfe3e1}
.train-card.promo{align-items:flex-start;margin-top:22px}
.train-card.promo .small{margin-top:3px}
.plan-card{display:flex;gap:12px;align-items:center;background:var(--sun);border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);border-radius:var(--r);padding:14px;margin-top:16px}
.plan-card .pc-ic{font-size:30px;line-height:1}
.plan-card .pc-body{flex:1;min-width:0}
.plan-card b.t{font-family:var(--f-display);font-size:19px;display:block;line-height:1.15}
.plan-card .save{display:inline-block;background:var(--ink);color:var(--sun);border-radius:999px;padding:2px 9px;font-size:12.5px;font-weight:700;margin-top:4px}
.pass-count{display:flex;gap:8px;margin-top:6px}
.pass-count span{background:var(--ink);color:#fff;border-radius:12px;padding:6px 10px;font-size:12.5px;line-height:1.1;text-align:center;min-width:64px}
.pass-count b{display:block;font-family:var(--f-display);font-size:24px;color:var(--sun)}
.pass-count .soon b{color:#ff9d7a}
.picker-list{display:grid;gap:4px;margin-top:6px;max-height:240px;overflow:auto;overscroll-behavior:contain}
.picker-list button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:8px 10px;font-size:15px}
.picker-list button .avatar{width:32px;height:32px;font-size:12px}
.picker-list button span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.picked{display:flex;align-items:center;gap:10px;border:2px solid var(--ink);background:var(--coral-soft);border-radius:12px;padding:8px 10px}
.picked .avatar{width:32px;height:32px;font-size:12px}
.pass-bar{height:10px;background:rgba(31,29,30,.12);border-radius:5px;overflow:hidden;margin:8px 0 4px}
.pass-bar i{display:block;height:100%;background:var(--ink);border-radius:5px}
.use-pass{display:flex;align-items:center;gap:10px;background:var(--coral-soft);border:1.5px solid var(--ink);border-radius:14px;padding:10px 12px;margin-bottom:14px;font-size:15px}
.use-pass input{width:22px;height:22px;accent-color:var(--ink)}
.bio{font-size:14px;color:var(--ink2);margin:8px 2px 0;animation:rise .25s var(--ease) both}

/* Tira de días: queda pegada arriba al bajar */
.daybar{position:sticky;top:calc(var(--top-h) + env(safe-area-inset-top,0px));z-index:20;background:var(--bg);margin:0 -16px;padding:10px 16px 8px;border-bottom:1px solid transparent;transition:border-color .2s,box-shadow .2s}
.daybar.stuck{border-color:var(--line);box-shadow:0 6px 12px -10px rgba(31,29,30,.25)}
.days{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;overscroll-behavior-x:contain;margin:0 -16px;padding:0 16px}
.days::-webkit-scrollbar{display:none}
.day{flex:none;width:54px;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:7px 0 6px;text-align:center;scroll-snap-align:start;transition:background .2s,border-color .2s,color .2s,transform .1s}
.day:active{transform:scale(.94)}
.day small{display:block;font-size:11px;font-weight:600;text-transform:uppercase;color:var(--ink2);letter-spacing:.04em}
.day b{display:block;font-size:20px;line-height:1.15}
.day i{display:block;width:6px;height:6px;border-radius:50%;margin:2px auto 0;background:transparent}
.day.has i{background:var(--sea2)}
.day.off{opacity:.38;cursor:default}
.day.on{background:var(--ink);border-color:var(--ink);color:var(--sun)}
.day.on small{color:#fff}
.day.on i{background:var(--sun)}
.dayttl{font-family:var(--f-display);font-weight:600;font-size:19px;margin:14px 2px 10px}

/* Horario: toda la tarjeta se toca */
.slots{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.slot{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);transition:transform .12s,border-color .2s,box-shadow .2s}
.slot:active{transform:scale(.985)}
.slot:hover{border-color:var(--sea2)}
.slot .t{font-size:24px;font-weight:700;line-height:1;min-width:66px}
.slot .t small{display:block;font-family:var(--f-body);font-size:12px;font-weight:500;color:var(--ink2);margin-top:4px}
.slot .mid{flex:1;min-width:0}
.sports{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:6px}
.sports button{border:0;box-shadow:none;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:13px;padding:11px 8px;font:700 17px var(--f-display);color:var(--ink2);background:transparent}
.sports button i{font-style:normal;font-size:22px}
.sports button.on{background:var(--ink);color:var(--sun)}
.slot .ttl{font:700 15px var(--f-display);margin-bottom:4px;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.slot.trav{border:2px solid var(--sea2);background:linear-gradient(135deg,#fffbe0 0%,#e3f7f4 100%);box-shadow:0 6px 18px rgba(24,179,182,.18)}
.notice{display:flex;gap:10px;align-items:flex-start;border-radius:var(--r);padding:12px 14px;margin:14px 0 4px;font-weight:600;font-size:15px;border:2px solid #e8a33a;background:#fff4e0;color:#6b4300}
.notice.info{border-color:var(--sea2);background:#e3f7f4;color:#0d4f50}
.notice i{font-style:normal;font-size:20px;line-height:1.2}
.slot.train{border:2px solid #8b5cf6;background:linear-gradient(135deg,#f3edff 0%,#ece4ff 100%);box-shadow:0 6px 18px rgba(139,92,246,.18)}
.slot.train .go{background:#1fa855;color:#fff;box-shadow:inset 0 0 0 2px var(--ink)}
.slot.train .meta{color:#5b3fa0}
.pill.train-p{background:#8b5cf6;color:#fff;margin:0}
.sslot.train{box-shadow:inset 4px 0 0 #8b5cf6,var(--shadow)}
.slot.trav .go{background:var(--sea2);color:#fff;box-shadow:inset 0 0 0 2px var(--ink)}
.pill.trav-p{margin:0;background:var(--sea2);color:#fff}
.slot .who{font-weight:700;font-size:16px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.avatar.xs{width:28px;height:28px;font-size:11px;box-shadow:inset 0 0 0 1.5px var(--ink)}
.slot .meta{font-size:13px;color:var(--ink2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .go{flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--sun);box-shadow:inset 0 0 0 2px var(--ink);font-size:20px;font-weight:700}
.slot.full{opacity:.55;box-shadow:none}
.slot.full .go{background:#eef2ef;box-shadow:inset 0 0 0 2px var(--line2);color:var(--ink3)}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--sea-soft);color:var(--sea);margin-top:5px}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.gray{background:#eceeea;color:var(--ink2)}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:var(--r2);padding:12px 18px;min-height:46px;font-weight:700;background:var(--sea);color:#fff;text-decoration:none;font-size:15px;white-space:nowrap;transition:transform .1s,background .2s,box-shadow .1s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.coral{background:var(--sun);color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink),3px 3px 0 var(--ink)}
.btn.coral:active{transform:translate(2px,2px);box-shadow:inset 0 0 0 2px var(--ink),1px 1px 0 var(--ink)}
.btn.coral:disabled{box-shadow:inset 0 0 0 2px var(--line2);background:#f1f3ef;color:var(--ink3)}
.btn.dark{background:var(--ink);color:var(--sun)}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line2)}
.btn.danger{background:var(--card);color:var(--bad);box-shadow:inset 0 0 0 1.5px #f1c6b3}
.btn.wa{background:#1fa855;color:#fff}
.btn.sm{padding:7px 12px;min-height:36px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.photos .ph{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--line)}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
.ph-x{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:13px;cursor:pointer}
.note{padding:8px 0;border-top:1px solid var(--line)}
.note:first-child{border-top:0}
.lvl-seg{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.lvl-seg button{border:1.5px solid var(--line2);background:var(--card);border-radius:999px;padding:6px 10px;font-weight:600;font-size:13.5px;cursor:pointer;color:var(--ink)}
.lvl-seg button.on{background:var(--ink);color:var(--sun);border-color:var(--ink)}
/* En celus angostos (320px) nada se sale del ancho: los botones anchos bajan de renglón y las grillas se achican */
.btn.block{white-space:normal;text-align:center}
.grid2>*,.two>*,.kpis>*,.choice>*,.field{min-width:0}
.input{min-width:0;max-width:100%}
.btn.mp{background:#009ee3;color:#fff}
.icon-btn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;border:0;background:var(--sea-soft);color:var(--sea);flex:none;text-decoration:none;transition:transform .1s}
.icon-btn:active{transform:scale(.92)}
.icon-btn.wa{background:#e3f6ea;color:#1a8a46}
.icon-btn svg{width:20px;height:20px}

/* Formularios: 16px para que el iPhone no haga zoom al tocar un campo */
.field{margin-bottom:14px}
.field label,.field .flabel{display:block;font-size:14px;font-weight:700;margin-bottom:6px}
.input,select.input,textarea.input{width:100%;border:1.5px solid var(--line2);background:#fff;border-radius:var(--r2);padding:12px 14px;font-size:16px;min-height:48px;outline:none;transition:border-color .2s,box-shadow .2s}
.input:focus{border-color:var(--sea2);box-shadow:0 0 0 4px var(--sea-soft)}
textarea.input{min-height:80px;resize:vertical}
.input.sm{padding:8px 10px;min-height:40px;font-size:15px;width:auto}
.check{display:inline-flex;align-items:center;gap:8px;font-size:15px}
.check input{width:20px;height:20px;accent-color:var(--sea)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg label{border:1.5px solid var(--line2);border-radius:999px;padding:9px 14px;font-size:15px;font-weight:600;background:var(--card);transition:background .2s,color .2s}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--ink);border-color:var(--ink);color:var(--sun)}
.seg label:has(input:focus-visible){outline:3px solid var(--sea2);outline-offset:2px}
.wd{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.wd label{border:1.5px solid var(--line2);border-radius:10px;padding:10px 0;text-align:center;font-size:14px;font-weight:600;user-select:none;background:var(--card)}
.wd input{position:absolute;opacity:0;pointer-events:none}
.wd label:has(input:checked){background:var(--ink);border-color:var(--ink);color:var(--sun)}
.stepper{display:flex;align-items:center;border:1.5px solid var(--line2);border-radius:var(--r2);overflow:hidden;width:max-content;background:#fff}
.stepper button{width:52px;height:48px;border:0;background:var(--sea-soft);color:var(--sea);font-size:24px;font-weight:700}
.stepper button:disabled{color:var(--ink3);background:#f1f3ef}
.stepper output{min-width:56px;text-align:center;font-family:var(--f-display);font-size:22px;font-weight:600}

/* ── Hoja inferior (reservar, cobrar, etc.) ── */
.modal{position:fixed;inset:0;background:rgba(15,30,30,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:rise .2s both;overscroll-behavior:contain}
.modal .sheet{position:relative;background:var(--card);border-radius:22px 22px 0 0;width:100%;max-width:520px;max-height:92vh;max-height:92dvh;overflow:auto;padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px));animation:sheetUp .32s var(--ease) both;overscroll-behavior:contain}
.modal .sheet::before{content:"";display:block;width:42px;height:5px;border-radius:3px;background:var(--line2);margin:0 auto 12px}
.sheet .x{position:absolute;z-index:3;top:10px;right:12px;width:36px;height:36px;border-radius:50%;border:0;background:var(--bg);font-size:18px;color:var(--ink2)}
@media(min-width:700px){.modal{align-items:center;padding:16px}.modal .sheet{border-radius:22px;padding-bottom:20px}}
.sheet-foot{position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom,0px));background:var(--card);margin:14px -18px 0;padding:12px 18px calc(4px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.sum{background:var(--bg);border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:15px}
.total{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;font-size:17px;margin-bottom:10px}
.total b{font-family:var(--f-display);font-size:24px}
.code{font-size:34px;font-weight:700;letter-spacing:.18em;color:var(--ink);text-align:center;padding:10px;background:var(--sun);box-shadow:inset 0 0 0 2px var(--ink);border-radius:14px;margin:12px 0;animation:pop .45s var(--ease) both}
.big-emoji{font-size:46px;text-align:center;animation:pop .5s var(--ease) both}
.choice{display:grid;gap:8px}
.choice .btn{justify-content:flex-start;padding-left:16px}
.mp-head{font-family:var(--f-display);font-weight:700;color:#009ee3;font-size:22px;display:flex;justify-content:space-between;align-items:center}
.mp-head span{font-family:var(--f-body);font-size:11px;font-weight:700;color:var(--warn);background:var(--warn-soft);padding:2px 8px;border-radius:999px}
.src{font-weight:700;color:var(--sea)} .src-instagram{color:#c13584} .src-whatsapp{color:#1a8a46}

/* ── Área profes ── */
.shead{display:flex;align-items:center;gap:10px;margin:14px 0 12px}
.shead h1{font:700 22px/1.15 var(--f-display);margin:2px 0 0;letter-spacing:-.2px}
.shead .back{flex:none;width:42px;height:42px;border-radius:50%;border:0;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line2);font-size:26px;line-height:1;color:var(--ink);cursor:pointer;padding-bottom:3px}
.mgroup{margin-bottom:14px}
.eqsum{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.eqk{display:flex;flex-direction:column;align-items:center;gap:1px;padding:10px 6px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);font:inherit;color:var(--ink);cursor:pointer}
.eqk i{font-style:normal;font-size:24px}.eqk b{font-size:20px;line-height:1.1}.eqk span{font-size:12px;color:var(--ink2);text-align:center}
.eqk em{font-style:normal;font-size:11.5px;font-weight:700;color:var(--bad)}
.eqk.on{background:var(--ink);border-color:var(--ink);color:var(--sun)}.eqk.on span{color:#d9e6e1}
.weekbar{position:sticky;top:var(--top-h);z-index:6;background:var(--bg);margin:10px -16px 0;padding:8px 16px 10px;box-shadow:0 6px 8px -8px rgba(0,0,0,.18)}
.weekbar .icon-btn:disabled{opacity:.3}
.wdays{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:8px}
.wdays button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0 4px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font:inherit;color:var(--ink);cursor:pointer;min-width:0}
.wdays button small{font-size:11px;color:var(--ink2);text-transform:uppercase;font-weight:600}
.wdays button b{font-size:17px;line-height:1.1}
.wdays button i{font-style:normal;font-size:10.5px;font-weight:700;color:var(--sea);min-height:13px}
.wdays button.off{opacity:.35;cursor:default}
.wdays button.today{border-color:var(--sea2);border-width:2px}
.wdays button.on{background:var(--ink);border-color:var(--ink);color:var(--sun)}
.wdays button.on small,.wdays button.on i{color:#d9e6e1}
.ecard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow);cursor:pointer;color:var(--ink);font:inherit}
.ecard:active{transform:scale(.99)}
.ecard.off{opacity:.6}
.ecard .et{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.ecard .et b{font-size:15.5px}
.ecard .tags{display:flex;gap:6px;flex-wrap:wrap}
.ecard .tags .pill{margin:0}
.ecard .ell{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.ecard{min-width:0;max-width:100%}
.ecard .chev{flex:none;font-size:16px;opacity:.7}
.mgroup .label{margin:0 0 6px 4px}
.mlist{padding:4px 0;overflow:hidden}
.mitem{display:flex;align-items:center;gap:12px;width:100%;padding:12px 16px;background:none;border:0;border-top:1px solid var(--line);text-align:left;color:var(--ink);text-decoration:none;cursor:pointer;font:inherit}
.mitem:first-child{border-top:0}
.mitem:active{background:var(--line)}
.mitem i{font-style:normal;font-size:22px;width:28px;text-align:center;flex:none}
.mitem .mt{flex:1;min-width:0;display:flex;flex-direction:column}
.mitem .mt b{font-size:15.5px}
.mitem .mt small{font-size:12.5px;color:var(--ink2);margin-top:1px}
.mitem em{font-style:normal;margin:0;flex:none}
.mitem .chev{color:var(--ink3);font-size:22px;flex:none}
.tabbar button{position:relative}
.tabbar .dot{position:absolute;top:6px;left:calc(50% + 8px);width:9px;height:9px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 2px var(--ink)}
.hello{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0 4px}
.hello b{font-family:var(--f-display);font-size:21px;font-weight:600}
.pane{padding-bottom:calc(var(--tabbar-h) + 28px + env(safe-area-inset-bottom,0px));animation:rise .3s var(--ease) both}
/* Barra de pestañas abajo, como una app */
.tuto{text-align:center;touch-action:pan-y}
.tuto .slide{animation:rise .35s var(--ease) both}
.tuto .em{font-size:64px;line-height:1;margin:6px 0 10px}
.tuto h2{margin:0 0 8px}
.tuto p{color:var(--ink2);margin:0 auto 12px;max-width:340px}
.tuto .steps{display:grid;gap:8px;text-align:left;margin:4px auto 6px;max-width:340px}
.tuto .steps div{display:flex;gap:10px;align-items:center;background:var(--bg);border-radius:12px;padding:9px 12px;font-size:15px}
.tuto .steps b.n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--sun);border:2px solid var(--ink);display:grid;place-items:center;font:700 14px var(--f-display)}
.tuto .dots{display:flex;gap:6px;justify-content:center;margin:14px 0 4px}
.tuto .dots i{width:8px;height:8px;border-radius:99px;background:#d5dcd9;transition:all .25s}
.tuto .dots i.on{width:22px;background:var(--ink)}
.tuto .nav{display:flex;gap:8px;margin-top:10px}
.tuto .nav .btn{flex:1}
.post{border-top:1px solid var(--line);padding:10px 0}
.post:first-child{border-top:0}
.post.pin{background:var(--coral-soft);border-radius:12px;padding:10px 12px;border:0;margin-bottom:6px}
.post-b{margin-top:4px;font-size:15px;overflow-wrap:anywhere}
.team{background:linear-gradient(135deg,#1f1d1e,#0e4f52);color:#fff;border-radius:var(--r);padding:16px;margin-top:14px}
.team h3{color:var(--sun);margin:0 0 10px;font-family:var(--f-display)}
.team .ts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}
.team .ts div{background:rgba(255,255,255,.08);border-radius:12px;padding:10px 4px}
.team .ts b{display:block;font:700 26px var(--f-display);color:var(--sun)}
.team .ts span{font-size:12px;opacity:.85}
.team .weeks{display:flex;gap:4px;margin:12px 0 2px}
.team .weeks i{flex:1;height:8px;border-radius:4px;background:rgba(255,255,255,.15)}
.team .weeks i.on{background:var(--sun)}
.team .badges{grid-template-columns:repeat(4,minmax(0,1fr))}
.team .badges .badge-i{overflow-wrap:anywhere;background:rgba(255,255,255,.06);color:#fff;border-color:rgba(255,255,255,.18)}
.team .badges .badge-i.on{background:rgba(251,239,70,.15);border-color:var(--sun)}
.board-pub{border-left:4px solid var(--sun)}
.checkin-btn{font-size:18px;padding:14px}
.checkin.done{display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(251,239,70,.15);border:1.5px solid var(--sun);border-radius:14px;padding:10px 12px;font-weight:700}
.team .checkin.done .btn{background:transparent;color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.6)}
.checkin-card{display:flex;align-items:center;gap:12px;margin-top:14px;background:linear-gradient(135deg,#1f1d1e,#0e4f52);color:#fff}
.checkin-card .btn{flex:none}
.rank{flex:none;width:22px;text-align:center;font:700 15px var(--f-display);color:var(--ink3)}
.mini-weeks{display:flex;gap:3px;margin-top:5px;max-width:140px}
.mini-weeks i{flex:1;height:5px;border-radius:3px;background:#e3e9e6}
.mini-weeks i.on{background:var(--sea2)}
.skel{display:grid;gap:10px}
.skel i{display:block;border-radius:16px;background:linear-gradient(90deg,#e6efea 0%,#f4f9f6 50%,#e6efea 100%);background-size:200% 100%;animation:shimmer 1.2s linear infinite}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
.transfer{border:2px solid var(--sea2);background:#effaf8;margin-top:12px}
.alias-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0 6px;background:#fff;border:1.5px dashed var(--sea2);border-radius:12px;padding:10px 12px}
.alias-row .alias{font:700 18px var(--f-display);overflow-wrap:anywhere;user-select:all}
.alias-row .btn{flex:none}
.wx{display:inline-block;font-size:12px;color:var(--ink2);background:#eef6f3;border-radius:999px;padding:2px 8px;margin-top:5px}
.wx.warn{background:#fff1dc;color:#9a5300;font-weight:700}
.wait-free{border:2px solid var(--ok);background:var(--ok-soft);margin-top:14px}
.wl{border-top:1px dashed var(--line2);padding:8px 14px 10px;background:#fbfdfc}
.wl-row{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:14px}
.wl-row span{flex:1;min-width:0}
.psec{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);margin-top:12px;overflow:hidden}
.psec>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:14px 16px;font:600 17px var(--f-display)}
.psec>summary::-webkit-details-marker{display:none}
.psec>summary::after{content:'›';margin-left:auto;font-size:22px;color:var(--ink3);transition:transform .2s}
.psec[open]>summary::after{transform:rotate(90deg)}
.psec>summary .pill{margin:0}
.psec-b{padding:0 14px 14px}
.psec-b>.team,.psec-b>.section:first-child{margin-top:0}
.psec-b .plan-card{margin-top:0;margin-bottom:10px}
.waiver-warn{border:2px solid var(--warn);background:var(--warn-soft);margin-top:14px}
.review{margin-top:12px;text-align:center}
.stars{display:flex;justify-content:center;gap:6px;margin:8px 0 10px}
.stars button{font-size:34px;line-height:1;color:#d5dcd9;background:none;border:0;padding:0 2px;cursor:pointer}
.stars button.on{color:#f5b301}
.reviews{display:grid;gap:10px}
@media(min-width:700px){.reviews{grid-template-columns:repeat(2,minmax(0,1fr))}}
.rv{margin:0;padding:14px}
.rv p{margin:6px 0;font-size:15px}
.rv-st{color:#f5b301;letter-spacing:2px}
.rv-st span{color:#d5dcd9}
.cta2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}
.cta{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;margin:0;cursor:pointer;color:inherit;font-family:inherit;border:1.5px solid var(--line)}
.cta i{font-style:normal;font-size:28px}
.cta b{font:600 16px var(--f-display)}
.giftcard{background:linear-gradient(135deg,#ffc928 0%,#8cc36b 50%,#18b3b6 100%);border-radius:22px;padding:22px;color:#1f1d1e;box-shadow:0 10px 30px rgba(0,0,0,.15);margin-top:16px;position:relative;overflow:hidden}
.giftcard .gc-big{font:700 30px var(--f-display);line-height:1.1;margin:8px 0}
.giftcard .gc-code{display:inline-block;background:#1f1d1e;color:var(--sun);font:700 20px var(--f-display);letter-spacing:2px;border-radius:12px;padding:8px 14px;margin-top:10px}
.giftcard img{position:absolute;right:-18px;top:-18px;width:120px;opacity:.9}
.live-bar{position:fixed;left:0;right:0;margin:0 auto;width:max-content;max-width:calc(100% - 32px);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:45;background:var(--sun);color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:10px 18px;font:600 15px var(--f-body);box-shadow:0 4px 0 var(--ink);white-space:nowrap;animation:pop .3s var(--ease) both;cursor:pointer}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--ink);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 18px rgba(0,0,0,.12)}

// Achica y recorta la foto (cuadrada, 320px) en el teléfono antes de subirla: pesa ~20 KB.
async function shrinkPhoto(file, size = 320) {
  const url = URL.createObjectURL(file);
  try {
    const img = new Image(); img.src = url; await img.decode();
    const side = Math.min(img.naturalWidth, img.naturalHeight);
    const c = document.createElement('canvas'); c.width = c.height = size;
    c.getContext('2d').drawImage(img, (img.naturalWidth - side) / 2, (img.naturalHeight - side) / 2, side, side, 0, 0, size, size);
    return await new Promise(r => c.toBlob(b => r(b), 'image/webp', 0.85));
  } finally { URL.revokeObjectURL(url); }
}

let lockedY = null;
function lockScroll() {

function unlockScroll() {
  if (lockedY === null) return;

  document.documentElement.style.scrollBehavior = 'auto'; window.scrollTo(0, y); document.documentElement.style.scrollBehavior = '';
}

const schoolContact = () => CONFIG.WHATSAPP ? { name: '', whatsapp: CONFIG.WHATSAPP } : null;
// Regla de la escuela: lo de SUP lo atiende Torita, lo de kayak lo atiende Mati.
const sportOwner = sport => sportContact(sport, CONFIG.PASS_CONTACT?.whatsapp ? CONFIG.PASS_CONTACT : schoolContact());
// WhatsApp para escribirle a un profe desde la página pública. Si el profe no muestra su número,
// el mensaje va al WhatsApp de la escuela nombrando al profe.
function profeWa(name, phone, extra = '') {
  const first = String(name || '').split(' ')[0];
  if (phone) return waLink(phone, `Hola ${first}! Te escribo desde la página de Nativo${extra ? ' ' + extra : ''}.`);
  if (CONFIG.WHATSAPP) return waLink(CONFIG.WHATSAPP, `Hola! Quería consultarle algo a ${first}${extra ? ' ' + extra : ''}.`);
  return '';
}
// Botón redondo para escribirle al alumno (WhatsApp o Instagram).
function contactBtn(c, text) {
  c = String(c || '').trim();
  if (!c) return '';
  if (isIg(c)) return `<a class="icon-btn" style="color:#c13584;background:#fbe7f1" href="https://instagram.com/${encodeURIComponent(c.replace(/^@/, ''))}" target="_blank" rel="noopener" aria-label="Instagram">${ICON.ig}</a>`;
  return `<a class="icon-btn wa" href="${waLink(c, text)}" target="_blank" rel="noopener" aria-label="WhatsApp ${esc(c)}">${ICON.wa}</a>`;
}

/* ════════════════════════════ API · SUPABASE ════════════════════════════ */
function supabaseApi() {
  // PKCE: la vuelta de Google trae ?code=… y supabase-js lo canjea solo por la sesión.
  const c = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY, { auth: { flowType: 'pkce' } });
  const q = async p => { const { data, error } = await p; if (error) throw error; return data; };
  return {
    // Solo login/logout: ignora refrescos de token para no re-dibujar mientras alguien edita.
    ready: () => c.auth.getSession(),
    // Tiempo real: avisa cuando cambia algo que este usuario puede ver. Devuelve cómo cortarlo.
    live(cb) {
      const ch = c.channel('staff-live');
      ['slots', 'bookings', 'passes', 'students', 'profiles', 'team_posts'].forEach(table => ch.on('postgres_changes', { event: '*', schema: 'public', table }, cb));
      ch.subscribe();
      return () => c.removeChannel(ch);
    },
    onAuth: cb => c.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT' || (ev === 'SIGNED_IN' && !st.me)) cb(); }),
    async signIn(email, password) { await q(c.auth.signInWithPassword({ email, password })); },
    async signUp(name, email, password) {
      return q(c.auth.signUp({ email, password, options: { data: { name }, emailRedirectTo: location.origin + location.pathname } }));
    },
    async signOut() { await c.auth.signOut(); },
    // Alumnos: entran con Google. La vuelta llega a la misma página con ?code=…
    async signInGoogle() {
      await q(c.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin + location.pathname, queryParams: { prompt: 'select_account' } } }));
    },
    async student() {
      const { data: { session } } = await c.auth.getSession();
      if (!session) return null;
      const me = await q(c.from('students').select('*').eq('id', session.user.id).maybeSingle());
      // La foto de Google cambia de link cada tanto: si no subió una propia, la renovamos al entrar.
      const g = session.user.user_metadata?.avatar_url || session.user.user_metadata?.picture;
      if (me && g && g !== me.avatar_url && (!me.avatar_url || /googleusercontent\.com/.test(me.avatar_url))) {
        me.avatar_url = g; c.from('students').update({ avatar_url: g }).eq('id', me.id).then(() => {}, () => {});
      }
      return me;
    },
    myBookings: () => q(c.rpc('my_bookings')),
    updateStudent: (id, patch) => q(c.from('students').update(patch).eq('id', id)),
    students: () => q(c.from('students').select('*').order('name')),
    // Abonos
    plans: () => q(c.from('plans').select('*').order('sort').order('price')),
    savePlan: pl => pl.id ? q(c.from('plans').update(pl).eq('id', pl.id)) : q(c.from('plans').insert(pl)),
    requestPass: planId => q(c.rpc('request_pass', { p_plan: planId })),
    myPasses: () => q(c.rpc('my_passes')),
    adminPasses: () => q(c.rpc('admin_passes')),
    activatePass: (id, method) => q(c.rpc('activate_pass', { p_pass: id, p_method: method })),
    grantPass: (studentId, planId, method) => q(c.rpc('grant_pass', { p_student: studentId, p_plan: planId, p_method: method })),
    cancelPass: id => q(c.rpc('cancel_pass', { p_pass: id })),
    reactivatePass: id => q(c.rpc('reactivate_pass', { p_pass: id })),
    passFutureBookings: id => q(c.from('bookings').select('id, slot:slot_id(starts_at)').eq('pass_id', id).neq('status', 'cancelled')).then(r => r.filter(b => new Date(b.slot.starts_at) > new Date()).length),
    async me() {
      const { data: { session } } = await c.auth.getSession();
      if (!session) return null;
      return q(c.from('profiles').select('*').eq('id', session.user.id).maybeSingle());
    },
    classTypes: () => q(c.from('class_types').select('*').order('sort').order('name')),
    publicProfes: () => q(c.rpc('public_profes')),

    async bookingByCode(code) { const rows = await q(c.rpc('booking_by_code', { p_code: code })); return rows[0] || null; },

    reviews: () => q(c.from('reviews').select('*, profe:profe_id(name), slot:slot_id(starts_at, title, class_type_id), booking:booking_id(customer_name)').order('created_at', { ascending: false }).limit(200)),

    groupRequests: () => q(c.from('group_requests').select('*').order('created_at', { ascending: false }).limit(200)),

    async adminCall(body) {
      const { data: { session } } = await c.auth.getSession();
      const r = await fetch('/api/invite-profe', { method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session?.access_token}` }, body: JSON.stringify(body) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.error || 'No se pudo completar. Probá de nuevo.');
      return j;
    },

    removeProfe(id) { return this.adminCall({ action: 'remove', id }); },  // → { result: 'deleted' | 'archived' }
    async resetPassword(email) {
      await q(c.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname + '?staff=1' }));

    async setPassword(password) { await q(c.auth.updateUser({ password })); },
    // Foto: se sube a avatars/<id del profe>/<fecha>.webp y se borra la anterior.
    async uploadAvatar(profileId, blob, oldUrl) {
      const ext = blob.type === 'image/webp' ? 'webp' : blob.type === 'image/png' ? 'png' : 'jpg';
      const path = `${profileId}/${Date.now()}.${ext}`;
      await q(c.storage.from('avatars').upload(path, blob, { contentType: blob.type, cacheControl: '31536000' }));
      const old = String(oldUrl || '').split('/avatars/')[1];
      if (old) c.storage.from('avatars').remove([decodeURIComponent(old)]).catch(() => {});
      return c.storage.from('avatars').getPublicUrl(path).data.publicUrl;

/* ════════════════════════════ API · DEMO (localStorage) ════════════════════════════
   Imita las mismas reglas que la base real (cupos, roles, % del profe) para poder
   mostrar la app sin configurar nada.                                               */
function demoApi() {
  const KEY = 'nativo_demo_v8', UKEY = 'nativo_demo_user', SKEY = 'nativo_demo_student';
  let db = store.get(KEY, null);
  if (!db) { db = demoSeed(); store.set(KEY, db); }
  const save = () => store.set(KEY, db);
  const meId = () => store.get(UKEY, null);
  const meP = () => db.profiles.find(p => p.id === meId()) || null;
  const isAdmin = () => { const m = meP(); return !!(m && m.approved && m.role === 'admin'); };
  const booked = sid => db.bookings.filter(b => b.slot_id === sid && b.status !== 'cancelled').reduce((a, b) => a + b.people, 0);
  const wait = v => new Promise(r => setTimeout(() => r(structuredClone(v)), 120));
  const demoUsed = pid => db.bookings.filter(b => b.pass_id === pid && b.status !== 'cancelled').reduce((a, b) => a + b.people, 0);
  const demoActive = days => { const t = dayKey(new Date()); return { starts_on: t, expires_on: dayKey(addDays(new Date(), days - 1)), paid_at: new Date().toISOString() }; };
  const fail = m => Promise.reject(new Error(m));
  const pk = p => String(p || '').replace(/\D/g, '').slice(-10);
  const demoDays = sid => [...new Set([...(db.training_logs || []).filter(x => x.student_id === sid).map(x => x.day),
    ...db.bookings.filter(b => b.student_id === sid && !['cancelled', 'no_show'].includes(b.status)).map(b => db.slots.find(x => x.id === b.slot_id))
      .filter(s => s?.members_only && s.status !== 'cancelled' && new Date(s.starts_at) < new Date()).map(s => dayKey(s.starts_at))])].sort();
  let authCb = () => {};
  return {
    demo: true,
    reset() { db = demoSeed(); save(); },
    onAuth: cb => { authCb = cb; },
    // Demo: otra pestaña abierta con la demo hace de "otro profe".
    live(cb) { const f = e => { if (e.key === KEY) { db = store.get(KEY, db); cb(); } }; addEventListener('storage', f); return () => removeEventListener('storage', f); },
    loginAs(id) { store.set(UKEY, id); authCb(); },
    async signIn() { return fail('En modo demo elegí un perfil de la lista'); },
    async signUp() { return fail('En modo demo no se crean cuentas'); },
    async signOut() { store.del(UKEY); store.del(SKEY); authCb(); },
    // "Google" de mentira: entra como una alumna de ejemplo con clases ya tomadas.
    async signInGoogle() { store.set(SKEY, 'st-demo'); await wait(null); finishLogin(); },
    student: () => wait(db.students.find(x => x.id === store.get(SKEY, null)) || null),
    myBookings() {
      const sid = store.get(SKEY, null);
      return wait(db.bookings.filter(b => sid && b.student_id === sid).map(b => { const s = db.slots.find(x => x.id === b.slot_id), p = db.profiles.find(x => x.id === s.profe_id);
        return { code: b.code, status: b.status, paid: b.paid, people: b.people, amount: b.amount, title: s.title, starts_at: s.starts_at, duration_min: s.duration_min, location: s.location, slot_status: s.status, profe_name: p?.name, profe_avatar: p?.avatar_url, members_only: !!s.members_only,
          sport: db.class_types.find(t => t.id === s.class_type_id)?.sport || 'sup', kind: db.class_types.find(t => t.id === s.class_type_id)?.kind || 'iniciacion' }; })
        .sort((a, b) => b.starts_at.localeCompare(a.starts_at)));
    },
    updateStudent(id, patch) {
      const x = db.students.find(y => y.id === id);
      if (!isAdmin() && 'training' in patch && (x.training === 'approved' || !['none', 'requested'].includes(patch.training))) delete patch.training;
      Object.assign(x, patch); save(); return wait(null);
    },
    students: () => wait(db.students.slice().sort((a, b) => a.name.localeCompare(b.name))),
    plans: () => wait((db.plans || []).slice().sort((a, b) => a.sort - b.sort)),
    savePlan(pl) { db.plans ||= []; if (pl.id) Object.assign(db.plans.find(x => x.id === pl.id), pl); else db.plans.push({ ...pl, id: uid() }); save(); return wait(null); },
    requestPass(planId) {
      const sid = store.get(SKEY, null), pl = db.plans.find(x => x.id === planId);
      if (!sid) return fail('Entrá con tu cuenta para pedir un abono');
      if (db.passes.some(x => x.student_id === sid && x.status === 'pending')) return fail('Ya tenés un pedido de abono pendiente');
      db.passes.push({ id: uid(), student_id: sid, plan_id: pl.id, name: pl.name, price: pl.price, classes_total: pl.classes, days_valid: pl.days_valid, status: 'pending', created_at: new Date().toISOString() });
      save(); return wait(null);
    },
    myPasses() { const sid = store.get(SKEY, null); return wait(db.passes.filter(x => x.student_id === sid && x.status !== 'cancelled').map(x => ({ ...x, used: demoUsed(x.id), sport: (db.plans || []).find(p => p.id === x.plan_id)?.sport || 'sup' })).reverse()); },
    adminPasses() { return wait(db.passes.map(x => { const st2 = db.students.find(y => y.id === x.student_id) || {}; return { ...x, used: demoUsed(x.id), student_name: st2.name, student_avatar: st2.avatar_url, student_phone: st2.phone, sport: (db.plans || []).find(p => p.id === x.plan_id)?.sport || 'sup' }; }).reverse()); },

  if (c && Date.now() - c.at < 3600e3) { WX = c.data; return true; }

    const u = `https://api.open-meteo.com/v1/forecast?latitude=${w.lat}&longitude=${w.lon}&hourly=wind_speed_10m,wind_gusts_10m,precipitation_probability,temperature_2m&wind_speed_unit=kmh&timezone=America%2FArgentina%2FBuenos_Aires&forecast_days=16`;
    const r = await fetch(u); if (!r.ok) return false;
    const h = (await r.json()).hourly; WX = {};
    h.time.forEach((t, i) => { WX[t] = [Math.round(h.wind_speed_10m[i]), Math.round(h.wind_gusts_10m[i]), h.precipitation_probability[i] ?? 0, Math.round(h.temperature_2m[i])]; });
    store.set('nativo_wx', { at: Date.now(), data: WX }); return true;
  } catch { return false; }
}
function wxAt(iso) {
  if (!WX) return null;
  const d = new Date(iso), k = `${dayKey(d)}T${pad(d.getHours())}:00`;

}
// "🌬️ 18 km/h · ráf. 32 · ☔ 20% · 22°" — en naranja con ⚠️ si pasa el límite.
function wxHtml(iso) {
  const x = wxAt(iso); if (!x) return '';
  const warn = x.wind >= CONFIG.WEATHER.windWarn || x.gust >= CONFIG.WEATHER.gustWarn;
  return `<span class="wx ${warn ? 'warn' : ''}" title="Pronóstico para esa hora">${warn ? '⚠️ ' : ''}🌬️ ${x.wind} km/h · ráf. ${x.gust}${x.rain >= 20 ? ` · ☔ ${x.rain}%` : ''} · ${x.temp}°</span>`;
}

function watchDaybar() {

async function loadSeries(s) {

    && hhmm(x.starts_at) === hhmm(d) && x.capacity - x.booked >= 1);
  if (!list.length || !$('bk-rep') || st.bk?.slot?.id !== s.id) return;
  st.bk.series = list;
  const all = list.length + 1, opts = [2, 4, 8].filter(n => n < all).concat(all), def = Math.min(4, all);
  $('bk-rep').innerHTML = `<div class="field"><label class="check opt"><input type="checkbox" name="rep" onchange="stepPeople(0)"> <span><b>🔁 Reservar todos los ${DOW_LONG[d.getDay()]} ${hhmm(d)}</b>
      <span class="tiny muted" style="display:block">Hay lugar ${list.length === 1 ? 'en la semana siguiente' : `en las próximas ${list.length} semanas`} (hasta el ${esc(fmtDayShort(list[list.length - 1].starts_at))})</span></span></label>
    <div class="row" id="bk-rep-n" style="gap:8px;margin-top:8px" hidden><span class="small">¿Cuántas semanas, contando esta?</span>
      <select class="input sm" name="weeks" style="width:auto" onchange="stepPeople(0)">${opts.map(n => `<option value="${n}" ${n === def ? 'selected' : ''}>${n === all && n > 8 ? `Todas (${n})` : n}</option>`).join('')}</select></div></div>`;
}
// Qué clases se van a reservar y cuáles salen del abono (si alcanza y si la fecha entra en el abono).
function bookPlan(f) {
  const b = st.bk, n = +f.people.value, wantPass = !!f.usePass?.checked;
  const slots = [b.slot, ...(f.rep?.checked ? b.series.slice(0, +f.weeks.value - 1) : [])];
  let left = b.passLeft;
  return slots.map(s => { const use = wantPass && !!b.pass && left >= n && dayKey(s.starts_at) <= b.pass.expires_on; if (use) left -= n; return { s, use }; });
}
function stepPeople(d) {
  const f = $('bk-form'), b = st.bk, usePass = !!f.usePass?.checked;
  const max = usePass ? Math.min(b.left, b.passLeft) : b.left, n = Math.min(max, Math.max(1, +f.people.value + d));
  f.people.value = n; $('bk-people').textContent = n;
  const plan = bookPlan(f), k = plan.length, withPass = plan.filter(x => x.use).length, firstPay = plan.find(x => !x.use);
  // el cupón se aplica en 1 reserva (la primera que se paga): mismo redondeo que la base
  const disc = b.coupon && firstPay ? firstPay.s.price * n - Math.round(firstPay.s.price * n * (100 - b.coupon.pct) / 100) : 0;
  const pay = plan.filter(x => !x.use).reduce((a, x) => a + x.s.price * n, 0) - disc;
  $('bk-total-l').textContent = (k > 1 ? `${k} clases${withPass ? ` · ${withPass} con abono` : ''}` : usePass ? `Con tu abono (${n} ${n === 1 ? 'clase' : 'clases'})` : 'Total') + (disc ? ` · -${b.coupon.pct}%` : '');
  $('bk-cp')?.classList.toggle('hidden', !firstPay);
  $('bk-total').textContent = money(pay);
  $('bk-pay')?.classList.toggle('hidden', pay === 0);        // con abono no se paga nada
  if ($('bk-rep-n')) $('bk-rep-n').hidden = !f.rep?.checked;
  $('bk-btn').textContent = k > 1 ? `Reservar ${k} clases` : 'Confirmar reserva';
}
async function tryCoupon() {
  const f = $('bk-form'), code = f.coupon.value.trim().toUpperCase(), msg = $('bk-cp-msg');
  if (!code) return;
  try { st.bk.coupon = await api.checkCoupon(code, sportOf(st.bk.slot)); msg.innerHTML = `<span style="color:var(--ok)">✓ ${esc(st.bk.coupon.coupon)}: ${st.bk.coupon.pct}% de descuento${f.rep?.checked ? ' (en la primera clase)' : ''}</span>`; }

// Aplica el cupón validado a una reserva ya hecha. Si falla, la reserva queda igual (sin descuento).
async function useCoupon(code) {
  if (!st.bk?.coupon) return;
  try { await api.applyCoupon(code, st.bk.coupon.coupon); } catch (e) { toast(`La reserva quedó, pero sin el cupón: ${errMsg(e)}`); }

async function bookSeries(f, plan) {
  const btn = $('bk-btn'), n = +f.people.value, res = [];
  for (const [i, { s, use }] of plan.entries()) {
    btn.textContent = `Reservando ${i + 1} de ${plan.length}…`;
    try {
      const r = await api.book({ slot_id: s.id, name: f.name.value, phone: f.phone.value, email: f.email.value.trim(), people: n, usePass: use, pay: use ? null : f.pay?.value || null });
      rememberBooking(r.code, r.starts_at); res.push({ s, ok: true, use, code: r.code });
    } catch (e) { res.push({ s, ok: false, err: errMsg(e) }); }
  }
  const ok = res.filter(x => x.ok), cp = ok.find(x => !x.use);
  if (cp) await useCoupon(cp.code);
  if (ok.length) api.mailBooking(ok.map(x => x.code));      // un solo mail con todas las semanas
  if (!ok.length) { $('bk-err').innerHTML = `<div class="err">${esc(res[0].err)}</div>`; btn.disabled = false; stepPeople(0); return; }
  if (plan.some(x => x.use)) st.myPasses = await api.myPasses().catch(() => st.myPasses);
  if (st.student && f.phone.value.trim() !== (st.student.phone || '')) {
    api.updateStudent(st.student.id, { phone: f.phone.value.trim() }).then(() => { st.student.phone = f.phone.value.trim(); }).catch(() => {});
  }
  const s0 = plan[0].s, d = new Date(s0.starts_at);
  $('modal-body').innerHTML = `<button class="x" onclick="closeModal()" aria-label="Cerrar">✕</button><div style="text-align:center"><div class="big-emoji">🔁</div>
      <h2>¡Reservaste ${ok.length} ${ok.length === 1 ? 'clase' : 'clases'}!</h2>
      <p class="small muted">Los ${DOW_LONG[d.getDay()]} ${hhmm(d)} con ${esc(s0.profe_name)}. Las tenés en tu perfil, en "Próximas clases".</p></div>
    <div class="card" style="padding:4px 14px">${res.map(x => `<div class="row between" style="padding:8px 0;border-top:1px solid var(--line);gap:8px"><span class="small"><b>${esc(fmtDayShort(x.s.starts_at))}</b> ${hhmm(x.s.starts_at)}</span>
      <span class="small" style="text-align:right">${x.ok ? (x.use ? '✓ con abono' : '✓ reservada') : `<span style="color:var(--bad)">✕ ${esc(x.err)}</span>`}</span></div>`).join('')}</div>
    <div class="choice" style="margin-top:12px"><a class="btn coral block" href="#r-${ok[0].code}" onclick="closeModal()">Ver la primera clase</a>
      <a class="btn ghost block" href="#perfil" onclick="closeModal()">Ir a mi perfil</a></div>`;
  if ($('pub')) refreshPublic().catch(() => {});

async function submitBooking(ev, id) {
  ev.preventDefault();
  const f = ev.target, btn = $('bk-btn');
  btn.disabled = true; btn.textContent = 'Reservando…';
  try {
    const plan = bookPlan(f);
    if (plan.length > 1) return await bookSeries(f, plan);
    const usePass = !!f.usePass?.checked;
    const r = await api.book({ slot_id: id, name: f.name.value, phone: f.phone.value, email: f.email.value.trim(), people: +f.people.value, usePass, pay: usePass ? null : f.pay?.value || null });
    if (usePass) st.myPasses = await api.myPasses().catch(() => st.myPasses);
    else await useCoupon(r.code);
    api.mailBooking([r.code]);                                // mail de confirmación (si está configurado)
    rememberBooking(r.code, r.starts_at);
    if (st.student && f.phone.value.trim() !== (st.student.phone || '')) {      // guarda el WhatsApp en su perfil
      api.updateStudent(st.student.id, { phone: f.phone.value.trim() }).then(() => { st.student.phone = f.phone.value.trim(); }).catch(() => {});
    }
    st.justBooked = r.code;
    closeModal();
    location.hash = 'r-' + r.code;                          // → pantalla "Tu reserva"
  } catch (e) {
    $('bk-err').innerHTML = `<div class="err">${esc(errMsg(e))}</div>`;
    btn.disabled = false; btn.textContent = 'Confirmar reserva';
  }
}

function rememberBooking(code, starts_at) {
  const list = store.get(MINE, []).filter(x => x.code !== code && new Date(x.starts_at) > addDays(new Date(), -1));
  list.push({ code, starts_at }); store.set(MINE, list.slice(-30));
}
// Las reservas guardadas en el celu se revisan contra la base: si se borró la clase, se canceló
// o se suspendió, deja de aparecer en "Tus próximas clases"; si cambió el horario, se actualiza.
async function syncMine() {
  const list = myUpcoming(); if (!list.length) return;
  const found = await Promise.all(list.map(x => api.bookingByCode(x.code).then(r => r || null, () => undefined)));
  const drop = new Set(), moved = {};
  list.forEach((x, i) => {
    const r = found[i];
    if (r === null || (r && (r.status === 'cancelled' || r.slot_status === 'cancelled'))) drop.add(x.code);
    else if (r?.starts_at) moved[x.code] = r.starts_at;      // undefined = sin conexión: no se toca
  });
  store.set(MINE, store.get(MINE, []).filter(x => !drop.has(x.code)).map(x => moved[x.code] ? { ...x, starts_at: moved[x.code] } : x));
}
const myUpcoming = () => store.get(MINE, []).filter(x => new Date(x.starts_at) > addMin(new Date(), -120)).sort((a, b) => a.starts_at.localeCompare(b.starts_at));
const ticketUrl = code => location.origin + location.pathname + '#r-' + code;
function calLink(r) {
  const g = d => new Date(d).toISOString().replace(/[-:]|\.\d{3}/g, '');
  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent('SUP · ' + r.title + ' (Nativo)')}&dates=${g(r.starts_at)}/${g(addMin(r.starts_at, r.duration_min || 60))}`
    + `&details=${encodeURIComponent(`Reserva ${r.code} con ${r.profe_name}\n${ticketUrl(r.code)}`)}&location=${encodeURIComponent(r.location || CONFIG.LOCATION)}`;
}
function ticketState(r) {
  if (r.status === 'cancelled' || r.slot_status === 'cancelled') return ['bad', r.slot_status === 'cancelled' ? 'Clase suspendida' : 'Cancelada'];
  if (new Date(r.starts_at) < addMin(new Date(), -(r.duration_min || 60))) return ['gray', 'Clase terminada'];
  return r.paid ? ['ok', 'Confirmada · Pagada'] : ['ok', 'Confirmada'];
}

// Cancelar la propia reserva: hasta CONFIG.CANCEL_HOURS antes y si no está paga (con abono sí: vuelve al abono).
const canSelfCancel = r => r.status === 'confirmed' && r.slot_status === 'open'
  && new Date(r.starts_at) > addMin(new Date(), CONFIG.CANCEL_HOURS * 60) && (!r.paid || r.payment_method === 'abono');
async function askCancelMine() {
  const r = st.ticket; if (!r) return;
  const when = `${fmtDayLong(r.starts_at)} a las ${hhmm(r.starts_at)}`;
  if (st.student) {                        // con cuenta: si la reserva es suya no hace falta nada más
    if (!await askConfirm(`¿Cancelar tu clase del ${when}? Se libera tu lugar para otro.${r.payment_method === 'abono' ? ' La clase vuelve a tu abono.' : ''}`, 'Sí, cancelar')) return;
    try { await api.cancelMyBooking(r.code); return cancelledMine(r); }
    catch (e) { if (!/WhatsApp no coincide/.test(errMsg(e))) return toast(errMsg(e)); }
  }
  openModal(`<h2>Cancelar mi reserva</h2>
    <p class="small muted" style="margin-bottom:12px">Clase del ${esc(when)} con ${esc(r.profe_name)}. Para confirmar que sos vos, poné el WhatsApp con el que reservaste.</p>
    <div id="cm-err"></div>
    <form onsubmit="doCancelMine(event)"><div class="field"><label for="cm-phone">Tu WhatsApp</label>
      <input class="input" id="cm-phone" name="phone" type="tel" inputmode="tel" required placeholder="341 555 1234" autocomplete="tel"></div>
      <div class="sheet-foot"><button class="btn danger block" id="cm-btn">Cancelar la reserva</button></div></form>`);
}
async function doCancelMine(ev) {
  ev.preventDefault(); const r = st.ticket, btn = $('cm-btn'); btn.disabled = true;

}
function cancelledMine(r) {

    toast(r.payment_method === 'abono' ? 'Reserva cancelada: la clase volvió a tu abono' : 'Reserva cancelada. ¡Gracias por avisar!');

      <p class="small muted" style="margin:4px 0 10px">Si querés, avisale a ${r.profe_whatsapp ? esc(r.profe_name.split(' ')[0]) : 'la escuela'} (opcional).</p>
      <a class="btn wa block" href="${waLink(to, msg)}" target="_blank" rel="noopener">${ICON.wa.replace('<svg', '<svg width="20" height="20"')} Avisar por WhatsApp</a></div>`);
  });
}
// Debajo del comprobante: ficha pendiente, calificar la clase (si ya terminó) y canjear un regalo.

  const ended = addMin(r.starts_at, r.duration_min || 60) < new Date(), given = ended && !['cancelled', 'no_show'].includes(r.status) && r.slot_status !== 'cancelled';
  const live = r.status === 'confirmed' && r.slot_status === 'open' && !ended;
  const [hasW, rev, pics] = await Promise.all([live ? api.waiverStatus(r.code).catch(() => true) : true, given ? api.reviewByCode(r.code).catch(() => null) : null,
    ended ? api.photosByCode(r.code).catch(() => []) : []]);
  if (!$('tk-extra') || st.ticket?.code !== r.code) return;
  st.tkReview = rev?.stars || 0;
  $('tk-extra').innerHTML = `
    ${!hasW ? `<div class="card waiver-warn rise"><b>📝 Antes de la clase: completá tu ficha de salud y deslinde</b><div class="small">Es una sola vez, 1 minuto.</div>
      <button class="btn coral sm" style="margin-top:8px" onclick="openWaiver(${st.student ? '{ mine: true }' : `{ code: '${r.code}' }`})">Completar ahora</button></div>` : ''}
    ${pics.length ? `<div class="card rise"><b>📸 Fotos de tu clase</b><div style="margin-top:8px">${photoGrid(pics)}</div>
      <p class="tiny muted" style="margin-top:6px">Tocá una foto para verla grande y guardarla.</p></div>` : ''}
    ${given ? `<div class="card review rise"><b>${rev ? '¡Gracias por tu reseña!' : `¿Cómo estuvo tu clase con ${esc(r.profe_name.split(' ')[0])}?`}</b>
      <div class="stars" id="tk-stars">${[1, 2, 3, 4, 5].map(n => `<button type="button" onclick="setStars(${n})" aria-label="${n} estrellas" class="${n <= (rev?.stars || 0) ? 'on' : ''}">★</button>`).join('')}</div>
      <textarea class="input" id="tk-comment" maxlength="400" placeholder="Contanos qué te pareció (opcional)">${esc(rev?.comment || '')}</textarea>
      <button class="btn coral block" style="margin-top:8px" onclick="sendReview('${r.code}')">${rev ? 'Actualizar reseña' : 'Enviar reseña'}</button>
      ${rev && rev.stars >= 4 && CONFIG.GOOGLE_REVIEW_URL ? `<a class="btn ghost block" style="margin-top:8px" href="${CONFIG.GOOGLE_REVIEW_URL}" target="_blank" rel="noopener">⭐ Dejanos tu reseña en Google también</a>` : ''}</div>` : ''}
    ${live && !r.paid && +r.amount > 0 && r.payment_method !== 'abono' ? `<details class="small" style="margin-top:12px;text-align:center"><summary style="cursor:pointer">🎁 ¿Tenés un regalo (gift card)? Canjealo acá</summary>
      <form class="row" style="margin-top:8px" onsubmit="redeemOnTicket(event,'${r.code}')"><input class="input" name="gift" required placeholder="NAT-…" style="flex:1;text-transform:uppercase" autocapitalize="characters"><button class="btn coral">Canjear</button></form></details>` : ''}`;
}
function setStars(n) { st.tkReview = n; document.querySelectorAll('#tk-stars button').forEach((b, i) => b.classList.toggle('on', i < n)); }
async function sendReview(code) {
  if (!st.tkReview) return toast('Elegí de 1 a 5 estrellas');

  catch (e) {
    const box = $('pay-err');
    if (box) box.innerHTML = `<div class="err" style="margin:0">${esc(errMsg(e))}</div>`; else toast(errMsg(e));

/* ── Abonos ── */
// Precio de una clase suelta de esa disciplina (para calcular cuánto ahorra el abono). 0 = no se sabe.
const singlePrice = (sport = 'sup') => {
  const ts = (st.types || []).filter(t => t.active && !t.members_only && (t.sport || 'sup') === sport);
  const t = ts.find(x => (x.kind || 'iniciacion') === 'iniciacion') || ts[0];
  if (+t?.price) return +t.price;
  const ps = (st.pub || []).filter(x => !x.members_only && sportOf(x) === sport && +x.price).map(x => +x.price);
  return ps.length ? Math.min(...ps) : 0;
};
// Abono del alumno que cubre una fecha y todavía tiene clases.
// Disciplina del abono (la del plan; los viejos o sin plan son de SUP).
const passSport = p => p.sport || (st.plans || []).find(x => x.id === p.plan_id)?.sport || 'sup';
function activePassFor(dateIso, sport = 'sup') {
  const day = dayKey(dateIso || new Date());
  return (st.myPasses || []).filter(p => p.status === 'active' && p.starts_on <= day && day <= p.expires_on && p.classes_total - p.used > 0 && passSport(p) === sport)
    .sort((a, b) => a.expires_on.localeCompare(b.expires_on))[0] || null;
}
const fmtDate = d => new Date(d + 'T12:00').toLocaleDateString('es-AR', { day: 'numeric', month: 'long' });
function planCard(pl) {
  const one = singlePrice(pl.sport || 'sup'), save = one ? one * pl.classes - pl.price : 0;
  return `<div class="plan-card rise"><span class="pc-ic" aria-hidden="true">💳</span><div class="pc-body">
      <b class="t">${esc(pl.name)} · ${money(pl.price)}</b>
      <div class="small">${pl.classes} clases${pl.description ? ' · ' + esc(pl.description) : ''} · ${money(Math.round(pl.price / pl.classes))} c/u</div>
      ${save > 0 ? `<span class="save">Ahorrás ${money(save)}</span>` : ''}</div>
    ${passWa(pl) ? `<a class="btn dark sm" href="${passWa(pl)}" target="_blank" rel="noopener" onclick="notePassRequest('${pl.id}')">Lo quiero</a>` : `<button class="btn dark sm" onclick="wantPass('${pl.id}')">Lo quiero</button>`}</div>`;
}
// "Lo quiero" → WhatsApp de la persona que vende los abonos, con el mensaje armado.
function passWa(pl) {
  const c = sportContact(pl.sport, CONFIG.PASS_CONTACT); if (!c?.whatsapp) return '';
  const who = st.student ? ` Soy ${st.student.name}.` : '';
  return waLink(c.whatsapp, `Hola ${c.name}! Quiero el ${pl.name} (${money(pl.price)} · ${pl.classes} clases) de Nativo ${SPORTS[pl.sport || 'sup']?.em || '🏄'}.${who} ¿Cómo lo pago?`);
}
// Si el alumno tiene cuenta, además queda anotado el pedido para que el admin lo confirme con un toque.
function notePassRequest(planId) {
  if (!st.student || (st.myPasses || []).some(p => p.status === 'pending')) return;
  api.requestPass(planId).then(api.myPasses).then(ps => { st.myPasses = ps; if ($('pub') && st.pub?.length) drawPublic(); else if (location.hash === '#perfil') renderStudent(); }).catch(() => {});
}
// Días que le quedan al abono (el día de vencimiento cuenta): 1 = último día.
const passDaysLeft = p => Math.round((new Date(p.expires_on + 'T12:00') - new Date(dayKey(new Date()) + 'T12:00')) / 86400000) + 1;
const daysTxt = n => n <= 1 ? 'último día' : `${n} días`;
function myPassCard(p, compact) {
  const left = p.classes_total - p.used;
  if (p.status === 'pending') return `<div class="plan-card"><span class="pc-ic">⏳</span><div class="pc-body"><b class="t">${esc(p.name)}: pedido</b>
      <div class="small">Pagalo (${money(p.price)}) y se activan tus clases.</div></div>
      ${(c => c?.whatsapp ? `<a class="btn dark sm" href="${waLink(c.whatsapp, `Hola ${c.name || ''}! Pedí el ${p.name} (${money(p.price)}). Soy ${st.student?.name || ''}. ¿Cómo lo pago?`)}" target="_blank" rel="noopener">Escribile a ${esc(c.name || 'la escuela')}</a>` : '')(sportOwner(passSport(p)))}</div>`;
  const days = passDaysLeft(p);
  return `<div class="plan-card"><span class="pc-ic">💳</span><div class="pc-body"><b class="t">${esc(p.name)}</b>
      <div class="pass-count"><span><b class="num">${left}</b>${left === 1 ? 'clase' : 'clases'}</span><span class="${days <= 5 ? 'soon' : ''}"><b class="num">${days <= 1 ? '¡Hoy!' : days}</b>${days <= 1 ? 'último día' : 'días'}</span></div>
      <div class="pass-bar"><i style="width:${(left / p.classes_total) * 100}%"></i></div>
      <div class="small">Usaste ${p.used} de ${p.classes_total} · vence el ${fmtDate(p.expires_on)}</div></div>
      ${compact ? '' : '<a class="btn dark sm" href="#">Reservar</a>'}</div>`;
}
async function wantPass(planId) {
  if (!st.student) return loginWithGoogle({ hash: '#perfil', plan: planId });
  const pl = (st.plans || []).find(x => x.id === planId); if (!pl) return;
  if ((st.myPasses || []).some(p => p.status === 'pending')) return toast('Ya tenés un pedido de abono pendiente');

/* ── Team Nativo (entrenamiento): "Hoy entrené", racha semanal, logros propios, tablón y portal ──
   Días entrenados = sus "Hoy entrené" + los entrenamientos donde el profe lo anotó con su cuenta (lo arma la base). */
const weekKey = d => { const x = startOfDay(new Date(d)); x.setDate(x.getDate() - (x.getDay() + 6) % 7); return dayKey(x); };   // lunes de esa semana
const dk = d => new Date(String(d).slice(0, 10) + 'T12:00');
function trainStats(days = []) {
  const ds = [...new Set(days.map(d => String(d).slice(0, 10)))].sort();
  const perWeek = {}; ds.forEach(d => { const k = weekKey(dk(d)); perWeek[k] = (perWeek[k] || 0) + 1; });
  const thisW = dk(weekKey(new Date()));
  // Racha actual: semanas seguidas entrenando. La semana en curso todavía no la corta.
  let w = perWeek[dayKey(thisW)] ? thisW : addDays(thisW, -7), streak = 0;
  while (perWeek[dayKey(w)]) { streak++; w = addDays(w, -7); }
  let best = 0, run = 0, prev = null;
  Object.keys(perWeek).sort().forEach(k => { const d = dk(k); run = prev && Math.round((d - prev) / 864e5) === 7 ? run + 1 : 1; best = Math.max(best, run); prev = d; });
  let month = 0; ds.forEach((d, i) => { const lim = addDays(dk(d), -29); month = Math.max(month, ds.slice(0, i + 1).filter(x => dk(x) >= lim).length); });
  return { n: ds.length, streak, best, week: Math.max(0, ...Object.values(perWeek)), month, today: ds.includes(dayKey(new Date())),
    last8: Array.from({ length: 8 }, (_, i) => !!perWeek[dayKey(addDays(thisW, (i - 7) * 7))]) };
}
// Cada logro: [ícono, nombre, logrado, cómo se consigue, [progreso, meta]]
const teamBadges = t => [
  ['🎯', '1er entreno', t.n >= 1, 'Sumá tu primer entrenamiento con "💪 Hoy entrené".', [t.n, 1]],
  ['💪', '10 entrenos', t.n >= 10, 'Llegá a 10 entrenamientos.', [t.n, 10]],
  ['🦾', '25 entrenos', t.n >= 25, 'Llegá a 25 entrenamientos.', [t.n, 25]],
  ['🏆', '50 entrenos', t.n >= 50, 'Llegá a 50 entrenamientos.', [t.n, 50]],
  ['🔥', 'Racha 4 semanas', t.best >= 4, 'Entrená al menos 1 vez por semana, 4 semanas seguidas.', [t.best, 4]],

  ['📅', '3 en una semana', t.week >= 3, 'Entrená 3 veces en una misma semana (de lunes a domingo).', [t.week, 3]],

async function checkIn(undo) {

/* Perfil (propio o de otro): cabecera, estadísticas, team y logros */
function profileParts(me, list, days) {
  const now = new Date(), ok = b => b.status !== 'cancelled' && b.slot_status !== 'cancelled';
  const past = list.filter(b => ok(b) && b.status !== 'no_show' && new Date(b.starts_at) < now);
  const hours = past.reduce((a, b) => a + (b.duration_min || 60), 0) / 60;
  const byProfe = {}; past.forEach(b => { byProfe[b.profe_name] = (byProfe[b.profe_name] || 0) + 1; });
  // Logros por disciplina: los de SUP y los de kayak van aparte (un alumno puede hacer las dos).
  const sup = past.filter(b => (b.sport || 'sup') === 'sup'), kay = past.filter(b => b.sport === 'kayak');
  const sameProfe = list => { const c = {}; list.forEach(b => { c[b.profe_name] = (c[b.profe_name] || 0) + 1; }); return Math.max(0, ...Object.values(c)); };
  const fiel = list => sameProfe(list) >= 3;
  const hr = b => new Date(b.starts_at).getHours();
  const badges = [
    ['🏄', 'Primera remada', sup.length >= 1, 'Hacé tu primera clase de SUP.', [sup.length, 1]],
    ['🔥', '5 clases', sup.length >= 5, 'Completá 5 clases de SUP.', [sup.length, 5]],
    ['🏆', '10 clases', sup.length >= 10, 'Completá 10 clases de SUP.', [sup.length, 10]],
    ['🌅', 'Madrugador', sup.some(b => hr(b) < 9), 'Hacé una clase que empiece antes de las 9 de la mañana.'],
    ['🌇', 'Atardecer', sup.some(b => hr(b) >= 18), 'Hacé una clase que empiece a las 18 o más tarde.'],
    ['🤝', 'En grupo', sup.some(b => b.people >= 2), 'Reservá una clase para 2 personas o más: venite con alguien.'],
    ['⭐', 'Fiel a su profe', fiel(sup), 'Hacé 3 clases con el mismo profe.', [sameProfe(sup), 3]],
    ['🏅', 'Entrenamiento', me.training === 'approved', 'Sumate al grupo de entrenamiento: pedí tu 🏅 desde tu perfil.'],
  ];
  const trav = kay.filter(b => b.kind === 'travesia');
  const kBadges = [
    ['🛶', 'Primera salida', kay.length >= 1, 'Hacé tu primera salida en kayak.', [kay.length, 1]],
    ['🔥', '5 salidas', kay.length >= 5, 'Completá 5 salidas en kayak.', [kay.length, 5]],
    ['🏆', '10 salidas', kay.length >= 10, 'Completá 10 salidas en kayak.', [kay.length, 10]],
    ['🧭', 'Primera travesía', trav.length >= 1, 'Hacé tu primera travesía en kayak (las marcadas con 🧭).', [trav.length, 1]],
    ['🗺️', '3 travesías', trav.length >= 3, 'Completá 3 travesías en kayak.', [trav.length, 3]],
    ['⏱️', 'Remada larga (3 h+)', kay.some(b => (b.duration_min || 0) >= 180), 'Hacé una salida de 3 horas o más.'],
    ['🤝', 'En grupo', kay.some(b => b.people >= 2), 'Reservá una salida para 2 personas o más.'],
    ['⭐', 'Fiel a su profe', fiel(kay), 'Hacé 3 salidas con el mismo profe.', [sameProfe(kay), 3]],
  ];
  const doneK = list.some(b => b.sport === 'kayak' && b.status !== 'cancelled'), doneS = list.some(b => (b.sport || 'sup') === 'sup' && b.status !== 'cancelled');
  const grid = (title, bs) => `<div class="section"><div class="label">${title} · ${bs.filter(b => b[2]).length} de ${bs.length}</div>
      <div class="badges">${bs.map(badgeHtml).join('')}</div></div>`;
  const ig = me.instagram ? me.instagram.replace(/^@/, '') : '';
  return {
    head: `<div class="sp-cover"><svg class="waves" viewBox="0 0 2400 34" preserveAspectRatio="none" aria-hidden="true"><path d="M0 18C150 4 300 4 450 16S750 32 900 18 1050 4 1200 18 1500 32 1650 18 1950 4 2100 16 2250 30 2400 18V34H0Z"/></svg></div>
    <div class="sp-head">${avatarHtml(me, 'xl')}
      <h1>${esc(me.name)}</h1>
      <div class="tags">${me.training === 'approved' ? '<span class="pill train" style="margin:0">🏅 Team Nativo</span>' : ''}${me.level ? `<span class="pill" style="margin:0">${esc(LEVELS[me.level])}</span>` : ''}${ig ? `<a class="pill" style="margin:0;background:#fbe7f1;color:#c13584;text-decoration:none" href="https://instagram.com/${encodeURIComponent(ig)}" target="_blank" rel="noopener">@${esc(ig)}</a>` : ''}</div>
      ${me.bio ? `<p class="bio-t">${esc(me.bio)}</p>` : ''}`,
    stats: `<div class="sp-stats"><div><b class="num">${past.length}</b><span>clases</span></div><div><b class="num">${String(Math.round(hours * 10) / 10).replace('.', ',')}</b><span>horas en el agua</span></div><div><b class="num">${Object.keys(byProfe).length}</b><span>${Object.keys(byProfe).length === 1 ? 'profe' : 'profes'}</span></div></div>`,
    team: me.training === 'approved' || (days || []).length ? days : null,
    // Si la escuela tiene kayak, se ven las dos secciones (las de kayak bloqueadas hasta la primera salida).
    // Quien hace solo kayak ve primero las suyas.
    logros: (() => { const kOn = doneK || (st.types || []).some(t => t.active && !t.members_only && t.sport === 'kayak')
        || (st.plans || []).some(p => p.active && p.sport === 'kayak') || (st.pub || []).some(x => sportOf(x) === 'kayak');
      if (!kOn) return grid('Logros', badges);
      const S = grid('🏄 Logros de SUP', badges), K = grid('🛶 Logros de kayak', kBadges);
      return doneK && !doneS ? K + S : S + K; })(),
  };
}
