/* ── Agenda ── */
async function paneAgenda() {
  const now = new Date();
  const from = st.agendaPast ? addDays(startOfDay(now), -30) : startOfDay(now);
  const to = st.agendaPast ? now : addDays(startOfDay(now), 60);
  const isAdmin = st.me.role === 'admin', key = 'nativo_agenda_' + st.me.id;
  // Abre al instante con la última agenda guardada en este celu y se actualiza sola enseguida.
  const cached = !st.agendaPast && !DEMO ? store.get(key, null) : null;
  let shown = false;
  if (cached && Date.now() - cached.at < 6 * 3600e3 && !paneEl().querySelector('.sslot')) {
    st.staffSlots = cached.slots; if (!st.types?.length) st.types = cached.types || [];
    if (isAdmin && !st.allProfiles.length) st.allProfiles = cached.profiles || [];
    drawAgenda(isAdmin); shown = true;
  }
  try {
    const [slots, types, profiles] = await Promise.all([api.staffSlots(from, to), st.types?.length && !shown ? st.types : api.classTypes().catch(() => st.types || []),
      isAdmin && (!st.allProfiles.length || shown) ? api.profiles() : st.allProfiles]);
    st.staffSlots = slots; st.types = types; if (isAdmin) st.allProfiles = profiles;
    await loadAgendaExtras();
    if (!st.agendaPast && !DEMO) store.set(key, { at: Date.now(), slots, types, profiles: isAdmin ? profiles : [] });
  } catch (e) { if (!shown) paneEl().innerHTML = `<div class="err">${esc(errMsg(e))}</div>`; return; }
  if (st.tab !== 'agenda' || !$('pane')) return;
  if (shown && staffBusy()) return;              // no pisar lo que estás haciendo; se ve al cerrar
  const y = window.scrollY; drawAgenda(isAdmin); if (shown) window.scrollTo(0, y);
  if (!WX) loadWeather().then(ok => { if (ok && st.tab === 'agenda' && $('pane') && !staffBusy()) { const y2 = window.scrollY; drawAgenda(isAdmin); window.scrollTo(0, y2); } });
}
// Lista de espera y fichas de los alumnos de las clases que se ven en la agenda.
async function loadAgendaExtras() {
  const ids = st.staffSlots.filter(s => s.status !== 'cancelled' && !isPast(s)).map(s => s.id);
  const keys = [...new Set(st.staffSlots.flatMap(s => s.bookings.map(b => phoneKey(b.customer_phone))).filter(k => k.length >= 8))];
  const [wl, wv] = await Promise.all([api.slotWaitlist(ids).catch(() => []), api.waivers(keys).catch(() => null)]);
  // quien ya reservó esa clase deja de contar en la espera
  const booked = new Set(st.staffSlots.flatMap(s => s.bookings.filter(b => b.status !== 'cancelled').map(b => s.id + phoneKey(b.customer_phone))));
  st.waitBySlot = {}; wl.filter(w => !booked.has(w.slot_id + phoneKey(w.phone))).forEach(w => (st.waitBySlot[w.slot_id] ||= []).push(w));
  if (wv) { st.waiverBy = {}; wv.forEach(w => { if (!st.waiverBy[w.phone_key]) st.waiverBy[w.phone_key] = w; }); }
}
const phoneKey = p => String(p || '').replace(/\D/g, '').slice(-10);

          <div class="field"><label for="cp-until">Vence <span class="muted">(opcional)</span></label><input class="input" id="cp-until" name="until" type="date" min="${today}"></div></div>
        <div class="grid2"><div class="field"><label for="cp-max">Máximo de usos <span class="muted">(opcional)</span></label><input class="input" id="cp-max" name="max" type="number" min="1" placeholder="Sin límite"></div>

/* ── Fotos de la clase: las sube el profe, las ven los alumnos de esa clase ── */
const PHOTO_MAX = 10;
async function shrinkWide(file, max = 1600) {
  const url = URL.createObjectURL(file);
  try {
    const img = new Image(); img.src = url; await img.decode();
    const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return await new Promise(r => c.toBlob(b => r(b), 'image/jpeg', 0.82));
  } finally { URL.revokeObjectURL(url); }
}
const photoGrid = (list, del) => `<div class="photos">${list.map(p => `<div class="ph"><a href="${esc(p.url)}" target="_blank" rel="noopener"><img src="${esc(p.url)}" alt="Foto de la clase" loading="lazy"></a>
  ${del ? `<button type="button" class="ph-x" onclick="${del}('${p.id}')" aria-label="Borrar foto">✕</button>` : ''}</div>`).join('')}</div>`;
function openSlotPhotos(id) {

  st.photoSlot = id;
  openModal(`<h2>📸 Fotos de la clase</h2><div class="sum">${esc(s.title)} · ${esc(fmtDayShort(s.starts_at))} ${hhmm(s.starts_at)}</div><div id="ph-box"><div class="loading">Cargando…</div></div>`);

  try { list = await api.slotPhotos(id); } catch (e) { if ($('ph-box')) $('ph-box').innerHTML = `<div class="err">${esc(errMsg(e))}</div>`; return; }
  st.slotPhotos = list; if (!$('ph-box')) return;
  $('ph-box').innerHTML = `<p class="small muted" style="margin:0 0 10px">Las ven los alumnos de esta clase en su comprobante y en su perfil. Hasta ${PHOTO_MAX} fotos por clase.</p>
    ${list.length ? photoGrid(list, 'dropSlotPhoto') : ''}
    ${list.length < PHOTO_MAX ? `<label class="btn coral block" style="margin-top:12px" id="ph-up">📷 Subir fotos<input type="file" accept="image/*" multiple hidden onchange="uploadSlotPhotos(this)"></label>`
      : '<p class="tiny muted" style="margin-top:10px">Llegaste al máximo de fotos para esta clase.</p>'}`;

async function uploadSlotPhotos(input) {
  const id = st.photoSlot, files = [...input.files].slice(0, PHOTO_MAX - (st.slotPhotos?.length || 0)); if (!files.length) return;
  const lbl = $('ph-up'); lbl.style.pointerEvents = 'none'; let ok = 0;

}

const DOW_LONG = ['domingos', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábados'];
const bookedPeople = s => (s.bookings || []).filter(b => b.status !== 'cancelled').reduce((a, b) => a + b.people, 0);
// Las otras semanas del mismo horario fijo: mismo profe, mismo tipo, mismo día y hora, de esta clase en adelante.
async function seriesOf(s) {
  const d = new Date(s.starts_at);
  return (await api.staffSlots(addMin(d, 1), addDays(d, 400))).filter(x => x.id !== s.id && x.status === 'open' && x.profe_id === s.profe_id
    && (x.class_type_id || '') === (s.class_type_id || '') && new Date(x.starts_at).getDay() === d.getDay() && hhmm(x.starts_at) === hhmm(d));
}
async function saveSlotEdit(ev, id) {
  ev.preventDefault();
  const f = ev.target, s = st.staffSlots.find(x => x.id === id), btn = $('es-btn');
  const start = new Date(`${f.date.value}T${f.time.value}`), people = s.bookings.filter(b => b.status !== 'cancelled').reduce((a, b) => a + b.people, 0);
  if (isNaN(start)) return;
  if (+f.cap.value < people && !await askConfirm(`Ya hay ${people} anotados y el cupo nuevo es ${f.cap.value}. ¿Guardar igual?`, 'Guardar igual')) return;
  const moved = start.getTime() !== new Date(s.starts_at).getTime();
  if (moved && people && !await askConfirm(`Cambiaste el día u horario y hay ${people} ${people === 1 ? 'anotado' : 'anotados'}. Acordate de avisarles por WhatsApp. ¿Guardar?`, 'Guardar')) return;
  const patch = { title: f.title.value.trim(), starts_at: start.toISOString(), duration_min: +f.dur.value, capacity: +f.cap.value, price: +f.price.value, location: f.loc.value.trim() || null };
  if (f.profe && f.profe.value !== s.profe_id) { patch.profe_id = f.profe.value; patch.profe_pct = +((st.allProfiles || []).find(p => p.id === f.profe.value)?.commission_pct ?? s.profe_pct); }
  const series = f.all?.checked ? st.editSeries || [] : [];
  if (series.length && !await askConfirm(`Se van a cambiar ${series.length + 1} clases: esta y las de las próximas semanas en este horario.${moved ? ' Las que ya tienen anotados no se mueven de día u hora (te las muestro al final).' : ''}`, 'Cambiar todas')) return;
  btn.disabled = true;
  try {
    await api.updateSlot(id, patch);
    const delta = start - new Date(s.starts_at), kept = [];
    await Promise.all(series.map(x => {
      const n = bookedPeople(x), px = { ...patch, capacity: Math.max(patch.capacity, n) };
      if (moved && n) { kept.push(x); delete px.starts_at; } else px.starts_at = new Date(new Date(x.starts_at).getTime() + delta).toISOString();
      return api.updateSlot(x.id, px);
    }));
    const y = window.scrollY; await paneAgenda(); window.scrollTo(0, y);
    if (kept.length) openModal(`<h2>Listo, ${series.length + 1 - kept.length} clases actualizadas</h2>
      <p class="small muted">Estas tienen alumnos anotados, así que quedaron en su día y hora de antes (el resto de los cambios sí se aplicó). Avisales y movelas una por una si hace falta:</p>
      <div class="choice">${kept.map(x => `<div class="prow" style="cursor:default"><span class="who"><b>${esc(fmtDayShort(x.starts_at))} ${hhmm(x.starts_at)}</b><span>${bookedPeople(x)} anotado${bookedPeople(x) > 1 ? 's' : ''}</span></span></div>`).join('')}</div>
      <div class="sheet-foot"><button class="btn block" onclick="closeModal()">Entendido</button></div>`);
    else { closeModal(); toast(series.length ? `${series.length + 1} clases actualizadas ✓` : 'Clase actualizada ✓'); }
  }
  catch (e) { $('es-err').innerHTML = `<div class="err">${esc(errMsg(e))}</div>`; btn.disabled = false; }
}

async function forceDeleteSlot(id) {

async function deleteSuspended(id) {
  const s = st.staffSlots.find(x => x.id === id); if (!s) return;
  const paid = s.bookings.filter(b => b.paid);
  const total = paid.reduce((a, b) => a + +b.amount, 0);
  const msg = paid.length
    ? `Esta clase tiene ${paid.length} ${paid.length === 1 ? 'reserva cobrada' : 'reservas cobradas'} (${money(total)}): ${paid.map(b => b.customer_name).join(', ')}.\n\nSi ya les devolviste la plata, la marcamos como devuelta y borramos la clase.`
    : '¿Borrar esta clase suspendida? Se borran también sus reservas canceladas.';
  if (!await askConfirm(msg, paid.length ? 'Ya devolví, borrar' : 'Borrar')) return;
  try {

function buildSlots() {
  const f = $('cf'), now = new Date();
  if (f.mode.value === 'one') {
    if (!f.date.value || !f.time.value) return { rows: [] };
    const start = new Date(`${f.date.value}T${f.time.value}`);
    if (isNaN(start)) return { rows: [] };
    if (start <= now) return { error: 'Ese día y hora ya pasaron' };
    return { rows: [start] };
  }
  const wds = [...f.querySelectorAll('[name=wd]:checked')].map(x => +x.value);
  const times = f.times.value.split(/[,\s]+/).map(x => x.trim()).filter(Boolean);
  const bad = times.filter(t => !/^([01]?\d|2[0-3])[:.]\d{2}$/.test(t));
  if (bad.length) return { error: `Hora inválida: ${bad.join(', ')} (escribila así: 09:30)` };
  const out = [];
  if (!f.from.value || !f.to.value) return { rows: out };
  for (let d = new Date(f.from.value + 'T00:00'); d <= new Date(f.to.value + 'T00:00') && out.length <= 400; d = addDays(d, 1)) {
    if (!wds.includes(d.getDay())) continue;
    times.forEach(t => {
      const [h, m] = t.split(/[:.]/), start = new Date(d); start.setHours(+h, +m, 0, 0);
      if (start > now) out.push(start);
    });
  }
  return { rows: out };
}

/* ── Números: resumen (admin) / mis números (profe) ──
   Por reserva no cancelada de un horario no suspendido:
     cobrado       = Σ monto de reservas marcadas "pagó"
     parte profe   = Σ cobrado × % del profe (copiado al horario al crearlo)
     neto escuela  = cobrado − parte profe
     por cobrar    = Σ monto sin pagar (confirmada o vino)
     ocupación     = Σ personas / Σ cupo                                            */
function computeStats(slots) {
  const tot = { cobrado: 0, profe: 0, porCobrar: 0, clases: 0, alumnos: 0, cupo: 0, noShow: 0 };
  const by = {}, byType = {}, bySrc = {};
  const add = (map, key, label) => (map[key] ||= { id: key, label, cobrado: 0, profe: 0, porCobrar: 0, clases: 0, alumnos: 0, cupo: 0 });
  slots.filter(s => s.status !== 'cancelled').forEach(s => {
    const P = add(by, s.profe_id, s.profe?.name || '—'), T = add(byType, s.title, s.title);
    const act = s.bookings.filter(b => b.status !== 'cancelled');
    const people = act.filter(b => b.status !== 'no_show').reduce((a, b) => a + b.people, 0);
    const cobrado = act.filter(b => b.paid).reduce((a, b) => a + +b.amount, 0);
    const porCobrar = act.filter(b => !b.paid && b.status !== 'no_show').reduce((a, b) => a + +b.amount, 0);
    const profe = cobrado * (+s.profe_pct || 0) / 100;
    const dada = isPast(s) && people > 0 ? 1 : 0;
    for (const o of [tot, P, T]) { o.cobrado += cobrado; o.profe += profe; o.porCobrar += porCobrar; o.clases += dada; o.alumnos += people; o.cupo += s.capacity; }
    tot.noShow += act.filter(b => b.status === 'no_show').reduce((a, b) => a + b.people, 0);
    act.filter(b => b.status !== 'no_show').forEach(b => {
      const k = b.source || 'web', C = (bySrc[k] ||= { label: SOURCES[k] || k, reservas: 0, alumnos: 0, cobrado: 0 });
      C.reservas++; C.alumnos += b.people; if (b.paid) C.cobrado += +b.amount;
    });
  });
  return { tot, by: Object.values(by).sort((a, b) => b.cobrado - a.cobrado), byType: Object.values(byType).sort((a, b) => b.cobrado - a.cobrado), bySrc: Object.values(bySrc).sort((a, b) => b.alumnos - a.alumnos) };
}

const XL = (() => {
  const T = Array.from({ length: 256 }, (_, n) => { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; return c >>> 0; });
  const crc = u => { let c = ~0; for (let i = 0; i < u.length; i++) c = T[(c ^ u[i]) & 255] ^ (c >>> 8); return ~c >>> 0; };
  // ZIP sin comprimir: alcanza para Excel y no necesita librerías
  function zip(files) {
    const enc = new TextEncoder(), out = [], cd = []; let off = 0;
    for (const [name, text] of files) {
      const n = enc.encode(name), d = enc.encode(text), c = crc(d);
      const h = new DataView(new ArrayBuffer(30));
      h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x800, true); h.setUint16(12, 0x21, true);
      h.setUint32(14, c, true); h.setUint32(18, d.length, true); h.setUint32(22, d.length, true); h.setUint16(26, n.length, true);
      const e = new DataView(new ArrayBuffer(46));
      e.setUint32(0, 0x02014b50, true); e.setUint16(4, 20, true); e.setUint16(6, 20, true); e.setUint16(8, 0x800, true); e.setUint16(14, 0x21, true);
      e.setUint32(16, c, true); e.setUint32(20, d.length, true); e.setUint32(24, d.length, true); e.setUint16(28, n.length, true); e.setUint32(42, off, true);
      out.push(h, n, d); cd.push(e, n); off += 30 + n.length + d.length;
    }
    const size = cd.reduce((a, x) => a + x.byteLength, 0), end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true); end.setUint32(12, size, true); end.setUint32(16, off, true);

  }
  const x = v => String(v).replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g, '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const col = i => { let r = ''; for (i++; i; i = Math.floor((i - 1) / 26)) r = String.fromCharCode(65 + (i - 1) % 26) + r; return r; };
  // Celdas: texto, número, o { v, s } con estilo: 1 encabezado, 2 plata, 3 fecha, 4 %, 5 plata en negrita, 6 negrita
  const cellXml = (c, ref) => {
    if (c == null || c === '') return '';
    const o = typeof c === 'object' && !(c instanceof Date) ? c : { v: c }, st = o.s ? ` s="${o.s}"` : '';
    let v = o.v; if (v == null || v === '') return o.s ? `<c r="${ref}"${st}/>` : '';
    if (v instanceof Date) v = (Date.UTC(v.getFullYear(), v.getMonth(), v.getDate()) - Date.UTC(1899, 11, 30)) / 864e5;
    return typeof v === 'number' && isFinite(v) ? `<c r="${ref}"${st}><v>${v}</v></c>` : `<c r="${ref}"${st} t="inlineStr"><is><t xml:space="preserve">${x(v)}</t></is></c>`;
  };
  const sheet = ({ rows, widths = [], freeze = 1 }) => `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>

async function downloadRecord(btn, from, to, file, label) {
  const old = btn?.textContent; if (btn) { btn.disabled = true; btn.textContent = 'Armando…'; }
  try {
    const isAdmin = st.me.role === 'admin';
    const [slots, passes] = await Promise.all([api.staffSlots(from, to), isAdmin ? api.adminPasses().catch(() => []) : []]);
    if (!st.types?.length) st.types = await api.classTypes().catch(() => []);
    const H = a => a.map(v => ({ v, s: 1 })), $$ = v => ({ v: +v || 0, s: 2 }), D = d => ({ v: new Date(d), s: 3 });
    const dow = d => new Date(d).toLocaleDateString('es-AR', { weekday: 'short' }).replace('.', '');
    const spL = s => SPORTS[sportOf(s)]?.label || 'SUP';
    const live = slots.filter(s => s.status !== 'cancelled');
    // Resumen: por deporte y por profe (mismas cuentas que la pantalla de Resumen)
    const res = [[{ v: `Nativo · Registro ${label}`, s: 6 }], [`Descargado el ${new Date().toLocaleString('es-AR')}`], []];
    for (const k of Object.keys(SPORTS)) {
      const sl = slots.filter(s => sportOf(s) === k); if (!sl.length) continue;
      const { tot, by } = computeStats(sl);
      res.push([{ v: `${SPORTS[k].label}`, s: 6 }], H(['Profe', 'Clases dadas', 'Alumnos', 'Ocupación', 'Cobrado', 'A pagar profe', 'Escuela', 'Por cobrar']));
      by.forEach(p => res.push([p.label, p.clases, p.alumnos, { v: p.cupo ? p.alumnos / p.cupo : 0, s: 4 }, $$(p.cobrado), $$(p.profe), $$(p.cobrado - p.profe), $$(p.porCobrar)]));
      res.push([{ v: 'Total', s: 6 }, tot.clases, tot.alumnos, { v: tot.cupo ? tot.alumnos / tot.cupo : 0, s: 4 }, { v: tot.cobrado, s: 5 }, { v: tot.profe, s: 5 }, { v: tot.cobrado - tot.profe, s: 5 }, { v: tot.porCobrar, s: 5 }], []);
    }
    if (res.length === 3) res.push(['Sin clases en este período']);
    res.push(['Cobrado y A pagar profe cuentan solo lo marcado como pagado. A pagar profe = cobrado × % del profe en cada clase.']);
    // Clases
    const cls = [H(['Fecha', 'Día', 'Hora', 'Deporte', 'Clase', 'Profe', 'Estado', 'Cupo', 'Anotados', 'Ocupación', 'Precio', 'Cobrado', 'Por cobrar', '% profe', 'Parte profe'])];
    slots.forEach(s => { const act = s.bookings.filter(b => b.status !== 'cancelled'), ppl = act.filter(b => b.status !== 'no_show').reduce((a, b) => a + b.people, 0);
      const cob = act.filter(b => b.paid).reduce((a, b) => a + +b.amount, 0), pc = act.filter(b => !b.paid && b.status !== 'no_show').reduce((a, b) => a + +b.amount, 0), ok = s.status !== 'cancelled';
      cls.push([D(s.starts_at), dow(s.starts_at), hhmm(s.starts_at), spL(s), s.title, s.profe?.name || '', ok ? 'Abierta' : 'Suspendida', s.capacity, ppl, { v: s.capacity ? ppl / s.capacity : 0, s: 4 }, $$(s.price), $$(ok ? cob : 0), $$(ok ? pc : 0), { v: (+s.profe_pct || 0) / 100, s: 4 }, $$(ok ? cob * (+s.profe_pct || 0) / 100 : 0)]); });
    // Reservas
    const rsv = [H(['Fecha', 'Día', 'Hora', 'Deporte', 'Clase', 'Profe', 'Alumno', 'WhatsApp', 'Email', 'Personas', 'Monto', 'Estado', 'Pagado', 'Medio de pago', 'Parte profe', 'Canal', 'Nota', 'Código'])];
    slots.forEach(s => s.bookings.forEach(b => rsv.push([D(s.starts_at), dow(s.starts_at), hhmm(s.starts_at), spL(s), s.title, s.profe?.name || '', b.customer_name, b.customer_phone || '', b.customer_email || '', b.people, $$(b.amount),
      STATUS[b.status] + (s.status === 'cancelled' ? ' (clase suspendida)' : ''), b.paid ? 'sí' : 'no', b.payment_method || '', $$(b.paid && b.status !== 'cancelled' && s.status !== 'cancelled' ? b.amount * s.profe_pct / 100 : 0), SOURCES[b.source] || b.source || 'Web', b.notes || '', b.code])));
    const sheets = [{ name: 'Resumen', rows: res, widths: [26, 13, 10, 11, 14, 14, 14, 14], freeze: 0 },
      { name: 'Clases', rows: cls, widths: [11, 6, 7, 8, 24, 16, 11, 6, 9, 10, 12, 12, 12, 8, 12] },
      { name: 'Reservas', rows: rsv, widths: [11, 6, 7, 8, 24, 16, 22, 15, 22, 9, 12, 13, 8, 14, 12, 12, 24, 9] }];
    if (isAdmin) {
      const sold = passes.filter(p => p.paid_at && new Date(p.paid_at) >= from && new Date(p.paid_at) < to);
      sheets.push({ name: 'Abonos', widths: [11, 22, 15, 20, 8, 8, 8, 12, 11], rows: [H(['Cobrado el', 'Alumno', 'WhatsApp', 'Abono', 'Deporte', 'Clases', 'Usadas', 'Precio', 'Estado']),
        ...sold.map(p => [D(p.paid_at), p.student_name, p.student_phone || '', p.name, SPORTS[p.sport || 'sup']?.label || 'SUP', p.classes_total, p.used, $$(p.price), p.status === 'cancelled' ? 'Anulado' : 'Activo'])] });
    }
    const a = document.createElement('a'); a.href = URL.createObjectURL(XL.book(sheets)); a.download = `nativo-${file}.xlsx`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast(`Excel descargado: ${live.length} clases`);
  } catch (e) { toast(errMsg(e)); }
  finally { if (btn) { btn.disabled = false; btn.textContent = old; } }
}

async function addProfe(ev) {
  ev.preventDefault();
  const f = ev.target, btn = $('ap-btn'); $('ap-err').innerHTML = '';
  const raw = f.email.value.trim().toLowerCase();
  if (!validUser(raw)) { $('ap-err').innerHTML = `<div class="err">${raw.includes('@') ? 'El email no es válido' : 'El usuario tiene que tener entre 3 y 30 letras o números, sin espacios (podés usar . _ -)'}</div>`; return; }
  btn.disabled = true;
  try {
    const name = f.name.value.trim(), email = loginEmail(raw), phone = f.phone.value.trim();
    const r = await api.inviteProfe({ name, email, phone: phone || null, pct: Math.min(100, Math.max(0, +f.pct.value || 0)) });
    await paneProfes();
    if (r?.password) showCredentials({ name, email, phone, password: r.password, nuevo: true });

  } catch (e) { $('ap-err').innerHTML = `<div class="err">${esc(errMsg(e))}</div>`; btn.disabled = false; }
}

function pickPhoto(input) {
  const f = input.files?.[0]; if (!f) return;
  if (!f.type.startsWith('image/')) return toast('Elegí una imagen');
  st.pendingPhoto = f;
  const url = URL.createObjectURL(f), old = $('ph-wrap').querySelector('.avatar');
  old.outerHTML = `<img class="avatar lg" src="${url}" alt="">`;
}
function editProfe(id) {
  const p = st.allProfiles.find(x => x.id === id); if (!p) return;
  st.pendingPhoto = null;
  openModal(`<h2>Editar perfil</h2><div id="pf-err"></div>
    <form onsubmit="saveProfileForm(event,'${id}',true)">${profileFields(p, true)}

}
async function removeProfe(id) {
  const p = st.allProfiles.find(x => x.id === id); if (!p) return;
  if (!await askConfirm(`¿Sacar a ${p.name} del equipo? Ya no va a poder entrar. Si dio clases, su historial y sus números se conservan.`, 'Sacar')) return;
  try {
    const r = await api.removeProfe(id); closeModal();
    toast(r.result === 'archived' ? `${p.name} quedó de baja (su historial se conserva)` : `${p.name} ya no está en el equipo`);
    paneProfes();
  } catch (e) { toast(errMsg(e)); }
}
async function reviveProfe(id) {
  try { await api.updateProfile(id, { approved: true, archived: false, teaches: true }); toast('Reactivado ✓'); paneProfes(); } catch (e) { toast(errMsg(e)); }
}
async function saveProfileForm(ev, id, admin) {
  ev.preventDefault();
  const f = ev.target, p = admin ? st.allProfiles.find(x => x.id === id) : st.me, btn = $('pf-btn');
  const patch = { name: f.name.value.trim(), phone: f.phone.value.trim() || null, bio: f.bio.value.trim() || null, public_whatsapp: f.public_whatsapp.checked,
    pay_alias: f.pay_alias.value.trim().replace(/\s+/g, '') || null, pay_holder: f.pay_holder.value.trim() || null };
  if (f.notify_email && f.notify_email.value.trim() !== (p.notify_email || '')) patch.notify_email = f.notify_email.value.trim().toLowerCase() || null;   // solo si cambió
  if (patch.pay_alias && !/^(\d{22}|[a-zA-Z0-9.\-]{6,20})$/.test(patch.pay_alias)) { $('pf-err').innerHTML = '<div class="err">El alias tiene que tener entre 6 y 20 letras, números, puntos o guiones (o un CBU/CVU de 22 números).</div>'; return; }
  if (admin) {
    const r = f.role.value;
    if (id === st.me.id && (!f.approved.checked || r === 'profe') && !await askConfirm('Te estás sacando el acceso de admin a vos mismo. ¿Seguro?')) return;
    Object.assign(patch, { role: r === 'profe' ? 'profe' : 'admin', teaches: r !== 'admin', commission_pct: Math.min(100, Math.max(0, +f.pct.value || 0)), approved: f.approved.checked,
      sports: Object.keys(SPORTS).filter(k => f['sp_' + k]?.checked), manages: Object.keys(SPORTS).filter(k => f['mg_' + k]?.checked) });
    if (!patch.sports.length) patch.sports = ['sup'];
  }
  btn.disabled = true; btn.textContent = st.pendingPhoto ? 'Subiendo foto…' : 'Guardando…';
  try {
    if (st.pendingPhoto) patch.avatar_url = await api.uploadAvatar(id, await shrinkPhoto(st.pendingPhoto), p.avatar_url);
    await api.updateProfile(id, patch);
    st.pendingPhoto = null; toast('Perfil guardado ✓');
    if (admin) { closeModal(); if (id === st.me.id) renderStaff(); else paneProfes(); } else renderStaff();
  } catch (e) { $('pf-err').innerHTML = `<div class="err">${esc(errMsg(e))}</div>`; btn.disabled = false; btn.textContent = 'Guardar'; }
}

/* ── Buscador de alumnos (para no recorrer una lista larga) ── */
const norm = t => String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
function studentPicker(key, list, placeholder) {
  st.pickers ||= {}; st.pickers[key] = { list, sel: null };
  return `<div id="pk-${key}"><input class="input" id="pk-${key}-q" type="search" autocomplete="off" placeholder="${esc(placeholder)}" oninput="pickerFilter('${key}')" aria-label="${esc(placeholder)}">
    <div class="picker-list" id="pk-${key}-list"></div></div>`;
}
function pickerFilter(key) {
  const pk = st.pickers[key], q = norm($(`pk-${key}-q`).value).trim(), box = $(`pk-${key}-list`);
  if (!q) { box.innerHTML = ''; return; }
  const hits = pk.list.filter(x => norm(`${x.name} ${x.email || ''} ${x.phone || ''}`).includes(q)).slice(0, 8);
  box.innerHTML = hits.length ? hits.map(x => `<button type="button" onclick="pickerPick('${key}','${x.id}')">${avatarHtml(x)}<span><b>${esc(x.name)}${x.training === 'approved' ? ' 🏅' : ''}</b><br><span class="tiny muted">${esc(x.email || x.phone || '')}</span></span></button>`).join('')
    : '<p class="small muted" style="padding:6px 2px">No hay alumnos con ese nombre. Tiene que haber entrado al menos una vez con Google.</p>';
}
function pickerPick(key, id) {
  const pk = st.pickers[key], x = pk.list.find(y => y.id === id); pk.sel = id;
  if (key === 'mb' && $('mb-name')) { $('mb-name').value = x.name; if (x.phone && !$('mb-phone').value) $('mb-phone').value = x.phone; }
  $(`pk-${key}`).innerHTML = `<div class="picked">${avatarHtml(x)}<span style="flex:1;min-width:0"><b>${esc(x.name)}</b><br><span class="tiny muted">${esc(x.email || x.phone || '')}</span></span>
    <button type="button" class="btn ghost sm" onclick="pickerReset('${key}')" aria-label="Cambiar alumno">Cambiar</button></div>`;
}
function pickerReset(key) {
  const pk = st.pickers[key]; pk.sel = null;
  $(`pk-${key}`).outerHTML = studentPicker(key, pk.list, 'Buscá por nombre, email o WhatsApp…');
  $(`pk-${key}-q`).focus();
}
const pickerValue = key => st.pickers?.[key]?.sel || '';

    <div class="card"><h2>Abonos activos (${act.length})</h2>
      ${act.length > 5 ? `<input class="input" type="search" placeholder="Buscar alumno…" oninput="filterRows(this, '.act-row')" style="margin-bottom:6px" aria-label="Buscar alumno">` : ''}
      ${act.length ? act.map(p => `<div class="prow act-row" data-q="${esc(norm(p.student_name + ' ' + (p.student_phone || '')))}" style="cursor:default">${who(p)}<span>${p.classes_total - p.used} de ${p.classes_total} clases · ${passDaysLeft(p) <= 1 ? 'vence hoy' : `quedan ${passDaysLeft(p)} días`}</span>
          <span class="pass-bar" style="margin:6px 0 0;height:6px"><i style="width:${((p.classes_total - p.used) / p.classes_total) * 100}%"></i></span></span>

// Gift cards (admin): pedidos a cobrar, activas y usadas.
function giftsCard(gifts, plans) {
  if (!gifts.length) return `<div class="card"><h2>🎁 Gift cards</h2><p class="small muted">Todavía no hay regalos. Se piden desde la página con "🎁 Regalá una clase".</p></div>`;
  const what = g => `${SPORTS[g.sport || 'sup']?.em || ''} ${g.kind === 'abono' ? (plans.find(p => p.id === g.plan_id)?.name || 'Abono') : `1 clase de ${SPORTS[g.sport]?.label || 'SUP'}`}`.trim();
  const pend = gifts.filter(g => g.status === 'pending'), act = gifts.filter(g => g.status === 'active'), used = gifts.filter(g => ['redeemed', 'cancelled'].includes(g.status));
  const row = (g, acts) => `<div class="prow" style="cursor:default;align-items:flex-start"><span class="who"><b>${esc(what(g))} · ${money(g.value)}</b>
      <span>${esc(g.code)} · de ${esc(g.buyer_name)} para ${esc(g.recipient_name)}${g.status === 'redeemed' ? ` · usado ${esc(fmtDate(dayKey(g.redeemed_at)))}` : g.status === 'cancelled' ? ' · anulado' : ''}</span></span>
      <span class="row" style="flex:none;gap:4px">${acts}</span></div>`;
  return `<div class="card ${pend.length ? 'unpaid' : ''}"><h2>🎁 Gift cards ${pend.length ? `<span class="pill warn">${pend.length} a cobrar</span>` : ''}</h2>
    ${pend.map(g => row(g, `<a class="btn ghost sm" href="${waLink(g.buyer_phone, `Hola ${g.buyer_name.split(' ')[0]}! Te escribo de Nativo por la gift card ${g.code} (${what(g)}, ${money(g.value)}).`)}" target="_blank" rel="noopener">WhatsApp</a>
      <button class="btn sm" onclick="giftPaid('${g.id}')">Cobrado</button><button class="btn ghost sm" onclick="giftCancel('${g.id}')" aria-label="Anular">✕</button>`)).join('')}
    ${act.length ? `<div class="label" style="margin-top:12px">Activas, sin usar (${act.length})</div>${act.map(g => row(g, `<a class="btn ghost sm" href="${waLink(g.buyer_phone, giftMsg(g, what(g)))}" target="_blank" rel="noopener">Reenviar link</a>`)).join('')}` : ''}
    ${used.length ? `<details style="margin-top:10px"><summary class="small" style="cursor:pointer">Usadas o anuladas (${used.length})</summary>${used.map(g => row(g, '')).join('')}</details>` : ''}
    <p class="tiny muted" style="margin-top:8px">La plata de cada regalo se cuenta en el Resumen cuando se usa (como clase o abono).</p></div>`;
}
const giftMsg = (g, what) => `Hola ${g.buyer_name.split(' ')[0]}! Ya está activa tu gift card de Nativo 🎁 (${what}) para ${g.recipient_name}. Pasale este link: ${location.origin}/#g-${g.code}`;

  planPreview(document.querySelector('#modal-body form'));
}
function planPreview(f) { if ($('ep-prev')) $('ep-prev').innerHTML = +f.classes.value > 0 ? `Cada clase sale <b>${money(Math.round(+f.price.value / +f.classes.value))}</b>` : ''; }
async function savePlanForm(ev, id, sport) {
  ev.preventDefault(); const f = ev.target, btn = $('ep-btn');
  const pl = { name: f.name.value.trim(), price: +f.price.value, classes: +f.classes.value, days_valid: +f.days.value, description: f.desc.value.trim() || null, active: f.active.checked, sport };
  if (id) pl.id = id; else pl.sort = (st.plans || []).length + 1;
  btn.disabled = true;
  try { await api.savePlan(pl); closeModal(); toast('Abono guardado ✓'); paneAbonos(); }
  catch (e) { $('ep-err').innerHTML = `<div class="err">${esc(errMsg(e))}</div>`; btn.disabled = false; }
}
function confirmPass(id) {
  const p = st.adminPasses.find(x => x.id === id);
  openModal(`<h2>Cobrar ${esc(p.name)}</h2><div class="sum"><b>${esc(p.student_name)}</b><div class="total" style="margin:6px 0 0"><span>Monto</span><b class="num">${money(p.price)}</b></div></div>
    <div class="label">¿Cómo pagó?</div>
    <div class="choice">${METHODS.map(m => `<button class="btn ghost block" onclick="doConfirmPass('${id}','${m}')">${cap(m)}</button>`).join('')}</div>`);
}
async function doConfirmPass(id, m) {
  try { await api.activatePass(id, m); closeModal(); toast('Abono activado ✓'); paneAbonos(); } catch (e) { toast(errMsg(e)); }
}
async function dropPass(id, active) {
  const p = st.adminPasses.find(x => x.id === id);
  const fut = active ? await api.passFutureBookings(id).catch(() => 0) : 0;
  if (!await askConfirm(active
      ? `¿Anular el abono de ${p.student_name}? Le quedan ${p.classes_total - p.used} clases sin usar.${fut ? `\n\nTiene ${fut} ${fut === 1 ? 'reserva próxima hecha' : 'reservas próximas hechas'} con este abono: ${fut === 1 ? 'queda' : 'quedan'} "a cobrar" con el precio normal.` : ''}\n\nSi fue un error, lo podés reactivar después.`
      : `¿Rechazar el pedido de ${p.student_name}?`, active ? 'Anular' : 'Rechazar')) return;
  try { const n = await api.cancelPass(id); toast(active ? `Abono anulado${n ? ` · ${n} ${n === 1 ? 'reserva pasó' : 'reservas pasaron'} a "a cobrar"` : ''}` : 'Pedido rechazado'); paneAbonos(); } catch (e) { toast(errMsg(e)); }
}
async function undoPass(id) {
  try { await api.reactivatePass(id); toast('Abono reactivado ✓'); paneAbonos(); } catch (e) { toast(errMsg(e)); }
}
// Filtra filas de una lista mientras se escribe (sin tildes ni mayúsculas).
function filterRows(input, sel) {
  const q = norm(input.value).trim();
  input.parentElement.querySelectorAll(sel).forEach(r => { r.style.display = !q || r.dataset.q.includes(q) ? '' : 'none'; });
}
async function givePass() {
  const sid = pickerValue('gp'), pid = $('gp-plan').value, m = document.querySelector('[name=gp-method]:checked')?.value || 'efectivo';
  if (!sid) return toast('Elegí un alumno');
  try { await api.grantPass(sid, pid, m); toast('Abono dado ✓'); paneAbonos(); } catch (e) { toast(errMsg(e)); }
}

/* ── Tipos de clase (admin) ── */
async function paneTypes() {
  try { st.types = await api.classTypes(); } catch (e) { paneEl().innerHTML = `<div class="err">${esc(errMsg(e))}</div>`; return; }
  const admin = st.me.role === 'admin', can = admin ? Object.keys(SPORTS) : (st.me.manages || []);
  const mine = st.types.filter(t => can.includes(t.sport || 'sup'));
  const card = t => `<button class="ecard ${t.active === false ? 'off' : ''}" onclick="editType('${t.id}')">
      <span class="et"><b>${SPORTS[t.sport || 'sup']?.em || ''} ${esc(t.name)}</b>
        <span class="tags">${t.members_only ? '<span class="pill train-p">🏅 Entrenamiento</span>' : ''}${t.kind === 'travesia' ? '<span class="pill trav-p">🧭 Travesía</span>' : ''}${t.active === false ? '<span class="pill gray">Pausada</span>' : ''}</span>
        <span class="small muted">${money(t.price)} · cupo ${t.capacity} · ${t.duration_min} min</span>
        ${t.description ? `<span class="tiny muted ell">${esc(t.description)}</span>` : ''}</span>
      <span class="chev" aria-hidden="true">✏️</span></button>`;
  paneEl().innerHTML = `<p class="small muted" style="margin:0 0 12px">Son los valores que se sugieren al crear una clase. Cambiarlos no modifica las clases ya cargadas: para esas usá <b>Editar clase → Aplicar a todas las semanas</b>.</p>
    ${can.map(k => { const ts = mine.filter(t => (t.sport || 'sup') === k); return `<div class="mgroup"><div class="label">${SPORTS[k].em} ${SPORTS[k].label}</div>
      <div style="display:grid;gap:8px">${ts.map(card).join('') || '<p class="small muted">Todavía no hay tipos de clase.</p>'}
      <button class="btn ghost block" onclick="editType('', '${k}')">+ Agregar tipo de clase de ${SPORTS[k].label}</button></div></div>`; }).join('')}`;
}
function editType(id, sport) {
  const admin = st.me.role === 'admin', can = admin ? Object.keys(SPORTS) : (st.me.manages || []);
  const t = st.types.find(x => x.id === id) || { sport: sport || can[0], kind: 'iniciacion', duration_min: 60, capacity: 4, price: 0, active: true };
  openModal(`<h2>${id ? 'Editar tipo de clase' : 'Nuevo tipo de clase'}</h2><div id="et-err"></div>
    <form onsubmit="saveTypeForm(event,'${id || ''}')">
      <div class="field"><label for="et-name">Nombre</label><input class="input" id="et-name" name="name" required maxlength="60" value="${esc(t.name || '')}" placeholder="Clase de iniciación"></div>
      ${can.length > 1 ? `<div class="field"><span class="flabel">Deporte</span><div class="seg">${can.map(k => `<label><input type="radio" name="sport" value="${k}" ${(t.sport || 'sup') === k ? 'checked' : ''}>${SPORTS[k].em} ${SPORTS[k].label}</label>`).join('')}</div></div>`
        : `<input type="hidden" name="sport" value="${can[0]}">`}
      <div class="field"><span class="flabel">Tipo</span><div class="seg">${Object.entries(KINDS).map(([k, l]) => `<label><input type="radio" name="kind" value="${k}" ${(t.kind || 'iniciacion') === k ? 'checked' : ''}>${l}</label>`).join('')}</div>
        <div class="tiny muted" style="margin-top:4px">Las travesías se resaltan en la página con otro color.</div></div>
      <div class="grid2"><div class="field"><label for="et-price">Precio por persona</label><input class="input" id="et-price" name="price" type="number" inputmode="numeric" min="0" step="500" required value="${+t.price || 0}"></div>
        <div class="field"><label for="et-cap">Cupo</label><input class="input" id="et-cap" name="cap" type="number" inputmode="numeric" min="1" required value="${t.capacity || 1}"></div></div>
      <div class="field"><label for="et-dur">Duración (minutos)</label><input class="input" id="et-dur" name="dur" type="number" inputmode="numeric" min="15" step="15" required value="${t.duration_min || 60}"></div>
      <div class="field"><label for="et-desc">Descripción <span class="muted">(la ven los alumnos)</span></label><textarea class="input" id="et-desc" name="desc" maxlength="300" rows="2" placeholder="Primera vez arriba de la tabla. Tabla, remo y chaleco incluidos.">${esc(t.description || '')}</textarea></div>
      <label class="check" style="margin-bottom:8px"><input type="checkbox" name="active" ${t.active !== false ? 'checked' : ''}> Activa <span class="muted small">(si la pausás, no aparece para crear clases)</span></label>
      ${admin ? `<label class="check" style="margin-bottom:14px"><input type="checkbox" name="members" ${t.members_only ? 'checked' : ''}> 🏅 Es de entrenamiento <span class="muted small">(en la página se ve en violeta y lleva al WhatsApp de ${esc(CONFIG.TRAINING_CONTACT?.name || 'la escuela')})</span></label>` : ''}
      <div class="sheet-foot"><button class="btn coral block" id="et-btn">Guardar</button></div></form>`);
}
async function saveTypeForm(ev, id) {
  ev.preventDefault(); const f = ev.target, btn = $('et-btn');
  const ct = { name: f.name.value.trim(), sport: f.sport.value, kind: f.kind.value, price: +f.price.value, capacity: +f.cap.value, duration_min: +f.dur.value,
    description: f.desc.value.trim() || null, active: f.active.checked };
  if (f.members) ct.members_only = f.members.checked;
  if (id) ct.id = id; else ct.sort = st.types.length + 1;
  btn.disabled = true;
  try { await api.saveClassType(ct); closeModal(); toast('Guardado ✓'); paneTypes(); }
  catch (e) { $('et-err').innerHTML = `<div class="err">${esc(errMsg(e))}</div>`; btn.disabled = false; }
}

/* ── Mi perfil ── */
function paneProfile() {
  st.pendingPhoto = null;
  paneEl().innerHTML = `<div class="card" style="max-width:520px"><h2>Mi perfil</h2><div id="pf-err"></div>
    <form onsubmit="saveProfileForm(event,'${st.me.id}',false)">${profileFields(st.me, false)}
      ${teaches(st.me) ? `<p class="tiny muted" style="margin:-6px 0 12px">Tu parte: ${+st.me.commission_pct}% de lo cobrado.</p>` : ''}
      <button class="btn coral block" id="pf-btn">Guardar</button></form></div>
    <details class="card more" style="max-width:520px"><summary>Cambiar mi contraseña</summary>
      <form onsubmit="changeMyPassword(event)" style="margin-top:12px"><div id="cp-err"></div>
        <div class="field"><label for="cp-1">Contraseña nueva</label><input class="input" id="cp-1" name="pw" type="password" required minlength="6" autocomplete="new-password"></div>
        <div class="field"><label for="cp-2">Repetila</label><input class="input" id="cp-2" name="pw2" type="password" required minlength="6" autocomplete="new-password"></div>
        <button class="btn block" id="cp-btn">Cambiar contraseña</button></form></details>`;
}
async function changeMyPassword(ev) {
  ev.preventDefault(); const f = ev.target;
  if (f.pw.value !== f.pw2.value) { $('cp-err').innerHTML = '<div class="err">Las contraseñas no coinciden</div>'; return; }
  $('cp-btn').disabled = true;
  try { await api.setPassword(f.pw.value); f.reset(); $('cp-err').innerHTML = ''; toast('Contraseña cambiada ✓'); }
  catch (e) { $('cp-err').innerHTML = `<div class="err">${esc(errMsg(e))}</div>`; }
  finally { $('cp-btn').disabled = false; }
}

/* ════════════════════════════ ARRANQUE ════════════════════════════ */
if (DEMO) $('demo-bar').classList.remove('hidden');
api.onAuth(() => { if (location.hash.startsWith('#staff')) renderStaff(); else refreshAccount(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
// Vuelta desde un mail de invitación / recuperar contraseña → ir directo al área de profes.
// Primero dejamos que Supabase lea el token del link; recién después limpiamos la URL.
// Links directos: /kayak abre la pestaña Kayak; /c/<id> abre esa clase para reservar.
// (El servidor arma la vista previa de WhatsApp; acá dejamos la URL en "/" para que todo lo demás funcione igual.)
{ const cm = /^\/c\/([0-9a-f-]{36})\/?$/i.exec(location.pathname), km = /^\/(kayak|sup)\/?$/i.exec(location.pathname);
  if (cm) st.openSlot = cm[1].toLowerCase();
  if (km) st.fSport = km[1].toLowerCase();
  if (cm || km) history.replaceState(null, '', '/' + location.search + location.hash); }
// Service worker (abre rápido y aguanta mala señal). Solo en el sitio real, no en la demo.
if ('serviceWorker' in navigator && location.protocol === 'https:' && !DEMO) addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
const QS = new URLSearchParams(location.search);
if (QS.has('code') || QS.has('error_description')) {
  // Vuelta desde Google: supabase-js canjea el ?code= por la sesión; después seguimos donde estaba.
  const err = QS.get('error_description');
  api.ready().finally(() => {
    history.replaceState(null, '', location.pathname + location.hash);
    if (err) { toast('No se pudo entrar con Google: ' + err); refreshAccount(); route(); } else finishLogin();
  });
} else if (AUTH_LINK || QS.has('staff')) {
  (AUTH_LINK && api.ready ? api.ready() : Promise.resolve()).finally(() => {
    history.replaceState(null, '', location.pathname + '#staff'); route();
  });
} else { route(); refreshAccount(); }
(() => {                                                    // vuelta desde Mercado Pago
  const u = new URLSearchParams(location.search), r = u.get('pago');
  if (!r) return;
  const code = (u.get('code') || '').replace(/[^0-9A-Fa-f]/g, '').slice(0, 6).toUpperCase();
  history.replaceState(null, '', location.pathname + location.hash);
  setTimeout(() => showPayResult(r, code), 400);
})();
</script>
